                                  Text("Профиль на ФХМ", color = KhlAccentRed)
                              }
                              TextButton(onClick = { selectedPlayer = null }) {
                                  Text("Закрыть", color = KhlIceBlue)
                              }
                          }
                      }
                  )
              }

              selectedTeamRow?.let { row ->
                  AlertDialog(
                      onDismissRequest = { selectedTeamRow = null },
                      containerColor = KhlCardDark,
                      title = {
                          Row(verticalAlignment = Alignment.CenterVertically) {
                              AsyncImage(
                                  model = row.logoUrl,
                                  contentDescription = row.teamName,
                                  contentScale = ContentScale.Fit,
                                  modifier = Modifier.size(44.dp).clip(CircleShape).background(Color.White.copy(alpha = 0.1f)).padding(4.dp)
                              )
                              Spacer(modifier = Modifier.width(10.dp))
                              Column {
                                  Text(row.teamName, color = Color.White, fontSize = 15.sp, fontWeight = FontWeight.Bold)
                                  Text("${row.groupName} • ${row.position} место", color = KhlIceBlue, fontSize = 12.sp)
                              }
                          }
                      },
                      text = {
                          Column(verticalArrangement = Arrangement.spacedBy(8.dp)) {
                              Row(
                                  modifier = Modifier
                                      .fillMaxWidth()
                                      .clip(RoundedCornerShape(10.dp))
                                      .background(KhlBgDark)
                                      .padding(12.dp),
                                  horizontalArrangement = Arrangement.SpaceEvenly
                              ) {
                                  StatMiniBox("ИГРЫ", row.games.toString())
                                  StatMiniBox("ПОБЕДЫ", row.wins.toString())
                                  StatMiniBox("ШАЙБЫ", "${row.pucksScored}-${row.pucksMissed}")
                                  StatMiniBox("ОЧКИ", row.points.toString(), highlight = true)
                              }
                              if (row.tieBreakNote.isNotEmpty()) {
                                  Text(row.tieBreakNote, color = KhlTextGray, fontSize = 12.sp)
                              }
