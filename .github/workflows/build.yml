name: Build FHM v2.5 APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download Gradle 8.7 directly
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle-8.7-bin.zip -d /tmp
          echo "/tmp/gradle-8.7/bin" >> $GITHUB_PATH

      - name: Generate v2.5 project
        run: |
          rm -rf app settings.gradle.kts build.gradle.kts gradle.properties
          mkdir -p app/src/main/java/com/fhm/khlstyle

          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "FHM_KHL_V25"
          include(":app")
          EOF

          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          EOF

          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.fhm.khlstyle"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.fhm.khlstyle"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 25
                  versionName = "2.5"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
              buildFeatures {
                  compose = true
              }
              composeOptions {
                  kotlinCompilerExtensionVersion = "1.5.14"
              }
          }

          dependencies {
              val composeBom = platform("androidx.compose:compose-bom:2024.06.00")
              implementation(composeBom)
              implementation("androidx.activity:activity-compose:1.9.0")
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-graphics")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-extended")
              implementation("org.jsoup:jsoup:1.17.2")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1")
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:allowBackup="false"
                  android:icon="@android:drawable/sym_def_app_icon"
                  android:label="ФХМ 54 (v2.5)"
                  android:supportsRtl="true"
                  android:usesCleartextTraffic="true"
                  android:theme="@android:style/Theme.Material.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/fhm/khlstyle/MainActivity.kt
          package com.fhm.khlstyle

          import android.annotation.SuppressLint
          import android.content.ClipData
          import android.content.ClipboardManager
          import android.content.Context
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import android.widget.Toast
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.foundation.background
          import androidx.compose.foundation.clickable
          import androidx.compose.foundation.horizontalScroll
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.LazyColumn
          import androidx.compose.foundation.lazy.items
          import androidx.compose.foundation.rememberScrollState
          import androidx.compose.foundation.shape.CircleShape
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.material.icons.Icons
          import androidx.compose.material.icons.filled.Code
          import androidx.compose.material.icons.filled.ContentCopy
          import androidx.compose.material.icons.filled.EmojiEvents
          import androidx.compose.material.icons.filled.FormatListNumbered
          import androidx.compose.material.icons.filled.Public
          import androidx.compose.material.icons.filled.Refresh
          import androidx.compose.material.icons.filled.SportsHockey
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.draw.clip
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.platform.LocalContext
          import androidx.compose.ui.text.font.FontFamily
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.text.style.TextAlign
          import androidx.compose.ui.text.style.TextOverflow
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import androidx.compose.ui.viewinterop.AndroidView
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.launch
          import kotlinx.coroutines.suspendCancellableCoroutine
          import kotlinx.coroutines.withContext
          import kotlinx.coroutines.withTimeoutOrNull
          import org.json.JSONObject
          import org.json.JSONTokener
          import org.jsoup.Jsoup
          import org.jsoup.nodes.Document
          import kotlin.coroutines.resume

          data class HockeyMatch(
              val id: String,
              val homeTeam: String,
              val awayTeam: String,
              val scoreText: String,
              val infoLine: String,
              val status: String,
              val rawDetails: String
          )

          data class ParsedTable(
              val title: String,
              val headers: List<String>,
              val rows: List<List<String>>
          )

          data class TournamentPageData(
              val url: String,
              val tournamentTitle: String,
              val matches: List<HockeyMatch>,
              val tables: List<ParsedTable>,
              val playerRows: List<List<String>>,
              val diagnosticReport: String
          )

          object FhmTournamentParser {
              private val SCORE_REGEX = Regex("([0-9]+)\\s*[:\\-]\\s*([0-9]+)")

              suspend fun loadTournament(
                  context: Context,
                  tournamentId: String,
                  actionMode: Int
              ): TournamentPageData {
                  val tabParam = when (actionMode) {
                      0 -> 1
                      1 -> 2
                      else -> 4
                  }
                  val targetUrl = "https://fhmoscow.com/tournament/$tournamentId?tournament-tab=$tabParam"

                  val pairResult = fetchInteractiveDomViaWebView(context, targetUrl, actionMode)
                  val renderedHtml = pairResult.first
                  val apiLogs = pairResult.second

                  if (renderedHtml.isEmpty()) {
                      return TournamentPageData(
                          url = targetUrl,
                          tournamentTitle = "Ошибка загрузки fhmoscow.com",
                          matches = emptyList(),
                          tables = emptyList(),
                          playerRows = emptyList(),
                          diagnosticReport = "Не удалось получить DOM страницы $targetUrl"
                      )
                  }

                  val doc = Jsoup.parse(renderedHtml, targetUrl)

                  // Скачиваем и анализируем JS-бандл сайта ФХМ, чтобы увидеть внутренние URL подгрузки таблиц и матчей
                  val jsBundleReport = withContext(Dispatchers.IO) {
                      val sb = StringBuilder()
                      try {
                          val scripts = doc.select("script[src]")
                          for (s in scripts) {
                              val src = s.attr("abs:src")
                              if (src.contains("app.")) {
                                  sb.append("JS Bundle URL: ").append(src).append("\n")
                                  val jsBody = Jsoup.connect(src)
                                      .userAgent("Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 Chrome/124.0.0.0 Mobile Safari/537.36")
                                      .ignoreContentType(true)
                                      .maxBodySize(0)
                                      .timeout(10000)
                                      .execute()
                                      .body()
                                  sb.append("Размер JS: ").append(jsBody.length).append(" символов\n")

                                  val keywords = listOf(
                                      "standings-content",
                                      "standings-group",
                                      "tournament-table",
                                      "match-cards",
                                      "best-players-block",
                                      "people-scroll"
                                  )
                                  for (kw in keywords) {
                                      var pos = jsBody.indexOf(kw)
                                      var count = 0
                                      while (pos >= 0 && count < 2) {
                                          val start = if (pos > 160) pos - 160 else 0
                                          val end = if (pos + 340 < jsBody.length) pos + 340 else jsBody.length
                                          sb.append("\n--- КОД МОДУЛЯ [").append(kw).append(" #").append(count + 1).append("] ---\n")
                                          sb.append(jsBody.substring(start, end)).append("\n")
                                          pos = jsBody.indexOf(kw, pos + kw.length)
                                          count++
                                      }
                                  }
                              }
                          }
                      } catch (e: Exception) {
                          sb.append("Ошибка чтения JS: ").append(e.localizedMessage ?: "err")
                      }
                      sb.toString()
                  }

                  return parseFhmSpaDocument(doc, targetUrl, actionMode, apiLogs, jsBundleReport)
              }

              @SuppressLint("SetJavaScriptEnabled")
              private suspend fun fetchInteractiveDomViaWebView(
                  context: Context,
                  url: String,
                  actionMode: Int
              ): Pair<String, String> {
                  return withContext(Dispatchers.Main) {
                      val result: Pair<String, String>? = withTimeoutOrNull<Pair<String, String>>(24000L) {
                          suspendCancellableCoroutine<Pair<String, String>> { cont ->
                              val webView = WebView(context)
                              webView.settings.javaScriptEnabled = true
                              webView.settings.domStorageEnabled = true
                              webView.settings.userAgentString =
                                  "Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Mobile Safari/537.36"

                              var finished = false
                              val mainHandler = Handler(Looper.getMainLooper())

                              val hooksJs = "(function() {" +
                                  "window.__fhmApiCalls = window.__fhmApiCalls || [];" +
                                  "if (!window.__fhmHooked) {" +
                                  "  window.__fhmHooked = true;" +
                                  "  var origFetch = window.fetch;" +
                                  "  if (origFetch) {" +
                                  "    window.fetch = function() {" +
                                  "      var u = arguments[0];" +
                                  "      return origFetch.apply(this, arguments).then(function(resp) {" +
                                  "        try { resp.clone().text().then(function(txt) { window.__fhmApiCalls.push('FETCH: ' + u + ' -> ' + txt.substring(0, 300)); }); } catch(e) {}" +
                                  "        return resp;" +
                                  "      });" +
                                  "    };" +
                                  "  }" +
                                  "  var origOpen = XMLHttpRequest.prototype.open;" +
                                  "  XMLHttpRequest.prototype.open = function(m, u) { this._url = u; return origOpen.apply(this, arguments); };" +
                                  "  var origSend = XMLHttpRequest.prototype.send;" +
                                  "  XMLHttpRequest.prototype.send = function() {" +
                                  "    var self = this;" +
                                  "    this.addEventListener('load', function() {" +
                                  "      try { window.__fhmApiCalls.push('XHR: ' + self._url + ' -> ' + (self.responseText || '').substring(0, 300)); } catch(e) {}" +
                                  "    });" +
                                  "    return origSend.apply(this, arguments);" +
                                  "  };" +
                                  "}" +
                                  "})();"

                              val clickJs = "(function() {" +
                                  "var mode = " + actionMode + ";" +
                                  "var tTabs = document.querySelectorAll('.tournament-tab');" +
                                  "if (tTabs.length > mode) { tTabs[mode].click(); }" +
                                  "if (mode === 0) {" +
                                  "  var mTabs = document.querySelectorAll('.match-tab');" +
                                  "  if (mTabs.length > 1) { mTabs[1].click(); }" +
                                  "}" +
                                  "var summaries = document.querySelectorAll('details.standings-group > summary');" +
                                  "for (var i = 0; i < summaries.length; i++) { try { summaries[i].click(); } catch(e) {} }" +
                                  "var blueBtns = document.querySelectorAll('button.button-blue');" +
                                  "for (var j = 0; j < blueBtns.length; j++) { try { blueBtns[j].click(); } catch(e) {} }" +
                                  "})();"

                              val dumpJs = "(function() {" +
                                  "var logs = (window.__fhmApiCalls || []).join('\\n===\\n');" +
                                  "return JSON.stringify({ html: document.documentElement.outerHTML, logs: logs });" +
                                  "})();"

                              webView.webViewClient = object : WebViewClient() {
                                  override fun onPageFinished(view: WebView?, loadedUrl: String?) {
                                      if (finished) return
                                      webView.evaluateJavascript(hooksJs, null)

                                      mainHandler.postDelayed({
                                          if (!finished && cont.isActive) {
                                              webView.evaluateJavascript(clickJs, null)
                                          }
                                      }, 1200L)

                                      mainHandler.postDelayed({
                                          if (!finished && cont.isActive) {
                                              finished = true
                                              webView.evaluateJavascript(dumpJs) { rawJson ->
                                                  var htmlOut = ""
                                                  var logsOut = ""
                                                  try {
                                                      if (rawJson != null) {
                                                          val unquoted = JSONTokener(rawJson).nextValue()?.toString() ?: ""
                                                          val obj = JSONObject(unquoted)
                                                          htmlOut = obj.optString("html", "")
                                                          logsOut = obj.optString("logs", "")
                                                      }
                                                  } catch (e: Exception) {
                                                      htmlOut = ""
                                                  }
                                                  webView.destroy()
                                                  if (cont.isActive) {
                                                      cont.resume(Pair(htmlOut, logsOut))
                                                  }
                                              }
                                          }
                                      }, 5500L)
                                  }
                              }

                              cont.invokeOnCancellation {
                                  mainHandler.removeCallbacksAndMessages(null)
                                  webView.stopLoading()
                                  webView.destroy()
                              }

                              webView.loadUrl(url)
                          }
                      }
                      result ?: Pair("", "")
                  }
              }

              private fun parseFhmSpaDocument(
                  doc: Document,
                  url: String,
                  actionMode: Int,
                  apiLogs: String,
                  jsBundleReport: String
              ): TournamentPageData {
                  val h1 = doc.select("h1, h2").firstOrNull()?.text()?.trim() ?: "Кубок г. Москвы"
                  val parsedTables = mutableListOf<ParsedTable>()
                  val extractedMatches = mutableListOf<HockeyMatch>()
                  val extractedPlayers = mutableListOf<List<String>>()

                  val standingGroups = doc.select(".standings-group")
                  for (gIdx in 0 until standingGroups.size) {
                      val groupEl = standingGroups[gIdx]
                      val groupTitle = groupEl.select("summary").firstOrNull()?.text()?.trim()
                          ?: "Группа #${gIdx + 1}"

                      val rows = mutableListOf<List<String>>()
                      val candidateRows = groupEl.select("tr, [class*=row], [class*=item], [class*=team]")
                      for (rEl in candidateRows) {
                          val childrenTexts = mutableListOf<String>()
                          for (ch in rEl.children()) {
                              val t = ch.text().trim()
                              if (t.isNotEmpty()) childrenTexts.add(t)
                          }
                          if (childrenTexts.size >= 3) {
                              rows.add(childrenTexts)
                          }
                      }

                      if (rows.isEmpty()) {
                          val leafEls = groupEl.select("span, div, a, td")
                          val leafTexts = mutableListOf<String>()
                          for (lEl in leafEls) {
                              if (lEl.childrenSize() == 0) {
                                  val t = lEl.text().trim()
                                  if (t.isNotEmpty()) leafTexts.add(t)
                              }
                          }
                          if (leafTexts.isNotEmpty()) {
                              rows.add(leafTexts.take(20))
                          }
                      }

                      parsedTables.add(
                          ParsedTable(
                              title = groupTitle,
                              headers = listOf("#", "Команда / Данные группы"),
                              rows = rows
                          )
                      )
                  }

                  val wrappers = doc.select(".tournament-wrapper")
                  for (wIdx in 0 until wrappers.size) {
                      val w = wrappers[wIdx]
                      val allDivs = w.select("div, a, li, tr")
                      for (el in allDivs) {
                          val childTexts = mutableListOf<String>()
                          for (ch in el.children()) {
                              val t = ch.text().trim()
                              if (t.isNotEmpty()) childTexts.add(t)
                          }
                          val fullText = el.text().trim()

                          val scoreMatch = SCORE_REGEX.find(fullText)
                          if (childTexts.size in 2..8 && fullText.length in 10..200) {
                              val teamCandidates = childTexts.filter {
                                  it.length in 3..40 && !it.all { c -> c.isDigit() } && !it.contains("матчи", true)
                              }
                              if (teamCandidates.size >= 2 && scoreMatch != null) {
                                  val home = teamCandidates[0]
                                  val away = teamCandidates[1]
                                  if (extractedMatches.none { it.homeTeam == home && it.awayTeam == away && it.scoreText == scoreMatch.value }) {
                                      extractedMatches.add(
                                          HockeyMatch(
                                              id = "m_${extractedMatches.size}",
                                              homeTeam = home,
                                              awayTeam = away,
                                              scoreText = scoreMatch.value,
                                              infoLine = childTexts.firstOrNull() ?: h1,
                                              status = "МАТЧ ФХМ",
                                              rawDetails = childTexts.joinToString(" | ")
                                          )
                                      )
                                  }
                              }
                          }

                          val numericCount = childTexts.count { it.isNotEmpty() && it.all { c -> c.isDigit() } }
                          if (childTexts.size >= 4 && numericCount >= 2) {
                              extractedPlayers.add(childTexts)
                          }
                      }
                  }

                  val wrapperBuilder = StringBuilder()
                  for (idx in 0 until wrappers.size) {
                      val el = wrappers[idx]
                      wrapperBuilder.append("--- WRAPPER #").append(idx).append(" (class=").append(el.className()).append(") ---\n")
                      wrapperBuilder.append(el.outerHtml().take(2500)).append("\n\n")
                  }

                  val report = buildString {
                      appendLine("=== ОТЧЕТ ПАРСЕРА v2.5 (JS BUNDLE + SUMMARY CLICK) ===")
                      appendLine("URL: $url (Режим вкладки: $actionMode)")
                      appendLine("Турнир: $h1")
                      appendLine("Всего DOM-элементов: ${doc.allElements.size}")
                      appendLine("Найдено групп standings-group: ${standingGroups.size}")
                      appendLine("Найдено матчей: ${extractedMatches.size}")
                      appendLine("Найдено цифровых строк: ${extractedPlayers.size}")
                      appendLine("\n=== ПЕРЕХВАЧЕННЫЕ XHR/FETCH ЗАПРОСЫ ===")
                      appendLine(if (apiLogs.isNotEmpty()) apiLogs else "Пусто")
                      appendLine("\n=== АНАЛИЗ JS-КОДА САЙТА (API ЭНДПОИНТЫ ФХМ) ===")
                      appendLine(jsBundleReport)
                      appendLine("\n=== ИСХОДНЫЙ HTML ВНУТРИ .tournament-wrapper ===")
                      appendLine(wrapperBuilder.toString())
                  }

                  return TournamentPageData(
                      url = url,
                      tournamentTitle = h1,
                      matches = extractedMatches,
                      tables = parsedTables,
                      playerRows = extractedPlayers,
                      diagnosticReport = report
                  )
              }
          }

          val KhlBgDark = Color(0xFF0B101B)
          val KhlCardDark = Color(0xFF161F30)
          val KhlAccentRed = Color(0xFFE30613)
          val KhlIceBlue = Color(0xFF00A8E8)
          val KhlTextGray = Color(0xFF8F9BB3)

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContent {
                      MaterialTheme(
                          colorScheme = darkColorScheme(
                              background = KhlBgDark,
                              surface = KhlCardDark,
                              primary = KhlAccentRed,
                              secondary = KhlIceBlue
                          )
                      ) {
                          FhmKhlAppV25()
                      }
                  }
              }
          }

          @Composable
          fun FhmKhlAppV25() {
              val context = LocalContext.current
              val scope = rememberCoroutineScope()

              var bottomTab by remember { mutableIntStateOf(1) }
              var tournamentId by remember { mutableStateOf("54") }
              var actionMode by remember { mutableIntStateOf(1) }

              var pageData by remember { mutableStateOf<TournamentPageData?>(null) }
              var isLoading by remember { mutableStateOf(true) }
              var selectedMatch by remember { mutableStateOf<HockeyMatch?>(null) }

              fun reload() {
                  scope.launch {
                      isLoading = true
                      pageData = FhmTournamentParser.loadTournament(context, tournamentId, actionMode)
                      isLoading = false
                  }
              }

              LaunchedEffect(tournamentId, actionMode) {
                  reload()
              }

              Scaffold(
                  containerColor = KhlBgDark,
                  topBar = {
                      Column(
                          modifier = Modifier
                              .fillMaxWidth()
                              .background(KhlCardDark)
                              .padding(top = 10.dp, bottom = 8.dp)
                      ) {
                          Row(
                              modifier = Modifier
                                  .fillMaxWidth()
                                  .padding(horizontal = 14.dp),
                              horizontalArrangement = Arrangement.SpaceBetween,
                              verticalAlignment = Alignment.CenterVertically
                          ) {
                              Column(modifier = Modifier.weight(1f)) {
                                  Row(verticalAlignment = Alignment.CenterVertically) {
                                      Box(modifier = Modifier.size(9.dp).clip(CircleShape).background(KhlAccentRed))
                                      Spacer(modifier = Modifier.width(8.dp))
                                      Text(
                                          text = "ФХМ v2.5 • ТУРНИР #$tournamentId",
                                          color = KhlIceBlue,
                                          fontSize = 12.sp,
                                          fontWeight = FontWeight.Bold
                                      )
                                  }
                                  Text(
                                      text = pageData?.tournamentTitle ?: "Загрузка...",
                                      color = Color.White,
                                      fontSize = 14.sp,
                                      fontWeight = FontWeight.Black,
                                      maxLines = 1,
                                      overflow = TextOverflow.Ellipsis
                                  )
                              }
                              IconButton(onClick = { reload() }) {
                                  Icon(Icons.Default.Refresh, contentDescription = "Обновить", tint = Color.White)
                              }
                          }

                          Row(
                              modifier = Modifier
                                  .fillMaxWidth()
                                  .horizontalScroll(rememberScrollState())
                                  .padding(horizontal = 12.dp, vertical = 6.dp),
                              horizontalArrangement = Arrangement.spacedBy(8.dp)
                          ) {
                              val modes = listOf(
                                  0 to "Прошедшие матчи",
                                  1 to "Таблица (3 группы)",
                                  2 to "Лучшие игроки"
                              )
                              modes.forEach { pair ->
                                  val idx = pair.first
                                  val label = pair.second
                                  val active = actionMode == idx
                                  Box(
                                      modifier = Modifier
                                          .clip(RoundedCornerShape(16.dp))
                                          .background(if (active) KhlAccentRed else KhlBgDark)
                                          .clickable {
                                              actionMode = idx
                                              if (idx in 0..2 && bottomTab != 3) bottomTab = idx
                                          }
                                          .padding(horizontal = 12.dp, vertical = 6.dp)
                                  ) {
                                      Text(
                                          text = label,
                                          color = if (active) Color.White else KhlTextGray,
                                          fontSize = 12.sp,
                                          fontWeight = FontWeight.Bold
                                      )
                                  }
                              }
                          }
                      }
                  },
                  bottomBar = {
                      NavigationBar(containerColor = KhlCardDark) {
                          NavigationBarItem(
                              selected = bottomTab == 0,
                              onClick = { bottomTab = 0 },
                              icon = { Icon(Icons.Default.SportsHockey, null) },
                              label = { Text("Матчи (${pageData?.matches?.size ?: 0})") }
                          )
                          NavigationBarItem(
                              selected = bottomTab == 1,
                              onClick = { bottomTab = 1 },
                              icon = { Icon(Icons.Default.FormatListNumbered, null) },
                              label = { Text("Группы (${pageData?.tables?.size ?: 0})") }
                          )
                          NavigationBarItem(
                              selected = bottomTab == 2,
                              onClick = { bottomTab = 2 },
                              icon = { Icon(Icons.Default.EmojiEvents, null) },
                              label = { Text("Строки (${pageData?.playerRows?.size ?: 0})") }
                          )
                          NavigationBarItem(
                              selected = bottomTab == 3,
                              onClick = { bottomTab = 3 },
                              icon = { Icon(Icons.Default.Code, null) },
                              label = { Text("Веб / DOM") }
                          )
                      }
                  }
              ) { innerPadding ->
                  Box(
                      modifier = Modifier
                          .fillMaxSize()
                          .padding(innerPadding)
                  ) {
                      if (isLoading) {
                          Column(
                              modifier = Modifier.align(Alignment.Center),
                              horizontalAlignment = Alignment.CenterHorizontally
                          ) {
                              CircularProgressIndicator(color = KhlAccentRed)
                              Spacer(modifier = Modifier.height(12.dp))
                              Text(
                                  text = "Раскрываем группы и сканируем API модулей ФХМ...",
                                  color = KhlTextGray,
                                  fontSize = 12.sp,
                                  textAlign = TextAlign.Center,
                                  modifier = Modifier.padding(horizontal = 24.dp)
                              )
                          }
                      } else {
                          val data = pageData
                          if (data != null) {
                              when (bottomTab) {
                                  0 -> LiveMatchesScreen(data, onMatchClick = { selectedMatch = it })
                                  1 -> LiveTablesScreen(data)
                                  2 -> LivePlayersScreen(data)
                                  3 -> WebAndDomScreen(data)
                              }
                          }
                      }
                  }
              }

              selectedMatch?.let { match ->
                  AlertDialog(
                      onDismissRequest = { selectedMatch = null },
                      containerColor = KhlCardDark,
                      title = {
                          Text("${match.homeTeam} — ${match.awayTeam}", color = Color.White, fontSize = 16.sp, fontWeight = FontWeight.Bold)
                      },
                      text = {
                          Column(verticalArrangement = Arrangement.spacedBy(8.dp)) {
                              Text("Счет: ${match.scoreText}", color = KhlIceBlue, fontSize = 14.sp, fontWeight = FontWeight.Bold)
                              Text(match.rawDetails, color = Color.White, fontSize = 13.sp)
                          }
                      },
                      confirmButton = {
                          TextButton(onClick = { selectedMatch = null }) {
                              Text("Закрыть", color = KhlIceBlue)
                          }
                      }
                  )
              }
          }

          @Composable
          fun LiveMatchesScreen(data: TournamentPageData, onMatchClick: (HockeyMatch) -> Unit) {
              if (data.matches.isEmpty()) {
                  Box(modifier = Modifier.fillMaxSize().padding(24.dp), contentAlignment = Alignment.Center) {
                      Text(
                          text = "Нажми сверху кнопку «Прошедшие матчи», либо открой вкладку «Веб / DOM» и нажми «Скопировать DOM».",
                          color = KhlTextGray,
                          fontSize = 14.sp,
                          textAlign = TextAlign.Center
                      )
                  }
                  return
              }

              LazyColumn(contentPadding = PaddingValues(12.dp), verticalArrangement = Arrangement.spacedBy(10.dp)) {
                  items(data.matches) { match ->
                      Card(
                          colors = CardDefaults.cardColors(containerColor = KhlCardDark),
                          shape = RoundedCornerShape(14.dp),
                          modifier = Modifier.fillMaxWidth().clickable { onMatchClick(match) }
                      ) {
                          Column(modifier = Modifier.padding(16.dp)) {
                              Row(modifier = Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceBetween) {
                                  Text(match.infoLine, color = KhlTextGray, fontSize = 11.sp, maxLines = 1, overflow = TextOverflow.Ellipsis, modifier = Modifier.weight(1f))
                                  Text(match.status, color = KhlIceBlue, fontSize = 11.sp, fontWeight = FontWeight.Bold)
                              }
                              Spacer(modifier = Modifier.height(10.dp))
                              Row(
                                  modifier = Modifier.fillMaxWidth(),
                                  verticalAlignment = Alignment.CenterVertically,
                                  horizontalArrangement = Arrangement.SpaceBetween
                              ) {
                                  Text(match.homeTeam, color = Color.White, fontSize = 14.sp, fontWeight = FontWeight.Bold, modifier = Modifier.weight(1f))
                                  Box(
                                      modifier = Modifier
                                          .clip(RoundedCornerShape(8.dp))
                                          .background(KhlBgDark)
                                          .padding(horizontal = 12.dp, vertical = 6.dp)
                                  ) {
                                      Text(match.scoreText, color = Color.White, fontSize = 18.sp, fontWeight = FontWeight.Black)
                                  }
                                  Text(match.awayTeam, color = Color.White, fontSize = 14.sp, fontWeight = FontWeight.Bold, textAlign = TextAlign.End, modifier = Modifier.weight(1f))
                              }
                          }
                      }
                  }
              }
          }

          @Composable
          fun LiveTablesScreen(data: TournamentPageData) {
              if (data.tables.isEmpty()) {
                  Box(modifier = Modifier.fillMaxSize().padding(24.dp), contentAlignment = Alignment.Center) {
                      Text(
                          text = "Группы не найдены. Открой вкладку «Веб / DOM» и нажми «Скопировать DOM».",
                          color = KhlTextGray,
                          fontSize = 14.sp,
                          textAlign = TextAlign.Center
                      )
                  }
                  return
              }

              LazyColumn(contentPadding = PaddingValues(12.dp), verticalArrangement = Arrangement.spacedBy(12.dp)) {
                  items(data.tables) { table ->
                      Card(
                          colors = CardDefaults.cardColors(containerColor = KhlCardDark),
                          shape = RoundedCornerShape(12.dp),
                          modifier = Modifier.fillMaxWidth()
                      ) {
                          Column(modifier = Modifier.padding(12.dp)) {
                              Text(
                                  text = table.title,
                                  color = KhlIceBlue,
                                  fontSize = 14.sp,
                                  fontWeight = FontWeight.Black,
                                  modifier = Modifier.padding(bottom = 8.dp)
                              )
                              for (rIdx in 0 until table.rows.size) {
                                  val row = table.rows[rIdx]
                                  Text(
                                      text = row.joinToString("  |  "),
                                      color = Color.White,
                                      fontSize = 12.sp,
                                      modifier = Modifier.padding(vertical = 4.dp)
                                  )
                              }
                          }
                      }
                  }
              }
          }

          @Composable
          fun LivePlayersScreen(data: TournamentPageData) {
              if (data.playerRows.isEmpty()) {
                  Box(modifier = Modifier.fillMaxSize().padding(24.dp), contentAlignment = Alignment.Center) {
                      Text(
                          text = "Строки еще не загружены. Переключи режим сверху или проверь «Веб / DOM».",
                          color = KhlTextGray,
                          fontSize = 14.sp,
                          textAlign = TextAlign.Center
                      )
                  }
                  return
              }

              LazyColumn(contentPadding = PaddingValues(12.dp), verticalArrangement = Arrangement.spacedBy(8.dp)) {
                  items(data.playerRows) { row ->
                      Card(
                          colors = CardDefaults.cardColors(containerColor = KhlCardDark),
                          shape = RoundedCornerShape(10.dp),
                          modifier = Modifier.fillMaxWidth()
                      ) {
                          Text(
                              text = row.joinToString("  •  "),
                              color = Color.White,
                              fontSize = 13.sp,
                              modifier = Modifier.padding(12.dp)
                          )
                      }
                  }
              }
          }

          @SuppressLint("SetJavaScriptEnabled")
          @Composable
          fun WebAndDomScreen(data: TournamentPageData) {
              val context = LocalContext.current
              var showLiveWeb by remember { mutableStateOf(false) }

              Column(modifier = Modifier.fillMaxSize()) {
                  Row(
                      modifier = Modifier
                          .fillMaxWidth()
                          .padding(horizontal = 12.dp, vertical = 8.dp),
                      horizontalArrangement = Arrangement.spacedBy(8.dp)
                  ) {
                      Button(
                          onClick = {
                              val clipboard = context.getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
                              clipboard.setPrimaryClip(ClipData.newPlainText("FHM_DOM", data.diagnosticReport))
                              Toast.makeText(context, "Скопировано! Вставь в чат", Toast.LENGTH_LONG).show()
                          },
                          colors = ButtonDefaults.buttonColors(containerColor = KhlAccentRed),
                          modifier = Modifier.weight(1f)
                      ) {
                          Icon(Icons.Default.ContentCopy, contentDescription = null, modifier = Modifier.size(16.dp))
                          Spacer(modifier = Modifier.width(6.dp))
                          Text("Скопировать DOM", fontSize = 12.sp, fontWeight = FontWeight.Bold)
                      }

                      Button(
                          onClick = { showLiveWeb = !showLiveWeb },
                          colors = ButtonDefaults.buttonColors(containerColor = KhlCardDark),
                          modifier = Modifier.weight(1f)
                      ) {
                          Icon(Icons.Default.Public, contentDescription = null, modifier = Modifier.size(16.dp), tint = KhlIceBlue)
                          Spacer(modifier = Modifier.width(6.dp))
                          Text(
                              text = if (showLiveWeb) "Показать отчет" else "Открыть веб-вид",
                              color = KhlIceBlue,
                              fontSize = 12.sp,
                              fontWeight = FontWeight.Bold
                          )
                      }
                  }

                  if (showLiveWeb) {
                      AndroidView(
                          modifier = Modifier.fillMaxSize(),
                          factory = { ctx ->
                              WebView(ctx).apply {
                                  settings.javaScriptEnabled = true
                                  settings.domStorageEnabled = true
                                  webViewClient = WebViewClient()
                                  loadUrl(data.url)
                              }
                          },
                          update = { webView ->
                              if (webView.url != data.url) {
                                  webView.loadUrl(data.url)
                              }
                          }
                      )
                  } else {
                      LazyColumn(
                          contentPadding = PaddingValues(12.dp),
                          modifier = Modifier.fillMaxSize()
                      ) {
                          item {
                              Card(
                                  colors = CardDefaults.cardColors(containerColor = KhlCardDark),
                                  shape = RoundedCornerShape(12.dp),
                                  modifier = Modifier.fillMaxWidth()
                              ) {
                                  Text(
                                      text = data.diagnosticReport,
                                      color = Color.White,
                                      fontSize = 11.sp,
                                      fontFamily = FontFamily.Monospace,
                                      modifier = Modifier.padding(12.dp)
                                  )
                              }
                          }
                      }
                  }
              }
          }
          EOF

      - name: Build Debug APK
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon 2>&1 | tee build_output.log || {
            echo "### Ошибки компиляции Kotlin" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            { grep -E "e: |FAILURE|What went wrong" -A 8 build_output.log || tail -n 40 build_output.log; } >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          }

      - name: Rename APK to v2.5
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/fhm-tournament54-v25.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fhm-tournament54-v25
          path: app/build/outputs/apk/debug/fhm-tournament54-v25.apk
