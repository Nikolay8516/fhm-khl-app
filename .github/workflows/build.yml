                      tournamentsList.filter { it.birthYear == currentBirthYear }
                  } else {
                      emptyList()
                  }
              }

              Scaffold(
                  containerColor = KhlBgDark,
                  topBar = {
                      Column(
                          modifier = Modifier
                              .fillMaxWidth()
                              .background(KhlCardDark)
                              .padding(top = 10.dp, bottom = 8.dp)
                      ) {
                          Row(
                              modifier = Modifier.fillMaxWidth().padding(horizontal = 14.dp),
                              horizontalArrangement = Arrangement.SpaceBetween,
                              verticalAlignment = Alignment.CenterVertically
                          ) {
                              Row(
                                  modifier = Modifier.weight(1f).clickable { showTournamentPicker = true },
                                  verticalAlignment = Alignment.CenterVertically
                              ) {
                                  AsyncImage(
                                      model = pageData?.siteLogoUrl ?: "https://fhmoscow.com/dist/releases/f607e3a7e98e97903485776be7a0b2d41afce96e/img/logo.svg",
                                      imageLoader = svgImageLoader,
                                      contentDescription = "ФХМ",
                                      contentScale = ContentScale.Fit,
                                      modifier = Modifier
                                          .size(38.dp)
                                          .clip(RoundedCornerShape(8.dp))
                                          .background(Color.White.copy(alpha = 0.08f))
                                          .padding(4.dp)
                                  )
                                  Spacer(modifier = Modifier.width(10.dp))
                                  Column(modifier = Modifier.weight(1f)) {
                                      Row(verticalAlignment = Alignment.CenterVertically) {
                                          Box(modifier = Modifier.size(7.dp).clip(CircleShape).background(KhlAccentRed))
                                          Spacer(modifier = Modifier.width(6.dp))
