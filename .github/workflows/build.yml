                                                  .background(if (isSel) KhlAccentRed else KhlBgDark)
                                                  .clickable {
                                                      dialogSeasonId = s.id
                                                      selectedSeasonId = s.id
                                                      scope.launch {
                                                          dialogTournaments = FhmDirectApiClient.loadTournamentsForSeason(s.id)
                                                      }
                                                  }
                                                  .padding(horizontal = 10.dp, vertical = 6.dp)
                                          ) {
                                              Text(s.name, color = Color.White, fontSize = 12.sp, fontWeight = FontWeight.Bold)
                                          }
                                      }
                                  }
                              }

                              if (dialogYears.size > 1) {
                                  Text("Год рождения:", color = KhlTextGray, fontSize = 11.sp)
                                  Row(
                                      modifier = Modifier.fillMaxWidth().horizontalScroll(rememberScrollState()),
                                      horizontalArrangement = Arrangement.spacedBy(6.dp)
                                  ) {
                                      dialogYears.forEach { y ->
                                          val isSel = dialogYearFilter == y
                                          Box(
                                              modifier = Modifier
                                                  .clip(RoundedCornerShape(10.dp))
                                                  .background(if (isSel) KhlIceBlue else KhlBgDark)
                                                  .clickable { dialogYearFilter = y }
                                                  .padding(horizontal = 10.dp, vertical = 5.dp)
                                          ) {
                                              Text(if (y == "Все") "Все года" else "$y г.р.", color = Color.White, fontSize = 12.sp, fontWeight = FontWeight.Bold)
                                          }
                                      }
                                  }
                              }

                              OutlinedTextField(
                                  value = dialogSearch,
                                  onValueChange = { dialogSearch = it },
                                  placeholder = { Text("Поиск турнира...", color = KhlTextGray, fontSize = 12.sp) },
                                  singleLine = true,
                                  modifier = Modifier.fillMaxWidth()
                              )

                              LazyColumn(
                                  modifier = Modifier.heightIn(max = 260.dp),
                                  verticalArrangement = Arrangement.spacedBy(6.dp)
                              ) {
                                  items(filteredDialogTournaments) { opt ->
                                      Box(
                                          modifier = Modifier
                                              .fillMaxWidth()
                                              .clip(RoundedCornerShape(8.dp))
                                              .background(if (opt.id == tournamentId) KhlAccentRed else KhlBgDark)
                                              .clickable {
                                                  tournamentId = opt.id
                                                  showTournamentPicker = false
                                              }
                                              .padding(10.dp)
                                      ) {
                                          Text(opt.name, color = Color.White, fontSize = 13.sp, fontWeight = FontWeight.SemiBold)
                                      }
                                  }
                              }
                          }
                      },
                      confirmButton = {
                          TextButton(onClick = { showTournamentPicker = false }) {
                              Text("Закрыть", color = KhlIceBlue)
                          }
                      }
                  )
              }

              selectedPlayer?.let { p ->
                  AlertDialog(
                      onDismissRequest = { selectedPlayer = null },
                      containerColor = KhlCardDark,
                      title = {
                          Row(verticalAlignment = Alignment.CenterVertically) {
                              AsyncImage(
                                  model = p.playerPhoto,
                                  contentDescription = p.fullName,
                                  contentScale = ContentScale.Crop,
                                  modifier = Modifier.size(54.dp).clip(CircleShape).background(Color.White.copy(alpha = 0.1f))
                              )
                              Spacer(modifier = Modifier.width(12.dp))
                              Column {
                                  Text(p.fullName, color = Color.White, fontSize = 15.sp, fontWeight = FontWeight.Bold)
                                  val numText = if (p.number.isNotEmpty()) "№${p.number} • " else ""
                                  Text("$numText${p.roleName}", color = KhlIceBlue, fontSize = 12.sp, fontWeight = FontWeight.Bold)
                              }
                          }
                      },
                      text = {
                          Column(verticalArrangement = Arrangement.spacedBy(8.dp)) {
                              Row(verticalAlignment = Alignment.CenterVertically) {
                                  AsyncImage(model = p.clubLogo, contentDescription = p.clubName, modifier = Modifier.size(24.dp))
                                  Spacer(modifier = Modifier.width(8.dp))
                                  Text(p.clubName, color = Color.White, fontSize = 14.sp, fontWeight = FontWeight.Bold)
                              }
                              Text("Дата рождения: ${p.birthDate}", color = KhlTextGray, fontSize = 13.sp)
                              Row(
                                  modifier = Modifier
                                      .fillMaxWidth()
                                      .clip(RoundedCornerShape(10.dp))
                                      .background(KhlBgDark)
                                      .padding(12.dp),
                                  horizontalArrangement = Arrangement.SpaceEvenly
                              ) {
                                  StatMiniBox("ИГРЫ", p.games.toString())
                                  StatMiniBox("ГОЛЫ", p.goals.toString())
                                  StatMiniBox("ПАСЫ", p.assists.toString())
                                  StatMiniBox("ОЧКИ", p.points.toString(), highlight = true)
                              }
                          }
                      },
                      confirmButton = {
                          Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                              TextButton(onClick = {
                                  context.startActivity(Intent(Intent.ACTION_VIEW, Uri.parse(p.playerUrl)))
