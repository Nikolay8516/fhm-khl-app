name: Build FHM v3.0 APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download Gradle 8.7 directly
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle-8.7-bin.zip -d /tmp
          echo "/tmp/gradle-8.7/bin" >> $GITHUB_PATH

      - name: Generate v3.0 project
        run: |
          rm -rf app settings.gradle.kts build.gradle.kts gradle.properties
          mkdir -p app/src/main/java/com/fhm/khlstyle

          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "FHM_KHL_V30"
          include(":app")
          EOF

          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          EOF

          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.fhm.khlstyle"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.fhm.khlstyle"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 30
                  versionName = "3.0"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
              buildFeatures {
                  compose = true
              }
              composeOptions {
                  kotlinCompilerExtensionVersion = "1.5.14"
              }
          }

          dependencies {
              val composeBom = platform("androidx.compose:compose-bom:2024.06.00")
              implementation(composeBom)
              implementation("androidx.activity:activity-compose:1.9.0")
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-graphics")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-extended")
              implementation("org.jsoup:jsoup:1.17.2")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1")
              implementation("io.coil-kt:coil-compose:2.6.0")
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:allowBackup="false"
                  android:icon="@android:drawable/sym_def_app_icon"
                  android:label="ФХМ Матч-Центр"
                  android:supportsRtl="true"
                  android:usesCleartextTraffic="true"
                  android:theme="@android:style/Theme.Material.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/fhm/khlstyle/MainActivity.kt
          package com.fhm.khlstyle

          import android.annotation.SuppressLint
          import android.content.ClipData
          import android.content.ClipboardManager
          import android.content.Context
          import android.graphics.Bitmap
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.webkit.WebResourceRequest
          import android.webkit.WebResourceResponse
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import android.widget.Toast
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.foundation.background
          import androidx.compose.foundation.clickable
          import androidx.compose.foundation.horizontalScroll
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.LazyColumn
          import androidx.compose.foundation.lazy.items
          import androidx.compose.foundation.rememberScrollState
          import androidx.compose.foundation.shape.CircleShape
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.material.icons.Icons
          import androidx.compose.material.icons.filled.Code
          import androidx.compose.material.icons.filled.ContentCopy
          import androidx.compose.material.icons.filled.EmojiEvents
          import androidx.compose.material.icons.filled.FormatListNumbered
          import androidx.compose.material.icons.filled.Public
          import androidx.compose.material.icons.filled.Refresh
          import androidx.compose.material.icons.filled.SportsHockey
          import androidx.compose.material.icons.filled.SwapHoriz
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.draw.clip
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.layout.ContentScale
          import androidx.compose.ui.platform.LocalContext
          import androidx.compose.ui.text.font.FontFamily
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.text.style.TextAlign
          import androidx.compose.ui.text.style.TextOverflow
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import androidx.compose.ui.viewinterop.AndroidView
          import coil.compose.AsyncImage
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.launch
          import kotlinx.coroutines.suspendCancellableCoroutine
          import kotlinx.coroutines.withContext
          import kotlinx.coroutines.withTimeoutOrNull
          import org.json.JSONArray
          import org.json.JSONObject
          import org.json.JSONTokener
          import org.jsoup.Jsoup
          import org.jsoup.nodes.Document
          import java.util.Collections
          import kotlin.coroutines.resume

          data class HockeyMatch(
              val id: String,
              val homeTeam: String,
              val awayTeam: String,
              val homeLogo: String,
              val awayLogo: String,
              val scoreText: String,
              val dateText: String,
              val groupName: String,
              val tourName: String,
              val statusBadge: String,
              val isFinished: Boolean,
              val gameUrl: String
          )

          data class StandingRow(
              val position: Int,
              val teamId: Int,
              val teamName: String,
              val logoUrl: String,
              val games: Int,
              val wins: Int,
              val ties: Int,
              val losses: Int,
              val otWins: Int,
              val otLosses: Int,
              val pucksScored: Int,
              val pucksMissed: Int,
              val pucksDiff: Int,
              val points: Int,
              val tieBreakNote: String
          )

          data class StandingGroup(
              val groupName: String,
              val rows: List<StandingRow>
          )

          data class BestPlayerItem(
              val rank: Int,
              val name: String,
              val team: String,
              val statLabel: String,
              val statValue: String
          )

          data class TournamentPageData(
              val url: String,
              val tournamentTitle: String,
              val totalUpcomingCount: Int,
              val totalPastCount: Int,
              val upcomingMatches: List<HockeyMatch>,
              val pastMatches: List<HockeyMatch>,
              val standingGroups: List<StandingGroup>,
              val bestPlayers: List<BestPlayerItem>,
              val diagnosticReport: String
          )

          object FhmTournamentParser {

              suspend fun loadTournament(context: Context, tournamentId: String): TournamentPageData {
                  val targetUrl = "https://fhmoscow.com/tournament/$tournamentId?tournament-tab=2"
                  val webResult = fetchAllDataViaWebView(context, targetUrl)
                  val renderedHtml = webResult.first
                  val apiPayloads = webResult.second
                  val interceptedUrls = webResult.third

                  val doc = if (renderedHtml.isNotEmpty()) Jsoup.parse(renderedHtml, targetUrl) else Document(targetUrl)
                  return buildTournamentData(doc, targetUrl, apiPayloads, interceptedUrls)
              }

              @SuppressLint("SetJavaScriptEnabled")
              private suspend fun fetchAllDataViaWebView(
                  context: Context,
                  url: String
              ): Triple<String, List<Triple<String, String, String>>, List<String>> {
                  return withContext(Dispatchers.Main) {
                      val interceptedUrls = Collections.synchronizedList(mutableListOf<String>())

                      val result: Triple<String, List<Triple<String, String, String>>, List<String>>? =
                          withTimeoutOrNull<Triple<String, List<Triple<String, String, String>>, List<String>>>(28000L) {
                              suspendCancellableCoroutine<Triple<String, List<Triple<String, String, String>>, List<String>>> { cont ->
                                  val webView = WebView(context)
                                  webView.layout(0, 0, 1080, 2400)
                                  webView.settings.javaScriptEnabled = true
                                  webView.settings.domStorageEnabled = true
                                  webView.settings.userAgentString =
                                      "Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Mobile Safari/537.36"

                                  var finished = false
                                  val mainHandler = Handler(Looper.getMainLooper())

                                  val hooksJs = "(function() {" +
                                      "window.__fhmPayloads = window.__fhmPayloads || [];" +
                                      "if (!window.__fhmHookedV30) {" +
                                      "  window.__fhmHookedV30 = true;" +
                                      "  var origFetch = window.fetch;" +
                                      "  if (origFetch) {" +
                                      "    window.fetch = function() {" +
                                      "      var u = arguments[0];" +
                                      "      var opts = arguments[1] || {};" +
                                      "      var reqB = (opts && opts.body) ? String(opts.body) : '';" +
                                      "      var uStr = (typeof u === 'string') ? u : (u && u.url ? u.url : 'fetch');" +
                                      "      return origFetch.apply(this, arguments).then(function(resp) {" +
                                      "        try { resp.clone().text().then(function(txt) { window.__fhmPayloads.push({ url: uStr, req: reqB, body: txt.substring(0, 45000) }); }); } catch(e) {}" +
                                      "        return resp;" +
                                      "      });" +
                                      "    };" +
                                      "  }" +
                                      "  var origOpen = XMLHttpRequest.prototype.open;" +
                                      "  XMLHttpRequest.prototype.open = function(m, u) { this._url = u; return origOpen.apply(this, arguments); };" +
                                      "  var origSend = XMLHttpRequest.prototype.send;" +
                                      "  XMLHttpRequest.prototype.send = function(data) {" +
                                      "    var self = this;" +
                                      "    var reqB = data ? String(data) : '';" +
                                      "    this.addEventListener('load', function() {" +
                                      "      try { window.__fhmPayloads.push({ url: (self._url || 'xhr'), req: reqB, body: (self.responseText || '').substring(0, 45000) }); } catch(e) {}" +
                                      "    });" +
                                      "    return origSend.apply(this, arguments);" +
                                      "  };" +
                                      "}" +
                                      "})();"

                                  val openTablesJs = "(function() {" +
                                      "try {" +
                                      "  var summaries = document.querySelectorAll('details.standings-group > summary');" +
                                      "  for (var i = 0; i < summaries.length; i++) {" +
                                      "    var det = summaries[i].parentElement;" +
                                      "    if (det && !det.hasAttribute('open')) {" +
                                      "      summaries[i].click();" +
                                      "      det.open = true;" +
                                      "      det.dispatchEvent(new Event('toggle'));" +
                                      "    }" +
                                      "  }" +
                                      "} catch(e) {}" +
                                      "})();"

                                  val loadMatchesAndPlayersJs = "(function() {" +
                                      "try {" +
                                      "  var blueBtns = document.querySelectorAll('.people-scroll__page button, .button-blue');" +
                                      "  for (var j = 0; j < blueBtns.length; j++) { blueBtns[j].click(); }" +
                                      "  var tab4 = document.querySelector('.tournament-tab[data-tab=\"4\"]');" +
                                      "  if (tab4) { tab4.click(); }" +
                                      "  var panel4 = document.querySelector('#tournament-section-panel-4, [data-render-module=\"best-players-block\"]');" +
                                      "  if (panel4) {" +
                                      "    panel4.removeAttribute('hidden');" +
                                      "    panel4.classList.add('active');" +
                                      "    panel4.scrollIntoView();" +
                                      "  }" +
                                      "} catch(e) {}" +
                                      "})();"

                                  val dumpJs = "(function() {" +
                                      "return JSON.stringify({" +
                                      "  html: document.documentElement.outerHTML," +
                                      "  payloads: window.__fhmPayloads || []" +
                                      "});" +
                                      "})();"

                                  webView.webViewClient = object : WebViewClient() {
                                      override fun shouldInterceptRequest(
                                          view: WebView?,
                                          request: WebResourceRequest?
                                      ): WebResourceResponse? {
                                          val reqUrl = request?.url?.toString() ?: ""
                                          if (reqUrl.contains("/api/") || reqUrl.contains("/js/")) {
                                              synchronized(interceptedUrls) {
                                                  val entry = "${request?.method ?: "GET"} $reqUrl"
                                                  if (!interceptedUrls.contains(entry) && interceptedUrls.size < 90) {
                                                      interceptedUrls.add(entry)
                                                  }
                                              }
                                          }
                                          return super.shouldInterceptRequest(view, request)
                                      }

                                      override fun onPageStarted(view: WebView?, loadedUrl: String?, favicon: Bitmap?) {
                                          super.onPageStarted(view, loadedUrl, favicon)
                                          view?.evaluateJavascript(hooksJs, null)
                                      }

                                      override fun onPageFinished(view: WebView?, loadedUrl: String?) {
                                          if (finished) return
                                          webView.evaluateJavascript(hooksJs, null)

                                          mainHandler.postDelayed({
                                              if (!finished && cont.isActive) webView.evaluateJavascript(openTablesJs, null)
                                          }, 1000L)

                                          mainHandler.postDelayed({
                                              if (!finished && cont.isActive) webView.evaluateJavascript(loadMatchesAndPlayersJs, null)
                                          }, 2600L)

                                          mainHandler.postDelayed({
                                              if (!finished && cont.isActive) {
                                                  finished = true
                                                  webView.evaluateJavascript(dumpJs) { rawJson ->
                                                      var htmlOut = ""
                                                      val payloadsList = mutableListOf<Triple<String, String, String>>()
                                                      try {
                                                          if (rawJson != null && rawJson != "null") {
                                                              val unquoted = JSONTokener(rawJson).nextValue()?.toString() ?: ""
                                                              val obj = JSONObject(unquoted)
                                                              htmlOut = obj.optString("html", "")
                                                              val arr = obj.optJSONArray("payloads") ?: JSONArray()
                                                              for (i in 0 until arr.length()) {
                                                                  val item = arr.optJSONObject(i)
                                                                  if (item != null) {
                                                                      payloadsList.add(
                                                                          Triple(
                                                                              item.optString("url", ""),
                                                                              item.optString("req", ""),
                                                                              item.optString("body", "")
                                                                          )
                                                                      )
                                                                  }
                                                              }
                                                          }
                                                      } catch (e: Exception) {
                                                          htmlOut = ""
                                                      }
                                                      webView.destroy()
                                                      if (cont.isActive) {
                                                          val netCopy = synchronized(interceptedUrls) { interceptedUrls.toList() }
                                                          cont.resume(Triple(htmlOut, payloadsList, netCopy))
                                                      }
                                                  }
                                              }
                                          }, 6000L)
                                      }
                                  }

                                  cont.invokeOnCancellation {
                                      mainHandler.removeCallbacksAndMessages(null)
                                      webView.stopLoading()
                                      webView.destroy()
                                  }

                                  webView.loadUrl(url)
                              }
                          }
                      val netCopy = synchronized(interceptedUrls) { interceptedUrls.toList() }
                      result ?: Triple("", emptyList(), netCopy)
                  }
              }

              private fun buildTournamentData(
                  doc: Document,
                  url: String,
                  apiPayloads: List<Triple<String, String, String>>,
                  interceptedUrls: List<String>
              ): TournamentPageData {
                  val h1 = doc.select("h1, h2").firstOrNull()?.text()?.trim() ?: "Кубок г. Москвы"
                  val upcomingMatches = mutableListOf<HockeyMatch>()
                  val pastMatches = mutableListOf<HockeyMatch>()
                  var totalUpcoming = 0
                  var totalPast = 0

                  val groupNamesById = mutableMapOf<String, String>()
                  val detailsEls = doc.select("details.standings-group")
                  for (dEl in detailsEls) {
                      val gid = dEl.attr("data-standings-group")
                      val gName = dEl.select("summary span").firstOrNull()?.text()?.trim() ?: "Группа"
                      if (gid.isNotEmpty()) groupNamesById[gid] = gName
                  }

                  val parsedStandingGroups = mutableListOf<StandingGroup>()
                  val bestPlayers = mutableListOf<BestPlayerItem>()

                  for (payload in apiPayloads) {
                      val apiUrl = payload.first
                      val reqBody = payload.second
                      val body = payload.third.trim()
                      if (!body.startsWith("{") && !body.startsWith("[")) continue

                      try {
                          if (apiUrl.contains("/api/game/list") && body.startsWith("{")) {
                              val json = JSONObject(body)
                              val count = json.optInt("count", 0)
                              val items = json.optJSONArray("items")
                              if (items != null) {
                                  for (i in 0 until items.length()) {
                                      val mObj = items.optJSONObject(i) ?: continue
                                      val match = parseGameJsonItem(mObj, i)
                                      if (match.isFinished) {
                                          if (count > totalPast) totalPast = count
                                          if (pastMatches.none { it.id == match.id }) pastMatches.add(match)
                                      } else {
                                          if (count > totalUpcoming) totalUpcoming = count
                                          if (upcomingMatches.none { it.id == match.id }) upcomingMatches.add(match)
                                      }
                                  }
                              }
                          }

                          if (apiUrl.contains("/api/tournamentTable/list") && body.startsWith("{")) {
                              val json = JSONObject(body)
                              val items = json.optJSONArray("items")
                              if (items != null && items.length() > 0) {
                                  val rows = mutableListOf<StandingRow>()
                                  for (i in 0 until items.length()) {
                                      val rObj = items.optJSONObject(i) ?: continue
                                      rows.add(
                                          StandingRow(
                                              position = rObj.optInt("position", i + 1),
                                              teamId = rObj.optInt("teamId", 0),
                                              teamName = rObj.optString("team", "Команда"),
                                              logoUrl = rObj.optString("logo", ""),
                                              games = rObj.optInt("games", 0),
                                              wins = rObj.optInt("countWin", 0),
                                              ties = rObj.optInt("countTie", 0),
                                              losses = rObj.optInt("countLose", 0),
                                              otWins = rObj.optInt("countOvertimeWin", 0),
                                              otLosses = rObj.optInt("countOvertimeLose", 0),
                                              pucksScored = rObj.optInt("pucksScored", 0),
                                              pucksMissed = rObj.optInt("pucksMissed", 0),
                                              pucksDiff = rObj.optInt("pucksDifference", 0),
                                              points = rObj.optInt("score", 0),
                                              tieBreakNote = rObj.optString("tieBreakRuleLabel", "")
                                          )
                                      )
                                  }

                                  val matchedGroupTitle = detectGroupName(reqBody, rows.size, groupNamesById, parsedStandingGroups.size)
                                  val firstTeamId = rows.firstOrNull()?.teamId ?: 0
                                  if (parsedStandingGroups.none { it.rows.firstOrNull()?.teamId == firstTeamId }) {
                                      parsedStandingGroups.add(StandingGroup(groupName = matchedGroupTitle, rows = rows))
                                  }
                              }
                          }
                      } catch (e: Exception) {
                          // ignore
                      }
                  }

                  parsedStandingGroups.sortBy {
                      when {
                          it.groupName.contains("Группа А") -> 1
                          it.groupName.contains("Группа Б") -> 2
                          it.groupName.contains("Группа В") -> 3
                          else -> 4
                      }
                  }

                  val payloadSummary = StringBuilder()
                  for (idx in 0 until apiPayloads.size) {
                      val p = apiPayloads[idx]
                      payloadSummary.append("[").append(idx + 1).append("] URL: ").append(p.first)
                          .append("\nREQ: ").append(p.second)
                          .append("\nRESP: ").append(p.third.take(500)).append("\n\n")
                  }

                  val report = buildString {
                      appendLine("=== ОТЧЕТ ПАРСЕРА v3.0 ===")
                      appendLine("Турнир: $h1")
                      appendLine("Групп таблиц: ${parsedStandingGroups.size}")
                      parsedStandingGroups.forEach { g ->
                          appendLine(" • ${g.groupName}: ${g.rows.size} команд (1 место: ${g.rows.firstOrNull()?.teamName})")
                      }
                      appendLine("Матчей: ${pastMatches.size} прошедших, ${upcomingMatches.size} будущих")
                      appendLine("\n=== СЕТЕВЫЕ ЗАПРОСЫ ===")
                      appendLine(interceptedUrls.joinToString("\n"))
                      appendLine("\n=== API ПАРАМЕТРЫ (REQ / RESP) ===")
                      appendLine(payloadSummary.toString())
                  }

                  return TournamentPageData(
                      url = url,
                      tournamentTitle = h1,
                      totalUpcomingCount = if (totalUpcoming > upcomingMatches.size) totalUpcoming else upcomingMatches.size,
                      totalPastCount = if (totalPast > pastMatches.size) totalPast else pastMatches.size,
                      upcomingMatches = upcomingMatches,
                      pastMatches = pastMatches,
                      standingGroups = parsedStandingGroups,
                      bestPlayers = bestPlayers,
                      diagnosticReport = report
                  )
              }

              private fun detectGroupName(
                  reqBody: String,
                  teamCount: Int,
                  groupNamesById: Map<String, String>,
                  currentIdx: Int
              ): String {
                  for (entry in groupNamesById.entries) {
                      if (reqBody.contains(entry.key)) return entry.value
                  }
                  return when (teamCount) {
                      12 -> "Группа А"
                      15 -> "Группа Б"
                      17 -> "Группа В"
                      else -> "Группа #${currentIdx + 1}"
                  }
              }

              private fun parseGameJsonItem(mObj: JSONObject, index: Int): HockeyMatch {
                  val id = mObj.optString("id", "idx_$index")
                  val dateStr = mObj.optString("displayDate", mObj.optString("date", ""))
                  val groupStr = mObj.optString("group", "")
                  val tourStr = mObj.optString("tour", "")
                  val statusInt = mObj.optInt("status", 0)
                  val isLive = mObj.optBoolean("isLive", false)
                  val overtime = mObj.optBoolean("overtime", false)
                  val shootout = mObj.optBoolean("shootout", false)
                  val gameUrl = mObj.optString("url", "/game/$id")

                  val t1 = mObj.optJSONObject("team1")
                  val t2 = mObj.optJSONObject("team2")

                  val homeTeam = t1?.optString("name", "Команда 1") ?: "Команда 1"
                  val awayTeam = t2?.optString("name", "Команда 2") ?: "Команда 2"
                  val homeLogo = t1?.optString("logo", "") ?: ""
                  val awayLogo = t2?.optString("logo", "") ?: ""

                  val s1 = if (t1 != null && !t1.isNull("score")) t1.opt("score").toString() else null
                  val s2 = if (t2 != null && !t2.isNull("score")) t2.opt("score").toString() else null

                  val suffix = when {
                      shootout -> " Б"
                      overtime -> " ОТ"
                      else -> ""
                  }

                  val scoreText = if (s1 != null && s2 != null) "$s1 : $s2$suffix" else "VS"
                  val statusBadge = when {
                      isLive -> "LIVE"
                      statusInt == 2 -> "ОКОНЧЕН"
                      else -> mObj.optString("date", "МАТЧ")
                  }

                  return HockeyMatch(
                      id = id,
                      homeTeam = homeTeam,
                      awayTeam = awayTeam,
                      homeLogo = homeLogo,
                      awayLogo = awayLogo,
                      scoreText = scoreText,
                      dateText = dateStr,
                      groupName = groupStr,
                      tourName = tourStr,
                      statusBadge = statusBadge,
                      isFinished = (statusInt == 2),
                      gameUrl = "https://fhmoscow.com$gameUrl"
                  )
              }
          }

          val KhlBgDark = Color(0xFF0B101B)
          val KhlCardDark = Color(0xFF161F30)
          val KhlAccentRed = Color(0xFFE30613)
          val KhlIceBlue = Color(0xFF00A8E8)
          val KhlTextGray = Color(0xFF8F9BB3)
          val KhlWinGreen = Color(0xFF00C853)

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContent {
                      MaterialTheme(
                          colorScheme = darkColorScheme(
                              background = KhlBgDark,
                              surface = KhlCardDark,
                              primary = KhlAccentRed,
                              secondary = KhlIceBlue
                          )
                      ) {
                          FhmKhlAppV30()
                      }
                  }
              }
          }

          @Composable
          fun FhmKhlAppV30() {
              val context = LocalContext.current
              val scope = rememberCoroutineScope()

              var bottomTab by remember { mutableIntStateOf(1) }
              var matchFilter by remember { mutableIntStateOf(1) }
              var selectedMatchGroup by remember { mutableStateOf("Все") }
              var selectedTableGroupIdx by remember { mutableIntStateOf(0) }
              var tournamentId by remember { mutableStateOf("54") }

              var pageData by remember { mutableStateOf<TournamentPageData?>(null) }
              var isLoading by remember { mutableStateOf(true) }
              var selectedMatch by remember { mutableStateOf<HockeyMatch?>(null) }
              var selectedTeamRow by remember { mutableStateOf<StandingRow?>(null) }
              var showTournamentPicker by remember { mutableStateOf(false) }

              fun reload() {
                  scope.launch {
                      isLoading = true
                      selectedTableGroupIdx = 0
                      pageData = FhmTournamentParser.loadTournament(context, tournamentId)
                      isLoading = false
                  }
              }

              LaunchedEffect(tournamentId) { reload() }

              val totalLoadedMatches = (pageData?.upcomingMatches?.size ?: 0) + (pageData?.pastMatches?.size ?: 0)

              Scaffold(
                  containerColor = KhlBgDark,
                  topBar = {
                      Column(
                          modifier = Modifier
                              .fillMaxWidth()
                              .background(KhlCardDark)
                              .padding(top = 10.dp, bottom = 8.dp)
                      ) {
                          Row(
                              modifier = Modifier.fillMaxWidth().padding(horizontal = 14.dp),
                              horizontalArrangement = Arrangement.SpaceBetween,
                              verticalAlignment = Alignment.CenterVertically
                          ) {
                              Column(modifier = Modifier.weight(1f).clickable { showTournamentPicker = true }) {
                                  Row(verticalAlignment = Alignment.CenterVertically) {
                                      Box(modifier = Modifier.size(9.dp).clip(CircleShape).background(KhlAccentRed))
                                      Spacer(modifier = Modifier.width(8.dp))
                                      Text(
                                          text = "ФХМ v3.0 • ТУРНИР #$tournamentId (СМЕНИТЬ)",
                                          color = KhlIceBlue,
                                          fontSize = 11.sp,
                                          fontWeight = FontWeight.Bold
                                      )
                                  }
                                  Text(
                                      text = pageData?.tournamentTitle ?: "Загрузка турнира #$tournamentId...",
                                      color = Color.White,
                                      fontSize = 15.sp,
                                      fontWeight = FontWeight.Black,
                                      maxLines = 1,
                                      overflow = TextOverflow.Ellipsis
                                  )
                              }
                              Row {
                                  IconButton(onClick = { showTournamentPicker = true }) {
                                      Icon(Icons.Default.SwapHoriz, contentDescription = "Турниры", tint = KhlIceBlue)
                                  }
                                  IconButton(onClick = { reload() }) {
                                      Icon(Icons.Default.Refresh, contentDescription = "Обновить", tint = Color.White)
                                  }
                              }
                          }

                          if (bottomTab == 0) {
                              Row(
                                  modifier = Modifier.fillMaxWidth().padding(horizontal = 12.dp, vertical = 4.dp),
                                  horizontalArrangement = Arrangement.spacedBy(8.dp)
                              ) {
                                  val filters = listOf(
                                      1 to "Прошедшие (${pageData?.pastMatches?.size ?: 0})",
                                      0 to "Ближайшие (${pageData?.upcomingMatches?.size ?: 0})"
                                  )
                                  filters.forEach { pair ->
                                      val idx = pair.first
                                      val label = pair.second
                                      val active = matchFilter == idx
                                      Box(
                                          modifier = Modifier
                                              .clip(RoundedCornerShape(16.dp))
                                              .background(if (active) KhlAccentRed else KhlBgDark)
                                              .clickable { matchFilter = idx }
                                              .padding(horizontal = 12.dp, vertical = 6.dp)
                                      ) {
                                          Text(label, color = if (active) Color.White else KhlTextGray, fontSize = 12.sp, fontWeight = FontWeight.Bold)
                                      }
                                  }
                              }

                              val groupOptions = listOf("Все", "Группа А", "Группа Б", "Группа В")
                              Row(
                                  modifier = Modifier.fillMaxWidth().horizontalScroll(rememberScrollState()).padding(horizontal = 12.dp, vertical = 2.dp),
                                  horizontalArrangement = Arrangement.spacedBy(6.dp)
                              ) {
                                  groupOptions.forEach { grp ->
                                      val isSel = selectedMatchGroup == grp
                                      Box(
                                          modifier = Modifier
                                              .clip(RoundedCornerShape(8.dp))
                                              .background(if (isSel) KhlIceBlue.copy(alpha = 0.25f) else Color.Transparent)
                                              .clickable { selectedMatchGroup = grp }
                                              .padding(horizontal = 10.dp, vertical = 4.dp)
                                      ) {
                                          Text(grp, color = if (isSel) KhlIceBlue else KhlTextGray, fontSize = 12.sp, fontWeight = FontWeight.SemiBold)
                                      }
                                  }
                              }
                          }

                          if (bottomTab == 1) {
                              val groups = pageData?.standingGroups ?: emptyList()
                              if (groups.isNotEmpty()) {
                                  Row(
                                      modifier = Modifier.fillMaxWidth().horizontalScroll(rememberScrollState()).padding(horizontal = 12.dp, vertical = 6.dp),
                                      horizontalArrangement = Arrangement.spacedBy(8.dp)
                                  ) {
                                      for (idx in 0 until groups.size) {
                                          val g = groups[idx]
                                          val active = selectedTableGroupIdx == idx
                                          Box(
                                              modifier = Modifier
                                                  .clip(RoundedCornerShape(16.dp))
                                                  .background(if (active) KhlAccentRed else KhlBgDark)
                                                  .clickable { selectedTableGroupIdx = idx }
                                                  .padding(horizontal = 14.dp, vertical = 6.dp)
                                          ) {
                                              Text("${g.groupName} (${g.rows.size})", color = if (active) Color.White else KhlTextGray, fontSize = 12.sp, fontWeight = FontWeight.Bold)
                                          }
                                      }
                                  }
                              }
                          }
                      }
                  },
                  bottomBar = {
                      NavigationBar(containerColor = KhlCardDark) {
                          NavigationBarItem(
                              selected = bottomTab == 0,
                              onClick = { bottomTab = 0 },
                              icon = { Icon(Icons.Default.SportsHockey, null) },
                              label = { Text("Матчи ($totalLoadedMatches)") }
                          )
                          NavigationBarItem(
                              selected = bottomTab == 1,
                              onClick = { bottomTab = 1 },
                              icon = { Icon(Icons.Default.FormatListNumbered, null) },
                              label = { Text("Таблица (${pageData?.standingGroups?.size ?: 0})") }
                          )
                          NavigationBarItem(
                              selected = bottomTab == 2,
                              onClick = { bottomTab = 2 },
                              icon = { Icon(Icons.Default.EmojiEvents, null) },
                              label = { Text("Игроки") }
                          )
                          NavigationBarItem(
                              selected = bottomTab == 3,
                              onClick = { bottomTab = 3 },
                              icon = { Icon(Icons.Default.Code, null) },
                              label = { Text("Веб / API") }
                          )
                      }
                  }
              ) { innerPadding ->
                  Box(modifier = Modifier.fillMaxSize().padding(innerPadding)) {
                      if (isLoading) {
                          Column(modifier = Modifier.align(Alignment.Center), horizontalAlignment = Alignment.CenterHorizontally) {
                              CircularProgressIndicator(color = KhlAccentRed)
                              Spacer(modifier = Modifier.height(12.dp))
                              Text(
                                  text = "Загрузка таблиц Групп А, Б, В и матчей ФХМ...",
                                  color = KhlTextGray,
                                  fontSize = 12.sp,
                                  textAlign = TextAlign.Center,
                                  modifier = Modifier.padding(horizontal = 24.dp)
                              )
                          }
                      } else {
                          val data = pageData
                          if (data != null) {
                              when (bottomTab) {
                                  0 -> {
                                      val baseList = if (matchFilter == 1) data.pastMatches else data.upcomingMatches
                                      val filtered = if (selectedMatchGroup == "Все") baseList else baseList.filter { it.groupName.equals(selectedMatchGroup, ignoreCase = true) }
                                      LiveMatchesScreen(filtered, onMatchClick = { selectedMatch = it })
                                  }
                                  1 -> {
                                      val group = data.standingGroups.getOrNull(selectedTableGroupIdx)
                                      KhlStandingsScreen(group = group, onTeamClick = { selectedTeamRow = it })
                                  }
                                  2 -> LivePlayersScreen(data)
                                  3 -> WebAndDomScreen(data)
                              }
                          }
                      }
                  }
              }

              if (showTournamentPicker) {
                  var customId by remember { mutableStateOf(tournamentId) }
                  val quickList = listOf("54", "53", "52", "51", "50")
                  AlertDialog(
                      onDismissRequest = { showTournamentPicker = false },
                      containerColor = KhlCardDark,
                      title = { Text("Выбор турнира ФХМ", color = Color.White, fontSize = 16.sp, fontWeight = FontWeight.Bold) },
                      text = {
                          Column(verticalArrangement = Arrangement.spacedBy(8.dp)) {
                              OutlinedTextField(
                                  value = customId,
                                  onValueChange = { customId = it.filter { c -> c.isDigit() } },
                                  label = { Text("ID турнира (например, 54)") },
                                  singleLine = true
                              )
                              Row(horizontalArrangement = Arrangement.spacedBy(6.dp)) {
                                  quickList.forEach { qId ->
                                      Box(
                                          modifier = Modifier
                                              .clip(RoundedCornerShape(8.dp))
                                              .background(KhlBgDark)
                                              .clickable {
                                                  tournamentId = qId
                                                  showTournamentPicker = false
                                              }
                                              .padding(horizontal = 10.dp, vertical = 6.dp)
                                      ) {
                                          Text("#$qId", color = KhlIceBlue, fontSize = 12.sp, fontWeight = FontWeight.Bold)
                                      }
                                  }
                              }
                          }
                      },
                      confirmButton = {
                          TextButton(onClick = {
                              if (customId.isNotEmpty()) tournamentId = customId
                              showTournamentPicker = false
                          }) {
                              Text("Загрузить", color = KhlIceBlue)
                          }
                      }
                  )
              }

              selectedTeamRow?.let { row ->
                  AlertDialog(
                      onDismissRequest = { selectedTeamRow = null },
                      containerColor = KhlCardDark,
                      title = {
                          Row(verticalAlignment = Alignment.CenterVertically) {
                              AsyncImage(
                                  model = row.logoUrl,
                                  contentDescription = row.teamName,
                                  contentScale = ContentScale.Fit,
                                  modifier = Modifier.size(40.dp).clip(CircleShape).background(Color.White.copy(alpha = 0.1f)).padding(4.dp)
                              )
                              Spacer(modifier = Modifier.width(10.dp))
                              Text("${row.position}. ${row.teamName}", color = Color.White, fontSize = 15.sp, fontWeight = FontWeight.Bold)
                          }
                      },
                      text = {
                          Column(verticalArrangement = Arrangement.spacedBy(6.dp)) {
                              Text("Очки: ${row.points}  |  Игры: ${row.games}", color = KhlIceBlue, fontSize = 15.sp, fontWeight = FontWeight.Black)
                              Text("Победы: ${row.wins} (ОТ: ${row.otWins}) • Ничьи: ${row.ties} • Поражения: ${row.losses}", color = Color.White, fontSize = 13.sp)
                              Text("Шайбы: ${row.pucksScored} - ${row.pucksMissed} (${if (row.pucksDiff > 0) "+${row.pucksDiff}" else row.pucksDiff})", color = Color.White, fontSize = 13.sp)
                              if (row.tieBreakNote.isNotEmpty()) {
                                  Text(row.tieBreakNote, color = KhlTextGray, fontSize = 12.sp)
                              }
                          }
                      },
                      confirmButton = {
                          TextButton(onClick = { selectedTeamRow = null }) {
                              Text("Закрыть", color = KhlIceBlue)
                          }
                      }
                  )
              }

              selectedMatch?.let { match ->
                  AlertDialog(
                      onDismissRequest = { selectedMatch = null },
                      containerColor = KhlCardDark,
                      title = { Text("${match.homeTeam} — ${match.awayTeam}", color = Color.White, fontSize = 15.sp, fontWeight = FontWeight.Bold) },
                      text = {
                          Column(verticalArrangement = Arrangement.spacedBy(6.dp)) {
                              Text("Счет: ${match.scoreText}", color = KhlIceBlue, fontSize = 16.sp, fontWeight = FontWeight.Black)
                              Text("${match.groupName} • ${match.tourName}", color = KhlAccentRed, fontSize = 13.sp, fontWeight = FontWeight.Bold)
                              Text("Дата: ${match.dateText}", color = Color.White, fontSize = 13.sp)
                              Text("Протокол: ${match.gameUrl}", color = KhlTextGray, fontSize = 11.sp)
                          }
                      },
                      confirmButton = {
                          TextButton(onClick = { selectedMatch = null }) {
                              Text("Закрыть", color = KhlIceBlue)
                          }
                      }
                  )
              }
          }

          @Composable
          fun KhlStandingsScreen(group: StandingGroup?, onTeamClick: (StandingRow) -> Unit) {
              if (group == null || group.rows.isEmpty()) {
                  Box(modifier = Modifier.fillMaxSize().padding(24.dp), contentAlignment = Alignment.Center) {
                      Text("Таблица загружается...", color = KhlTextGray, fontSize = 14.sp)
                  }
                  return
              }

              LazyColumn(contentPadding = PaddingValues(12.dp), verticalArrangement = Arrangement.spacedBy(6.dp)) {
                  item {
                      Row(
                          modifier = Modifier.fillMaxWidth().background(KhlCardDark.copy(alpha = 0.6f), RoundedCornerShape(8.dp)).padding(horizontal = 10.dp, vertical = 8.dp),
                          verticalAlignment = Alignment.CenterVertically
                      ) {
                          Text("#", color = KhlTextGray, fontSize = 11.sp, fontWeight = FontWeight.Bold, modifier = Modifier.width(24.dp))
                          Text("КЛУБ (${group.groupName})", color = KhlTextGray, fontSize = 11.sp, fontWeight = FontWeight.Bold, modifier = Modifier.weight(1f))
                          Text("И", color = KhlTextGray, fontSize = 11.sp, fontWeight = FontWeight.Bold, modifier = Modifier.width(24.dp), textAlign = TextAlign.Center)
                          Text("В", color = KhlTextGray, fontSize = 11.sp, fontWeight = FontWeight.Bold, modifier = Modifier.width(24.dp), textAlign = TextAlign.Center)
                          Text("Н", color = KhlTextGray, fontSize = 11.sp, fontWeight = FontWeight.Bold, modifier = Modifier.width(22.dp), textAlign = TextAlign.Center)
                          Text("П", color = KhlTextGray, fontSize = 11.sp, fontWeight = FontWeight.Bold, modifier = Modifier.width(24.dp), textAlign = TextAlign.Center)
                          Text("ШАЙБЫ", color = KhlTextGray, fontSize = 11.sp, fontWeight = FontWeight.Bold, modifier = Modifier.width(56.dp), textAlign = TextAlign.Center)
                          Text("О", color = KhlIceBlue, fontSize = 12.sp, fontWeight = FontWeight.Black, modifier = Modifier.width(28.dp), textAlign = TextAlign.End)
                      }
                  }

                  items(group.rows) { row ->
                      Card(
                          colors = CardDefaults.cardColors(containerColor = KhlCardDark),
                          shape = RoundedCornerShape(10.dp),
                          modifier = Modifier.fillMaxWidth().clickable { onTeamClick(row) }
                      ) {
                          Row(
                              modifier = Modifier.fillMaxWidth().padding(horizontal = 10.dp, vertical = 10.dp),
                              verticalAlignment = Alignment.CenterVertically
                          ) {
                              Text(
                                  text = row.position.toString(),
                                  color = if (row.position <= 3) KhlAccentRed else KhlTextGray,
                                  fontWeight = FontWeight.Black,
                                  fontSize = 13.sp,
                                  modifier = Modifier.width(24.dp)
                              )
                              Row(modifier = Modifier.weight(1f), verticalAlignment = Alignment.CenterVertically) {
                                  AsyncImage(
                                      model = row.logoUrl,
                                      contentDescription = row.teamName,
                                      contentScale = ContentScale.Fit,
                                      modifier = Modifier.size(28.dp).clip(CircleShape).background(Color.White.copy(alpha = 0.08f)).padding(2.dp)
                                  )
                                  Spacer(modifier = Modifier.width(8.dp))
                                  Text(
                                      text = row.teamName.replace(" 2017", ""),
                                      color = Color.White,
                                      fontWeight = FontWeight.Bold,
                                      fontSize = 13.sp,
                                      maxLines = 1,
                                      overflow = TextOverflow.Ellipsis
                                  )
                              }
                              Text(row.games.toString(), color = KhlTextGray, fontSize = 12.sp, modifier = Modifier.width(24.dp), textAlign = TextAlign.Center)
                              Text(row.wins.toString(), color = KhlWinGreen, fontWeight = FontWeight.Bold, fontSize = 12.sp, modifier = Modifier.width(24.dp), textAlign = TextAlign.Center)
                              Text(row.ties.toString(), color = KhlTextGray, fontSize = 12.sp, modifier = Modifier.width(22.dp), textAlign = TextAlign.Center)
                              Text(row.losses.toString(), color = KhlTextGray, fontSize = 12.sp, modifier = Modifier.width(24.dp), textAlign = TextAlign.Center)
                              Text("${row.pucksScored}-${row.pucksMissed}", color = Color.White, fontSize = 11.sp, modifier = Modifier.width(56.dp), textAlign = TextAlign.Center)
                              Text(row.points.toString(), color = KhlIceBlue, fontWeight = FontWeight.Black, fontSize = 14.sp, modifier = Modifier.width(28.dp), textAlign = TextAlign.End)
                          }
                      }
                  }
              }
          }

          @Composable
          fun LiveMatchesScreen(matches: List<HockeyMatch>, onMatchClick: (HockeyMatch) -> Unit) {
              if (matches.isEmpty()) {
                  Box(modifier = Modifier.fillMaxSize().padding(24.dp), contentAlignment = Alignment.Center) {
                      Text("Матчей для выбранного фильтра нет.", color = KhlTextGray, fontSize = 14.sp)
                  }
                  return
              }

              LazyColumn(contentPadding = PaddingValues(12.dp), verticalArrangement = Arrangement.spacedBy(12.dp)) {
                  items(matches) { match ->
                      Card(
                          colors = CardDefaults.cardColors(containerColor = KhlCardDark),
                          shape = RoundedCornerShape(14.dp),
                          modifier = Modifier.fillMaxWidth().clickable { onMatchClick(match) }
                      ) {
                          Column(modifier = Modifier.padding(14.dp)) {
                              Row(modifier = Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceBetween) {
                                  Text("${match.groupName} • ${match.tourName}", color = KhlIceBlue, fontSize = 11.sp, fontWeight = FontWeight.Bold)
                                  Text(match.statusBadge, color = if (match.isFinished) KhlTextGray else KhlAccentRed, fontSize = 11.sp, fontWeight = FontWeight.Bold)
                              }
                              Spacer(modifier = Modifier.height(12.dp))
                              Row(modifier = Modifier.fillMaxWidth(), verticalAlignment = Alignment.CenterVertically, horizontalArrangement = Arrangement.SpaceBetween) {
                                  Row(modifier = Modifier.weight(1f), verticalAlignment = Alignment.CenterVertically) {
                                      AsyncImage(
                                          model = match.homeLogo,
                                          contentDescription = match.homeTeam,
                                          contentScale = ContentScale.Fit,
                                          modifier = Modifier.size(36.dp).clip(CircleShape).background(Color.White.copy(alpha = 0.08f)).padding(4.dp)
                                      )
                                      Spacer(modifier = Modifier.width(8.dp))
                                      Text(match.homeTeam, color = Color.White, fontSize = 13.sp, fontWeight = FontWeight.Bold, maxLines = 2, overflow = TextOverflow.Ellipsis)
                                  }
                                  Box(modifier = Modifier.padding(horizontal = 8.dp).clip(RoundedCornerShape(8.dp)).background(KhlBgDark).padding(horizontal = 12.dp, vertical = 6.dp)) {
                                      Text(match.scoreText, color = Color.White, fontSize = 18.sp, fontWeight = FontWeight.Black)
                                  }
                                  Row(modifier = Modifier.weight(1f), verticalAlignment = Alignment.CenterVertically, horizontalArrangement = Arrangement.End) {
                                      Text(match.awayTeam, color = Color.White, fontSize = 13.sp, fontWeight = FontWeight.Bold, textAlign = TextAlign.End, maxLines = 2, overflow = TextOverflow.Ellipsis, modifier = Modifier.weight(1f))
                                      Spacer(modifier = Modifier.width(8.dp))
                                      AsyncImage(
                                          model = match.awayLogo,
                                          contentDescription = match.awayTeam,
                                          contentScale = ContentScale.Fit,
                                          modifier = Modifier.size(36.dp).clip(CircleShape).background(Color.White.copy(alpha = 0.08f)).padding(4.dp)
                                      )
                                  }
                              }
                              Spacer(modifier = Modifier.height(10.dp))
                              Text(match.dateText, color = KhlTextGray, fontSize = 11.sp)
                          }
                      }
                  }
              }
          }

          @Composable
          fun LivePlayersScreen(data: TournamentPageData) {
              Box(modifier = Modifier.fillMaxSize().padding(24.dp), contentAlignment = Alignment.Center) {
                  Text(
                      text = "Нажми сверху на название турнира, чтобы переключиться на старшие возраста (например, #50, #51, #52, #53), или открой вкладку «Веб / API».",
                      color = KhlTextGray,
                      fontSize = 14.sp,
                      textAlign = TextAlign.Center
                  )
              }
          }

          @SuppressLint("SetJavaScriptEnabled")
          @Composable
          fun WebAndDomScreen(data: TournamentPageData) {
              val context = LocalContext.current
              var showLiveWeb by remember { mutableStateOf(false) }

              Column(modifier = Modifier.fillMaxSize()) {
                  Row(modifier = Modifier.fillMaxWidth().padding(horizontal = 12.dp, vertical = 8.dp), horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                      Button(
                          onClick = {
                              val clipboard = context.getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
                              clipboard.setPrimaryClip(ClipData.newPlainText("FHM_V30", data.diagnosticReport))
                              Toast.makeText(context, "Скопировано!", Toast.LENGTH_LONG).show()
                          },
                          colors = ButtonDefaults.buttonColors(containerColor = KhlAccentRed),
                          modifier = Modifier.weight(1f)
                      ) {
                          Icon(Icons.Default.ContentCopy, contentDescription = null, modifier = Modifier.size(16.dp))
                          Spacer(modifier = Modifier.width(6.dp))
                          Text("Скопировать API", fontSize = 12.sp, fontWeight = FontWeight.Bold)
                      }
                      Button(
                          onClick = { showLiveWeb = !showLiveWeb },
                          colors = ButtonDefaults.buttonColors(containerColor = KhlCardDark),
                          modifier = Modifier.weight(1f)
                      ) {
                          Icon(Icons.Default.Public, contentDescription = null, modifier = Modifier.size(16.dp), tint = KhlIceBlue)
                          Spacer(modifier = Modifier.width(6.dp))
                          Text(if (showLiveWeb) "Показать отчет" else "Открыть веб-вид", color = KhlIceBlue, fontSize = 12.sp, fontWeight = FontWeight.Bold)
                      }
                  }

                  if (showLiveWeb) {
                      AndroidView(
                          modifier = Modifier.fillMaxSize(),
                          factory = { ctx ->
                              WebView(ctx).apply {
                                  settings.javaScriptEnabled = true
                                  settings.domStorageEnabled = true
                                  webViewClient = WebViewClient()
                                  loadUrl(data.url)
                              }
                          }
                      )
                  } else {
                      LazyColumn(contentPadding = PaddingValues(12.dp), modifier = Modifier.fillMaxSize()) {
                          item {
                              Card(colors = CardDefaults.cardColors(containerColor = KhlCardDark), shape = RoundedCornerShape(12.dp), modifier = Modifier.fillMaxWidth()) {
                                  Text(data.diagnosticReport, color = Color.White, fontSize = 11.sp, fontFamily = FontFamily.Monospace, modifier = Modifier.padding(12.dp))
                              }
                          }
                      }
                  }
              }
          }
          EOF

      - name: Build Debug APK
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon 2>&1 | tee build_output.log || {
            echo "### Ошибки компиляции Kotlin" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            { grep -E "e: |FAILURE|What went wrong" -A 8 build_output.log || tail -n 40 build_output.log; } >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          }

      - name: Rename APK to v3.0
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/fhm-khl-v30.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fhm-khl-v30
          path: app/build/outputs/apk/debug/fhm-khl-v30.apk
