name: Build FHM v4.0 Turbo APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download Gradle 8.7 directly
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle-8.7-bin.zip -d /tmp
          echo "/tmp/gradle-8.7/bin" >> $GITHUB_PATH

      - name: Generate v4.0 project
        run: |
          rm -rf app settings.gradle.kts build.gradle.kts gradle.properties
          mkdir -p app/src/main/java/com/fhm/khlstyle

          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "FHM_KHL_V40"
          include(":app")
          EOF

          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          EOF

          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.fhm.khlstyle"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.fhm.khlstyle"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 40
                  versionName = "4.0"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
              buildFeatures {
                  compose = true
              }
              composeOptions {
                  kotlinCompilerExtensionVersion = "1.5.14"
              }
          }

          dependencies {
              val composeBom = platform("androidx.compose:compose-bom:2024.06.00")
              implementation(composeBom)
              implementation("androidx.activity:activity-compose:1.9.0")
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-graphics")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-extended")
              implementation("org.jsoup:jsoup:1.17.2")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1")
              implementation("io.coil-kt:coil-compose:2.6.0")
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:allowBackup="false"
                  android:icon="@android:drawable/sym_def_app_icon"
                  android:label="ФХМ Матч-Центр"
                  android:supportsRtl="true"
                  android:usesCleartextTraffic="true"
                  android:theme="@android:style/Theme.Material.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/fhm/khlstyle/MainActivity.kt
          package com.fhm.khlstyle

          import android.content.Intent
          import android.net.Uri
          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.foundation.background
          import androidx.compose.foundation.clickable
          import androidx.compose.foundation.horizontalScroll
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.LazyColumn
          import androidx.compose.foundation.lazy.items
          import androidx.compose.foundation.rememberScrollState
          import androidx.compose.foundation.shape.CircleShape
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.material.icons.Icons
          import androidx.compose.material.icons.filled.Close
          import androidx.compose.material.icons.filled.EmojiEvents
          import androidx.compose.material.icons.filled.FormatListNumbered
          import androidx.compose.material.icons.filled.Groups
          import androidx.compose.material.icons.filled.OpenInBrowser
          import androidx.compose.material.icons.filled.Refresh
          import androidx.compose.material.icons.filled.SportsHockey
          import androidx.compose.material.icons.filled.SwapHoriz
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.draw.clip
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.layout.ContentScale
          import androidx.compose.ui.platform.LocalContext
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.text.style.TextAlign
          import androidx.compose.ui.text.style.TextOverflow
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import coil.compose.AsyncImage
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.async
          import kotlinx.coroutines.awaitAll
          import kotlinx.coroutines.coroutineScope
          import kotlinx.coroutines.launch
          import kotlinx.coroutines.withContext
          import org.json.JSONArray
          import org.json.JSONObject
          import org.jsoup.Connection
          import org.jsoup.Jsoup

          // --- МОДЕЛИ ДАННЫХ ФХМ ---
          data class FhmTournamentOption(
              val id: Int,
              val name: String
          )

          data class HockeyMatch(
              val id: String,
              val homeTeam: String,
              val awayTeam: String,
              val homeLogo: String,
              val awayLogo: String,
              val scoreText: String,
              val dateText: String,
              val groupName: String,
              val tourName: String,
              val statusBadge: String,
              val isFinished: Boolean,
              val isLive: Boolean,
              val gameUrl: String
          )

          data class StandingRow(
              val position: Int,
              val teamId: Int,
              val teamName: String,
              val logoUrl: String,
              val games: Int,
              val wins: Int,
              val ties: Int,
              val losses: Int,
              val otWins: Int,
              val otLosses: Int,
              val pucksScored: Int,
              val pucksMissed: Int,
              val pucksDiff: Int,
              val points: Int,
              val tieBreakNote: String,
              val groupName: String
          )

          data class StandingGroup(
              val groupId: Int,
              val groupName: String,
              val rows: List<StandingRow>
          )

          data class BestPlayerItem(
              val id: String,
              val rank: Int,
              val fullName: String,
              val shortName: String,
              val number: String,
              val roleName: String,
              val birthDate: String,
              val clubName: String,
              val clubLogo: String,
              val playerPhoto: String,
              val categoryTitle: String,
              val games: Int,
              val goals: Int,
              val assists: Int,
              val points: Int,
              val mainStatLabel: String,
              val mainStatValue: String,
              val playerUrl: String
          )

          data class TournamentPageData(
              val tournamentId: Int,
              val tournamentTitle: String,
              val totalUpcomingCount: Int,
              val totalPastCount: Int,
              val upcomingMatches: List<HockeyMatch>,
              val pastMatches: List<HockeyMatch>,
              val standingGroups: List<StandingGroup>,
              val playersByCategory: Map<String, List<BestPlayerItem>>,
              val availableTournaments: List<FhmTournamentOption>
          )

          // --- ПРЯМОЙ TURBO-КЛИЕНТ FHMOSCOW.COM (БЕЗ WEBVIEW!) ---
          object FhmDirectApiClient {
              private const val BASE_URL = "https://fhmoscow.com"
              private const val USER_AGENT =
                  "Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Mobile Safari/537.36"

              private fun postApiJson(endpoint: String, payload: JSONObject, referer: String): String {
                  return try {
                      Jsoup.connect("$BASE_URL$endpoint")
                          .userAgent(USER_AGENT)
                          .header("Content-Type", "application/json")
                          .header("Accept", "application/json, text/plain, */*")
                          .header("X-Requested-With", "XMLHttpRequest")
                          .referrer(referer)
                          .ignoreContentType(true)
                          .maxBodySize(0)
                          .timeout(10000)
                          .method(Connection.Method.POST)
                          .requestBody(payload.toString())
                          .execute()
                          .body()
                  } catch (e: Exception) {
                      ""
                  }
              }

              suspend fun loadFullTournament(tournamentId: Int): TournamentPageData = withContext(Dispatchers.IO) {
                  val pageUrl = "$BASE_URL/tournament/$tournamentId"

                  // 1. Быстрым GET-запросом (0.2 сек) берем название турнира и ID групп из тегов <details data-standings-group="...">
                  val doc = try {
                      Jsoup.connect(pageUrl)
                          .userAgent(USER_AGENT)
                          .timeout(8000)
                          .get()
                  } catch (e: Exception) {
                      null
                  }

                  val h1 = doc?.select("h1, h2")?.firstOrNull()?.text()?.trim() ?: "Турнир ФХМ #$tournamentId"
                  val groupDefs = mutableListOf<Pair<Int, String>>()
                  if (doc != null) {
                      val detailsEls = doc.select("details.standings-group")
                      for (dEl in detailsEls) {
                          val gid = dEl.attr("data-standings-group").toIntOrNull()
                          val gName = dEl.select("summary span").firstOrNull()?.text()?.trim() ?: "Группа"
                          if (gid != null) {
                              groupDefs.add(Pair(gid, gName))
                          }
                      }
                  }

                  // Получаем список всех доступных турниров с главной/фильтров
                  val tournamentsList = mutableListOf<FhmTournamentOption>()
                  if (doc != null) {
                      val tLinks = doc.select("a[href*=/tournament/]")
                      for (a in tLinks) {
                          val href = a.attr("href")
                          val tid = href.substringAfter("/tournament/").substringBefore("?").filter { it.isDigit() }.toIntOrNull()
                          val tName = a.text().trim()
                          if (tid != null && tName.length > 4 && tournamentsList.none { it.id == tid }) {
                              tournamentsList.add(FhmTournamentOption(tid, tName))
                          }
                      }
                  }

                  // 2. ПАРАЛЛЕЛЬНО запрашиваем:
                  // - 3 страницы прошедших матчей (offset = 0, 8, 16 -> 24 матча)
                  // - 3 страницы будущих матчей (offset = 0, 8, 16 -> 24 матча)
                  // - Все группы таблиц
                  // - Все 6 номинаций игроков
                  coroutineScope {
                      val pastJobs = listOf(0, 8, 16).map { offset ->
                          async { fetchGamesPage(tournamentId, "-", offset, pageUrl) }
                      }
                      val upcomingJobs = listOf(0, 8, 16).map { offset ->
                          async { fetchGamesPage(tournamentId, "+", offset, pageUrl) }
                      }

                      val tableJobs = if (groupDefs.isNotEmpty()) {
                          groupDefs.map { (gid, gName) ->
                              async { fetchStandingGroup(tournamentId, gid, gName, pageUrl) }
                          }
                      } else {
                          // Если турнир без деления на группы, пробуем group = null
                          listOf(async { fetchStandingGroup(tournamentId, null, "Общая таблица", pageUrl) })
                      }

                      val playerCategoriesSpec = listOf(
                          Triple("Бомбардиры", "bomber", null),
                          Triple("Снайперы", "sniper", null),
                          Triple("Ассистенты", "assistant", null),
                          Triple("Защитники-бомбардиры", "bomber", 2),
                          Triple("Защитники-снайперы", "sniper", 2),
                          Triple("Штрафники", "penalty", null),
                          Triple("Вратари", "goalkeeper", null)
                      )

                      val playerJobs = playerCategoriesSpec.map { (title, nom, role) ->
                          async { Pair(title, fetchPlayersCategory(tournamentId, title, nom, role, pageUrl)) }
                      }

                      val pastResults = pastJobs.awaitAll()
                      val upcomingResults = upcomingJobs.awaitAll()
                      val standingGroups = tableJobs.awaitAll().filter { it.rows.isNotEmpty() }
                      val playerResults = playerJobs.awaitAll()

                      val totalPast = pastResults.maxOfOrNull { it.first } ?: 0
                      val totalUpcoming = upcomingResults.maxOfOrNull { it.first } ?: 0

                      val mergedPast = pastResults.flatMap { it.second }.distinctBy { it.id }
                      val mergedUpcoming = upcomingResults.flatMap { it.second }.distinctBy { it.id }

                      val playersMap = linkedMapOf<String, List<BestPlayerItem>>()
                      for ((title, list) in playerResults) {
                          if (list.isNotEmpty()) {
                              playersMap[title] = list
                          }
                      }

                      TournamentPageData(
                          tournamentId = tournamentId,
                          tournamentTitle = h1,
                          totalUpcomingCount = maxOf(totalUpcoming, mergedUpcoming.size),
                          totalPastCount = maxOf(totalPast, mergedPast.size),
                          upcomingMatches = mergedUpcoming,
                          pastMatches = mergedPast,
                          standingGroups = standingGroups,
                          playersByCategory = playersMap,
                          availableTournaments = tournamentsList
                      )
                  }
              }

              // Догрузка следующих 24 матчей (по 3 страницы за раз) при нажатии кнопки "Показать еще"
              suspend fun loadMoreMatches(
                  tournamentId: Int,
                  period: String,
                  currentOffset: Int
              ): List<HockeyMatch> = withContext(Dispatchers.IO) {
                  val pageUrl = "$BASE_URL/tournament/$tournamentId"
                  coroutineScope {
                      val offsets = listOf(currentOffset, currentOffset + 8, currentOffset + 16)
                      val jobs = offsets.map { off ->
                          async { fetchGamesPage(tournamentId, period, off, pageUrl).second }
                      }
                      jobs.awaitAll().flatten().distinctBy { it.id }
                  }
              }

              private fun fetchGamesPage(
                  tournamentId: Int,
                  period: String,
                  offset: Int,
                  referer: String
              ): Pair<Int, List<HockeyMatch>> {
                  val req = JSONObject().apply {
                      put("dateFrom", JSONObject.NULL)
                      put("dateTo", JSONObject.NULL)
                      put("limit", 8)
                      put("offset", offset)
                      put("hideTournament", JSONObject.NULL)
                      put("period", period)
                      put("tournament", tournamentId)
                  }
                  val body = postApiJson("/api/game/list", req, referer)
                  if (!body.startsWith("{")) return Pair(0, emptyList())

                  return try {
                      val json = JSONObject(body)
                      val count = json.optInt("count", 0)
                      val items = json.optJSONArray("items") ?: JSONArray()
                      val list = mutableListOf<HockeyMatch>()
                      for (i in 0 until items.length()) {
                          val mObj = items.optJSONObject(i) ?: continue
                          list.add(parseGameJsonItem(mObj, offset + i))
                      }
                      Pair(count, list)
                  } catch (e: Exception) {
                      Pair(0, emptyList())
                  }
              }

              private fun fetchStandingGroup(
                  tournamentId: Int,
                  groupId: Int?,
                  groupName: String,
                  referer: String
              ): StandingGroup {
                  val req = JSONObject().apply {
                      put("tournament", tournamentId)
                      if (groupId != null) put("group", groupId) else put("group", JSONObject.NULL)
                  }
                  val body = postApiJson("/api/tournamentTable/list", req, referer)
                  if (!body.startsWith("{")) return StandingGroup(groupId ?: 0, groupName, emptyList())

                  return try {
                      val json = JSONObject(body)
                      val items = json.optJSONArray("items") ?: JSONArray()
                      val rows = mutableListOf<StandingRow>()
                      for (i in 0 until items.length()) {
                          val rObj = items.optJSONObject(i) ?: continue
                          rows.add(
                              StandingRow(
                                  position = rObj.optInt("position", i + 1),
                                  teamId = rObj.optInt("teamId", 0),
                                  teamName = rObj.optString("team", "Команда"),
                                  logoUrl = rObj.optString("logo", ""),
                                  games = rObj.optInt("games", 0),
                                  wins = rObj.optInt("countWin", 0),
                                  ties = rObj.optInt("countTie", 0),
                                  losses = rObj.optInt("countLose", 0),
                                  otWins = rObj.optInt("countOvertimeWin", 0),
                                  otLosses = rObj.optInt("countOvertimeLose", 0),
                                  pucksScored = rObj.optInt("pucksScored", 0),
                                  pucksMissed = rObj.optInt("pucksMissed", 0),
                                  pucksDiff = rObj.optInt("pucksDifference", 0),
                                  points = rObj.optInt("score", 0),
                                  tieBreakNote = rObj.optString("tieBreakRuleLabel", ""),
                                  groupName = groupName
                              )
                          )
                      }
                      StandingGroup(groupId ?: 0, groupName, rows)
                  } catch (e: Exception) {
                      StandingGroup(groupId ?: 0, groupName, emptyList())
                  }
              }

              private fun fetchPlayersCategory(
                  tournamentId: Int,
                  categoryTitle: String,
                  nomination: String,
                  role: Int?,
                  referer: String
              ): List<BestPlayerItem> {
                  val req = JSONObject().apply {
                      put("season", JSONObject.NULL)
                      put("tournament", tournamentId)
                      put("group", JSONObject.NULL)
                      put("limit", 25)
                      put("nomination", nomination)
                      if (role != null) put("role", role) else put("role", JSONObject.NULL)
                  }
                  val body = postApiJson("/api/playerStatistic/list", req, referer)
                  if (!body.startsWith("{")) return emptyList()

                  return try {
                      val json = JSONObject(body)
                      val items = json.optJSONArray("items") ?: JSONArray()
                      val list = mutableListOf<BestPlayerItem>()
                      for (i in 0 until items.length()) {
                          val pObj = items.optJSONObject(i) ?: continue
                          list.add(parsePlayerStatItem(pObj, i + 1, categoryTitle, nomination))
                      }
                      list
                  } catch (e: Exception) {
                      emptyList()
                  }
              }

              private fun parsePlayerStatItem(
                  pObj: JSONObject,
                  rank: Int,
                  categoryTitle: String,
                  nomination: String
              ): BestPlayerItem {
                  val id = pObj.optString("id", "p_$rank")
                  val surname = pObj.optString("surname", "").trim()
                  val name = pObj.optString("name", "").trim()
                  val patronymic = pObj.optString("patronymic", "").trim()
                  val fullName = "$surname $name $patronymic".trim()
                  val shortName = "$surname $name".trim()

                  val numberInt = pObj.optInt("number", 0)
                  val numberStr = if (numberInt > 0) numberInt.toString() else ""
                  val roleName = pObj.optString("role", "")
                  val birthDate = pObj.optString("dateOfBirth", "")
                  val clubName = pObj.optString("clubName", "")
                  val clubLogo = pObj.optString("clubPhoto", "")
                  val photoRaw = if (!pObj.isNull("photo")) pObj.optString("photo", "") else ""
                  val playerUrl = "$BASE_URL${pObj.optString("url", "/player/$id")}"

                  val statObj = pObj.optJSONObject("statistics") ?: JSONObject()
                  val games = statObj.optInt("games", 0)
                  val goals = statObj.optInt("goals", 0)
                  val assists = statObj.optInt("assists", 0)
                  val points = statObj.optInt("goalPasses", goals + assists)
                  val penalty = statObj.optInt("penalty", statObj.optInt("penaltyMinutes", 0))

                  val (mainLabel, mainVal) = when (nomination) {
                      "sniper" -> Pair("ШАЙБЫ", goals.toString())
                      "assistant" -> Pair("ПАСЫ", assists.toString())
                      "penalty" -> Pair("ШТРАФ", penalty.toString())
                      else -> Pair("ОЧКИ", points.toString())
                  }

                  return BestPlayerItem(
                      id = id,
                      rank = rank,
                      fullName = fullName,
                      shortName = shortName,
                      number = numberStr,
                      roleName = roleName,
                      birthDate = birthDate,
                      clubName = clubName,
                      clubLogo = clubLogo,
                      playerPhoto = photoRaw.ifEmpty { clubLogo },
                      categoryTitle = categoryTitle,
                      games = games,
                      goals = goals,
                      assists = assists,
                      points = points,
                      mainStatLabel = mainLabel,
                      mainStatValue = mainVal,
                      playerUrl = playerUrl
                  )
              }

              private fun parseGameJsonItem(mObj: JSONObject, index: Int): HockeyMatch {
                  val id = mObj.optString("id", "idx_$index")
                  val dateStr = mObj.optString("displayDate", mObj.optString("date", ""))
                  val groupStr = mObj.optString("group", "")
                  val tourStr = mObj.optString("tour", "")
                  val statusInt = mObj.optInt("status", 0)
                  val isLive = mObj.optBoolean("isLive", false)
                  val overtime = mObj.optBoolean("overtime", false)
                  val shootout = mObj.optBoolean("shootout", false)
                  val gameUrl = mObj.optString("url", "/game/$id")

                  val t1 = mObj.optJSONObject("team1")
                  val t2 = mObj.optJSONObject("team2")

                  val homeTeam = t1?.optString("name", "Команда 1") ?: "Команда 1"
                  val awayTeam = t2?.optString("name", "Команда 2") ?: "Команда 2"
                  val homeLogo = t1?.optString("logo", "") ?: ""
                  val awayLogo = t2?.optString("logo", "") ?: ""

                  val s1 = if (t1 != null && !t1.isNull("score")) t1.opt("score").toString() else null
                  val s2 = if (t2 != null && !t2.isNull("score")) t2.opt("score").toString() else null

                  val suffix = when {
                      shootout -> " Б"
                      overtime -> " ОТ"
                      else -> ""
                  }

                  val scoreText = if (s1 != null && s2 != null) "$s1 : $s2$suffix" else "VS"
                  val statusBadge = when {
                      isLive -> "LIVE"
                      statusInt == 2 -> "ОКОНЧЕН"
                      else -> mObj.optString("date", "МАТЧ")
                  }

                  return HockeyMatch(
                      id = id,
                      homeTeam = homeTeam,
                      awayTeam = awayTeam,
                      homeLogo = homeLogo,
                      awayLogo = awayLogo,
                      scoreText = scoreText,
                      dateText = dateStr,
                      groupName = groupStr,
                      tourName = tourStr,
                      statusBadge = statusBadge,
                      isFinished = (statusInt == 2),
                      isLive = isLive,
                      gameUrl = "$BASE_URL$gameUrl"
                  )
              }
          }

          val KhlBgDark = Color(0xFF0B101B)
          val KhlCardDark = Color(0xFF161F30)
          val KhlAccentRed = Color(0xFFE30613)
          val KhlIceBlue = Color(0xFF00A8E8)
          val KhlTextGray = Color(0xFF8F9BB3)
          val KhlWinGreen = Color(0xFF00C853)

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContent {
                      MaterialTheme(
                          colorScheme = darkColorScheme(
                              background = KhlBgDark,
                              surface = KhlCardDark,
                              primary = KhlAccentRed,
                              secondary = KhlIceBlue
                          )
                      ) {
                          FhmKhlAppV40()
                      }
                  }
              }
          }

          @Composable
          fun FhmKhlAppV40() {
              val context = LocalContext.current
              val scope = rememberCoroutineScope()

              var bottomTab by remember { mutableIntStateOf(0) } // 0=Матчи, 1=Таблица, 2=Игроки, 3=Клубы
              var matchFilter by remember { mutableIntStateOf(1) } // 1=Прошедшие, 0=Ближайшие
              var selectedMatchGroup by remember { mutableStateOf("Все") }
              var selectedTeamFilter by remember { mutableStateOf<String?>(null) }
              var selectedTableGroupIdx by remember { mutableIntStateOf(0) }
              var selectedPlayerCatIdx by remember { mutableIntStateOf(0) }
              var tournamentId by remember { mutableIntStateOf(54) }

              var pageData by remember { mutableStateOf<TournamentPageData?>(null) }
              var pastList by remember { mutableStateOf<List<HockeyMatch>>(emptyList()) }
              var upcomingList by remember { mutableStateOf<List<HockeyMatch>>(emptyList()) }
              var isLoading by remember { mutableStateOf(true) }
              var isLoadingMore by remember { mutableStateOf(false) }

              var selectedMatch by remember { mutableStateOf<HockeyMatch?>(null) }
              var selectedTeamRow by remember { mutableStateOf<StandingRow?>(null) }
              var selectedPlayer by remember { mutableStateOf<BestPlayerItem?>(null) }
              var showTournamentPicker by remember { mutableStateOf(false) }

              fun reload() {
                  scope.launch {
                      isLoading = true
                      selectedTableGroupIdx = 0
                      selectedPlayerCatIdx = 0
                      selectedTeamFilter = null
                      val data = FhmDirectApiClient.loadFullTournament(tournamentId)
                      pageData = data
                      pastList = data.pastMatches
                      upcomingList = data.upcomingMatches
                      isLoading = false
                  }
              }

              fun loadMoreCurrentMatches() {
                  if (isLoadingMore) return
                  scope.launch {
                      isLoadingMore = true
                      if (matchFilter == 1) {
                          val more = FhmDirectApiClient.loadMoreMatches(tournamentId, "-", pastList.size)
                          pastList = (pastList + more).distinctBy { it.id }
                      } else {
                          val more = FhmDirectApiClient.loadMoreMatches(tournamentId, "+", upcomingList.size)
                          upcomingList = (upcomingList + more).distinctBy { it.id }
                      }
                      isLoadingMore = false
                  }
              }

              LaunchedEffect(tournamentId) { reload() }

              val playerCategories = pageData?.playersByCategory?.keys?.toList() ?: emptyList()
              val allClubs = remember(pageData) {
                  pageData?.standingGroups?.flatMap { it.rows } ?: emptyList()
              }

              Scaffold(
                  containerColor = KhlBgDark,
                  topBar = {
                      Column(
                          modifier = Modifier
                              .fillMaxWidth()
                              .background(KhlCardDark)
                              .padding(top = 10.dp, bottom = 8.dp)
                      ) {
                          Row(
                              modifier = Modifier.fillMaxWidth().padding(horizontal = 14.dp),
                              horizontalArrangement = Arrangement.SpaceBetween,
                              verticalAlignment = Alignment.CenterVertically
                          ) {
                              Column(modifier = Modifier.weight(1f).clickable { showTournamentPicker = true }) {
                                  Row(verticalAlignment = Alignment.CenterVertically) {
                                      Box(modifier = Modifier.size(9.dp).clip(CircleShape).background(KhlAccentRed))
                                      Spacer(modifier = Modifier.width(8.dp))
                                      Text(
                                          text = "ФХМ • МАТЧ-ЦЕНТР (ТУРНИР #$tournamentId)",
                                          color = KhlIceBlue,
                                          fontSize = 11.sp,
                                          fontWeight = FontWeight.Bold
                                      )
                                  }
                                  Text(
                                      text = pageData?.tournamentTitle ?: "Загрузка...",
                                      color = Color.White,
                                      fontSize = 15.sp,
                                      fontWeight = FontWeight.Black,
                                      maxLines = 1,
                                      overflow = TextOverflow.Ellipsis
                                  )
                              }
                              Row {
                                  IconButton(onClick = { showTournamentPicker = true }) {
                                      Icon(Icons.Default.SwapHoriz, contentDescription = "Сменить турнир", tint = KhlIceBlue)
                                  }
                                  IconButton(onClick = { reload() }) {
                                      Icon(Icons.Default.Refresh, contentDescription = "Обновить", tint = Color.White)
                                  }
                              }
                          }

                          // Шапка для вкладки 0 (Матчи)
                          if (bottomTab == 0) {
                              Row(
                                  modifier = Modifier.fillMaxWidth().padding(horizontal = 12.dp, vertical = 4.dp),
                                  horizontalArrangement = Arrangement.spacedBy(8.dp)
                              ) {
                                  val totalPast = pageData?.totalPastCount ?: pastList.size
                                  val totalUp = pageData?.totalUpcomingCount ?: upcomingList.size
                                  val filters = listOf(
                                      1 to "Результаты (${pastList.size} из $totalPast)",
                                      0 to "Календарь (${upcomingList.size} из $totalUp)"
                                  )
                                  filters.forEach { pair ->
                                      val idx = pair.first
                                      val label = pair.second
                                      val active = matchFilter == idx
                                      Box(
                                          modifier = Modifier
                                              .clip(RoundedCornerShape(16.dp))
                                              .background(if (active) KhlAccentRed else KhlBgDark)
                                              .clickable { matchFilter = idx }
                                              .padding(horizontal = 12.dp, vertical = 6.dp)
                                      ) {
                                          Text(label, color = if (active) Color.White else KhlTextGray, fontSize = 12.sp, fontWeight = FontWeight.Bold)
                                      }
                                  }
                              }

                              // Плашка выбранного клуба (если отфильтровано по команде)
                              if (selectedTeamFilter != null) {
                                  Row(
                                      modifier = Modifier
                                          .fillMaxWidth()
                                          .padding(horizontal = 12.dp, vertical = 4.dp)
                                          .clip(RoundedCornerShape(8.dp))
                                          .background(KhlIceBlue.copy(alpha = 0.2f))
                                          .clickable { selectedTeamFilter = null }
                                          .padding(horizontal = 12.dp, vertical = 6.dp),
                                      horizontalArrangement = Arrangement.SpaceBetween,
                                      verticalAlignment = Alignment.CenterVertically
                                  ) {
                                      Text(
                                          text = "Команда: $selectedTeamFilter",
                                          color = Color.White,
                                          fontSize = 12.sp,
                                          fontWeight = FontWeight.Bold
                                      )
                                      Icon(Icons.Default.Close, contentDescription = "Сбросить", tint = KhlIceBlue, modifier = Modifier.size(16.dp))
                                  }
                              } else {
                                  val groupOptions = listOf("Все") + (pageData?.standingGroups?.map { it.groupName } ?: listOf("Группа А", "Группа Б", "Группа В"))
                                  Row(
                                      modifier = Modifier.fillMaxWidth().horizontalScroll(rememberScrollState()).padding(horizontal = 12.dp, vertical = 2.dp),
                                      horizontalArrangement = Arrangement.spacedBy(6.dp)
                                  ) {
                                      groupOptions.distinct().forEach { grp ->
                                          val isSel = selectedMatchGroup == grp
                                          Box(
                                              modifier = Modifier
                                                  .clip(RoundedCornerShape(8.dp))
                                                  .background(if (isSel) KhlIceBlue.copy(alpha = 0.25f) else Color.Transparent)
                                                  .clickable { selectedMatchGroup = grp }
                                                  .padding(horizontal = 10.dp, vertical = 4.dp)
                                          ) {
                                              Text(grp, color = if (isSel) KhlIceBlue else KhlTextGray, fontSize = 12.sp, fontWeight = FontWeight.SemiBold)
                                          }
                                      }
                                  }
                              }
                          }

                          // Шапка для вкладки 1 (Таблица)
                          if (bottomTab == 1) {
                              val groups = pageData?.standingGroups ?: emptyList()
                              if (groups.isNotEmpty()) {
                                  Row(
                                      modifier = Modifier.fillMaxWidth().horizontalScroll(rememberScrollState()).padding(horizontal = 12.dp, vertical = 6.dp),
                                      horizontalArrangement = Arrangement.spacedBy(8.dp)
                                  ) {
                                      for (idx in 0 until groups.size) {
                                          val g = groups[idx]
                                          val active = selectedTableGroupIdx == idx
                                          Box(
                                              modifier = Modifier
                                                  .clip(RoundedCornerShape(16.dp))
                                                  .background(if (active) KhlAccentRed else KhlBgDark)
                                                  .clickable { selectedTableGroupIdx = idx }
                                                  .padding(horizontal = 14.dp, vertical = 6.dp)
                                          ) {
                                              Text("${g.groupName} (${g.rows.size})", color = if (active) Color.White else KhlTextGray, fontSize = 12.sp, fontWeight = FontWeight.Bold)
                                          }
                                      }
                                  }
                              }
                          }

                          // Шапка для вкладки 2 (Лидеры / Игроки)
                          if (bottomTab == 2 && playerCategories.isNotEmpty()) {
                              Row(
                                  modifier = Modifier.fillMaxWidth().horizontalScroll(rememberScrollState()).padding(horizontal = 12.dp, vertical = 6.dp),
                                  horizontalArrangement = Arrangement.spacedBy(8.dp)
                              ) {
                                  for (idx in 0 until playerCategories.size) {
                                      val catName = playerCategories[idx]
                                      val active = selectedPlayerCatIdx == idx
                                      Box(
                                          modifier = Modifier
                                              .clip(RoundedCornerShape(16.dp))
                                              .background(if (active) KhlAccentRed else KhlBgDark)
                                              .clickable { selectedPlayerCatIdx = idx }
                                              .padding(horizontal = 14.dp, vertical = 6.dp)
                                      ) {
                                          Text(catName, color = if (active) Color.White else KhlTextGray, fontSize = 12.sp, fontWeight = FontWeight.Bold)
                                      }
                                  }
                              }
                          }
                      }
                  },
                  bottomBar = {
                      NavigationBar(containerColor = KhlCardDark) {
                          NavigationBarItem(
                              selected = bottomTab == 0,
                              onClick = { bottomTab = 0 },
                              icon = { Icon(Icons.Default.SportsHockey, null) },
                              label = { Text("Матчи") }
                          )
                          NavigationBarItem(
                              selected = bottomTab == 1,
                              onClick = { bottomTab = 1 },
                              icon = { Icon(Icons.Default.FormatListNumbered, null) },
                              label = { Text("Таблица") }
                          )
                          NavigationBarItem(
                              selected = bottomTab == 2,
                              onClick = { bottomTab = 2 },
                              icon = { Icon(Icons.Default.EmojiEvents, null) },
                              label = { Text("Лидеры") }
                          )
                          NavigationBarItem(
                              selected = bottomTab == 3,
                              onClick = { bottomTab = 3 },
                              icon = { Icon(Icons.Default.Groups, null) },
                              label = { Text("Клубы (${allClubs.size})") }
                          )
                      }
                  }
              ) { innerPadding ->
                  Box(modifier = Modifier.fillMaxSize().padding(innerPadding)) {
                      if (isLoading) {
                          Column(modifier = Modifier.align(Alignment.Center), horizontalAlignment = Alignment.CenterHorizontally) {
                              CircularProgressIndicator(color = KhlAccentRed)
                              Spacer(modifier = Modifier.height(12.dp))
                              Text(
                                  text = "Прямая загрузка JSON API fhmoscow.com...",
                                  color = KhlTextGray,
                                  fontSize = 12.sp
                              )
                          }
                      } else {
                          val data = pageData
                          if (data != null) {
                              when (bottomTab) {
                                  0 -> {
                                      val baseList = if (matchFilter == 1) pastList else upcomingList
                                      val totalAvailable = if (matchFilter == 1) data.totalPastCount else data.totalUpcomingCount
                                      val canLoadMore = baseList.size < totalAvailable

                                      val filtered = baseList.filter { m ->
                                          val groupOk = selectedMatchGroup == "Все" || m.groupName.equals(selectedMatchGroup, ignoreCase = true)
                                          val teamOk = selectedTeamFilter == null ||
                                              m.homeTeam.contains(selectedTeamFilter!!, ignoreCase = true) ||
                                              m.awayTeam.contains(selectedTeamFilter!!, ignoreCase = true)
                                          groupOk && teamOk
                                      }

                                      LiveMatchesScreen(
                                          matches = filtered,
                                          canLoadMore = canLoadMore,
                                          isLoadingMore = isLoadingMore,
                                          onLoadMore = { loadMoreCurrentMatches() },
                                          onMatchClick = { selectedMatch = it }
                                      )
                                  }
                                  1 -> {
                                      val group = data.standingGroups.getOrNull(selectedTableGroupIdx)
                                      KhlStandingsScreen(
                                          group = group,
                                          onTeamClick = { selectedTeamRow = it }
                                      )
                                  }
                                  2 -> {
                                      val catKey = playerCategories.getOrNull(selectedPlayerCatIdx) ?: ""
                                      val playersList = data.playersByCategory[catKey] ?: emptyList()
                                      KhlPlayersScreen(
                                          players = playersList,
                                          onPlayerClick = { selectedPlayer = it }
                                      )
                                  }
                                  3 -> {
                                      ClubsDirectoryScreen(
                                          clubs = allClubs,
                                          onSelectClubMatches = { clubName ->
                                              selectedTeamFilter = clubName
                                              bottomTab = 0
                                          },
                                          onClubDetails = { selectedTeamRow = it }
                                      )
                                  }
                              }
                          }
                      }
                  }
              }

              // Выбор турнира
              if (showTournamentPicker) {
                  var customId by remember { mutableStateOf(tournamentId.toString()) }
                  val defaultTournaments = listOf(
                      FhmTournamentOption(54, "Кубок г. Москвы 2017 г.р. (4х4)"),
                      FhmTournamentOption(53, "Турнир ФХМ #53"),
                      FhmTournamentOption(52, "Турнир ФХМ #52"),
                      FhmTournamentOption(51, "Турнир ФХМ #51"),
                      FhmTournamentOption(50, "Турнир ФХМ #50"),
                      FhmTournamentOption(49, "Турнир ФХМ #49"),
                      FhmTournamentOption(48, "Турнир ФХМ #48")
                  )
                  val options = if (!pageData?.availableTournaments.isNullOrEmpty()) {
                      pageData!!.availableTournaments
                  } else {
                      defaultTournaments
                  }

                  AlertDialog(
                      onDismissRequest = { showTournamentPicker = false },
                      containerColor = KhlCardDark,
                      title = { Text("Выбор турнира ФХМ", color = Color.White, fontSize = 16.sp, fontWeight = FontWeight.Bold) },
                      text = {
                          Column(verticalArrangement = Arrangement.spacedBy(8.dp)) {
                              OutlinedTextField(
                                  value = customId,
                                  onValueChange = { customId = it.filter { c -> c.isDigit() } },
                                  label = { Text("ID турнира на fhmoscow.com") },
                                  singleLine = true
                              )
                              Text("Турниры:", color = KhlTextGray, fontSize = 12.sp)
                              LazyColumn(
                                  modifier = Modifier.heightIn(max = 260.dp),
                                  verticalArrangement = Arrangement.spacedBy(6.dp)
                              ) {
                                  items(options) { opt ->
                                      Box(
                                          modifier = Modifier
                                              .fillMaxWidth()
                                              .clip(RoundedCornerShape(8.dp))
                                              .background(if (opt.id == tournamentId) KhlAccentRed else KhlBgDark)
                                              .clickable {
                                                  tournamentId = opt.id
                                                  showTournamentPicker = false
                                              }
                                              .padding(10.dp)
                                      ) {
                                          Text("#${opt.id} — ${opt.name}", color = Color.White, fontSize = 13.sp, fontWeight = FontWeight.SemiBold)
                                      }
                                  }
                              }
                          }
                      },
                      confirmButton = {
                          TextButton(onClick = {
                              val parsed = customId.toIntOrNull()
                              if (parsed != null) tournamentId = parsed
                              showTournamentPicker = false
                          }) {
                              Text("Перейти", color = KhlIceBlue)
                          }
                      }
                  )
              }

              // Досье игрока
              selectedPlayer?.let { p ->
                  AlertDialog(
                      onDismissRequest = { selectedPlayer = null },
                      containerColor = KhlCardDark,
                      title = {
                          Row(verticalAlignment = Alignment.CenterVertically) {
                              AsyncImage(
                                  model = p.playerPhoto,
                                  contentDescription = p.fullName,
                                  contentScale = ContentScale.Crop,
                                  modifier = Modifier.size(54.dp).clip(CircleShape).background(Color.White.copy(alpha = 0.1f))
                              )
                              Spacer(modifier = Modifier.width(12.dp))
                              Column {
                                  Text(p.fullName, color = Color.White, fontSize = 15.sp, fontWeight = FontWeight.Bold)
                                  val numText = if (p.number.isNotEmpty()) "№${p.number} • " else ""
                                  Text("$numText${p.roleName}", color = KhlIceBlue, fontSize = 12.sp, fontWeight = FontWeight.Bold)
                              }
                          }
                      },
                      text = {
                          Column(verticalArrangement = Arrangement.spacedBy(8.dp)) {
                              Row(verticalAlignment = Alignment.CenterVertically) {
                                  AsyncImage(
                                      model = p.clubLogo,
                                      contentDescription = p.clubName,
                                      modifier = Modifier.size(24.dp)
                                  )
                                  Spacer(modifier = Modifier.width(8.dp))
                                  Text(p.clubName, color = Color.White, fontSize = 14.sp, fontWeight = FontWeight.Bold)
                              }
                              Text("Дата рождения: ${p.birthDate}", color = KhlTextGray, fontSize = 13.sp)
                              Row(
                                  modifier = Modifier
                                      .fillMaxWidth()
                                      .clip(RoundedCornerShape(10.dp))
                                      .background(KhlBgDark)
                                      .padding(12.dp),
                                  horizontalArrangement = Arrangement.SpaceEvenly
                              ) {
                                  StatMiniBox("ИГРЫ", p.games.toString())
                                  StatMiniBox("ГОЛЫ", p.goals.toString())
                                  StatMiniBox("ПАСЫ", p.assists.toString())
                                  StatMiniBox("ОЧКИ", p.points.toString(), highlight = true)
                              }
                          }
                      },
                      confirmButton = {
                          Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                              TextButton(onClick = {
                                  context.startActivity(Intent(Intent.ACTION_VIEW, Uri.parse(p.playerUrl)))
                              }) {
                                  Text("Профиль на ФХМ", color = KhlAccentRed)
                              }
                              TextButton(onClick = { selectedPlayer = null }) {
                                  Text("Закрыть", color = KhlIceBlue)
                              }
                          }
                      }
                  )
              }

              // Карточка команды
              selectedTeamRow?.let { row ->
                  AlertDialog(
                      onDismissRequest = { selectedTeamRow = null },
                      containerColor = KhlCardDark,
                      title = {
                          Row(verticalAlignment = Alignment.CenterVertically) {
                              AsyncImage(
                                  model = row.logoUrl,
                                  contentDescription = row.teamName,
                                  contentScale = ContentScale.Fit,
                                  modifier = Modifier.size(44.dp).clip(CircleShape).background(Color.White.copy(alpha = 0.1f)).padding(4.dp)
                              )
                              Spacer(modifier = Modifier.width(10.dp))
                              Column {
                                  Text(row.teamName, color = Color.White, fontSize = 15.sp, fontWeight = FontWeight.Bold)
                                  Text("${row.groupName} • ${row.position} место", color = KhlIceBlue, fontSize = 12.sp)
                              }
                          }
                      },
                      text = {
                          Column(verticalArrangement = Arrangement.spacedBy(8.dp)) {
                              Row(
                                  modifier = Modifier
                                      .fillMaxWidth()
                                      .clip(RoundedCornerShape(10.dp))
                                      .background(KhlBgDark)
                                      .padding(12.dp),
                                  horizontalArrangement = Arrangement.SpaceEvenly
                              ) {
                                  StatMiniBox("ИГРЫ", row.games.toString())
                                  StatMiniBox("ПОБЕДЫ", row.wins.toString())
                                  StatMiniBox("ШАЙБЫ", "${row.pucksScored}-${row.pucksMissed}")
                                  StatMiniBox("ОЧКИ", row.points.toString(), highlight = true)
                              }
                              if (row.tieBreakNote.isNotEmpty()) {
                                  Text(row.tieBreakNote, color = KhlTextGray, fontSize = 12.sp)
                              }
                          }
                      },
                      confirmButton = {
                          Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                              TextButton(onClick = {
                                  val cleanName = row.teamName
                                  selectedTeamRow = null
                                  selectedTeamFilter = cleanName
                                  bottomTab = 0
                              }) {
                                  Text("Матчи команды", color = KhlAccentRed, fontWeight = FontWeight.Bold)
                              }
                              TextButton(onClick = { selectedTeamRow = null }) {
                                  Text("Закрыть", color = KhlIceBlue)
                              }
                          }
                      }
                  )
              }

              // Протокол матча
              selectedMatch?.let { match ->
                  AlertDialog(
                      onDismissRequest = { selectedMatch = null },
                      containerColor = KhlCardDark,
                      title = { Text("${match.homeTeam} — ${match.awayTeam}", color = Color.White, fontSize = 15.sp, fontWeight = FontWeight.Bold) },
                      text = {
                          Column(verticalArrangement = Arrangement.spacedBy(6.dp)) {
                              Text("Счет: ${match.scoreText}", color = KhlIceBlue, fontSize = 20.sp, fontWeight = FontWeight.Black)
                              Text("${match.groupName} • ${match.tourName}", color = KhlAccentRed, fontSize = 13.sp, fontWeight = FontWeight.Bold)
                              Text("Дата и время: ${match.dateText}", color = Color.White, fontSize = 13.sp)
                          }
                      },
                      confirmButton = {
                          Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                              TextButton(onClick = {
                                  context.startActivity(Intent(Intent.ACTION_VIEW, Uri.parse(match.gameUrl)))
                              }) {
                                  Icon(Icons.Default.OpenInBrowser, contentDescription = null, tint = KhlAccentRed, modifier = Modifier.size(16.dp))
                                  Spacer(modifier = Modifier.width(4.dp))
                                  Text("Протокол на ФХМ", color = KhlAccentRed)
                              }
                              TextButton(onClick = { selectedMatch = null }) {
                                  Text("Закрыть", color = KhlIceBlue)
                              }
                          }
                      }
                  )
              }
          }

          @Composable
          fun StatMiniBox(label: String, value: String, highlight: Boolean = false) {
              Column(horizontalAlignment = Alignment.CenterHorizontally) {
                  Text(label, color = if (highlight) KhlAccentRed else KhlTextGray, fontSize = 10.sp, fontWeight = FontWeight.Bold)
                  Text(
                      text = value,
                      color = if (highlight) KhlIceBlue else Color.White,
                      fontSize = 16.sp,
                      fontWeight = FontWeight.Black
                  )
              }
          }

          @Composable
          fun KhlPlayersScreen(
              players: List<BestPlayerItem>,
              onPlayerClick: (BestPlayerItem) -> Unit
          ) {
              if (players.isEmpty()) {
                  Box(modifier = Modifier.fillMaxSize().padding(24.dp), contentAlignment = Alignment.Center) {
                      Text("В этой номинации пока нет данных.", color = KhlTextGray, fontSize = 14.sp)
                  }
                  return
              }

              LazyColumn(contentPadding = PaddingValues(12.dp), verticalArrangement = Arrangement.spacedBy(10.dp)) {
                  items(players) { p ->
                      Card(
                          colors = CardDefaults.cardColors(containerColor = KhlCardDark),
                          shape = RoundedCornerShape(14.dp),
                          modifier = Modifier.fillMaxWidth().clickable { onPlayerClick(p) }
                      ) {
                          Row(
                              modifier = Modifier.fillMaxWidth().padding(12.dp),
                              verticalAlignment = Alignment.CenterVertically,
                              horizontalArrangement = Arrangement.SpaceBetween
                          ) {
                              Row(
                                  modifier = Modifier.weight(1f),
                                  verticalAlignment = Alignment.CenterVertically
                              ) {
                                  Text(
                                      text = "${p.rank}",
                                      color = if (p.rank <= 3) KhlAccentRed else KhlTextGray,
                                      fontWeight = FontWeight.Black,
                                      fontSize = 15.sp,
                                      modifier = Modifier.width(24.dp)
                                  )
                                  AsyncImage(
                                      model = p.playerPhoto,
                                      contentDescription = p.fullName,
                                      contentScale = ContentScale.Crop,
                                      modifier = Modifier
                                          .size(42.dp)
                                          .clip(CircleShape)
                                          .background(Color.White.copy(alpha = 0.08f))
                                  )
                                  Spacer(modifier = Modifier.width(10.dp))
                                  Column(modifier = Modifier.weight(1f)) {
                                      Row(verticalAlignment = Alignment.CenterVertically) {
                                          Text(
                                              text = p.shortName,
                                              color = Color.White,
                                              fontWeight = FontWeight.Bold,
                                              fontSize = 14.sp,
                                              maxLines = 1,
                                              overflow = TextOverflow.Ellipsis
                                          )
                                          if (p.number.isNotEmpty()) {
                                              Spacer(modifier = Modifier.width(6.dp))
                                              Text(
                                                  text = "#${p.number}",
                                                  color = KhlIceBlue,
                                                  fontWeight = FontWeight.Black,
                                                  fontSize = 12.sp
                                              )
                                          }
                                      }
                                      Text(
                                          text = "${p.clubName} • ${p.roleName}",
                                          color = KhlTextGray,
                                          fontSize = 11.sp,
                                          maxLines = 1,
                                          overflow = TextOverflow.Ellipsis
                                      )
                                  }
                              }

                              // Колонки И | Г | П | ОЧКИ как в КХЛ
                              Row(
                                  horizontalArrangement = Arrangement.spacedBy(10.dp),
                                  verticalAlignment = Alignment.CenterVertically
                              ) {
                                  Column(horizontalAlignment = Alignment.CenterHorizontally) {
                                      Text("И", color = KhlTextGray, fontSize = 10.sp)
                                      Text("${p.games}", color = Color.White, fontSize = 13.sp, fontWeight = FontWeight.SemiBold)
                                  }
                                  Column(horizontalAlignment = Alignment.CenterHorizontally) {
                                      Text("Г", color = KhlTextGray, fontSize = 10.sp)
                                      Text("${p.goals}", color = Color.White, fontSize = 13.sp, fontWeight = FontWeight.SemiBold)
                                  }
                                  Column(horizontalAlignment = Alignment.CenterHorizontally) {
                                      Text("П", color = KhlTextGray, fontSize = 10.sp)
                                      Text("${p.assists}", color = Color.White, fontSize = 13.sp, fontWeight = FontWeight.SemiBold)
                                  }
                                  Box(
                                      modifier = Modifier
                                          .clip(RoundedCornerShape(8.dp))
                                          .background(KhlBgDark)
                                          .padding(horizontal = 10.dp, vertical = 4.dp),
                                      contentAlignment = Alignment.Center
                                  ) {
                                      Column(horizontalAlignment = Alignment.CenterHorizontally) {
                                          Text(p.mainStatLabel, color = KhlAccentRed, fontSize = 9.sp, fontWeight = FontWeight.Bold)
                                          Text(p.mainStatValue, color = KhlIceBlue, fontSize = 15.sp, fontWeight = FontWeight.Black)
                                      }
                                  }
                              }
                          }
                      }
                  }
              }
          }

          @Composable
          fun ClubsDirectoryScreen(
              clubs: List<StandingRow>,
              onSelectClubMatches: (String) -> Unit,
              onClubDetails: (StandingRow) -> Unit
          ) {
              LazyColumn(contentPadding = PaddingValues(12.dp), verticalArrangement = Arrangement.spacedBy(8.dp)) {
                  items(clubs) { club ->
                      Card(
                          colors = CardDefaults.cardColors(containerColor = KhlCardDark),
                          shape = RoundedCornerShape(12.dp),
                          modifier = Modifier.fillMaxWidth().clickable { onClubDetails(club) }
                      ) {
                          Row(
                              modifier = Modifier.fillMaxWidth().padding(12.dp),
                              verticalAlignment = Alignment.CenterVertically,
                              horizontalArrangement = Arrangement.SpaceBetween
                          ) {
                              Row(modifier = Modifier.weight(1f), verticalAlignment = Alignment.CenterVertically) {
                                  AsyncImage(
                                      model = club.logoUrl,
                                      contentDescription = club.teamName,
                                      contentScale = ContentScale.Fit,
                                      modifier = Modifier.size(38.dp).clip(CircleShape).background(Color.White.copy(alpha = 0.08f)).padding(4.dp)
                                  )
                                  Spacer(modifier = Modifier.width(10.dp))
                                  Column {
                                      Text(club.teamName, color = Color.White, fontWeight = FontWeight.Bold, fontSize = 14.sp)
                                      Text("${club.groupName} • Место: ${club.position} • Очки: ${club.points}", color = KhlTextGray, fontSize = 12.sp)
                                  }
                              }
                              TextButton(onClick = { onSelectClubMatches(club.teamName) }) {
                                  Text("Матчи ->", color = KhlIceBlue, fontSize = 12.sp, fontWeight = FontWeight.Bold)
                              }
                          }
                      }
                  }
              }
          }

          @Composable
          fun KhlStandingsScreen(group: StandingGroup?, onTeamClick: (StandingRow) -> Unit) {
              if (group == null || group.rows.isEmpty()) {
                  Box(modifier = Modifier.fillMaxSize().padding(24.dp), contentAlignment = Alignment.Center) {
                      Text("Таблица загружается...", color = KhlTextGray, fontSize = 14.sp)
                  }
                  return
              }

              LazyColumn(contentPadding = PaddingValues(12.dp), verticalArrangement = Arrangement.spacedBy(6.dp)) {
                  item {
                      Row(
                          modifier = Modifier.fillMaxWidth().background(KhlCardDark.copy(alpha = 0.6f), RoundedCornerShape(8.dp)).padding(horizontal = 10.dp, vertical = 8.dp),
                          verticalAlignment = Alignment.CenterVertically
                      ) {
                          Text("#", color = KhlTextGray, fontSize = 11.sp, fontWeight = FontWeight.Bold, modifier = Modifier.width(24.dp))
                          Text("КЛУБ (${group.groupName})", color = KhlTextGray, fontSize = 11.sp, fontWeight = FontWeight.Bold, modifier = Modifier.weight(1f))
                          Text("И", color = KhlTextGray, fontSize = 11.sp, fontWeight = FontWeight.Bold, modifier = Modifier.width(24.dp), textAlign = TextAlign.Center)
                          Text("В", color = KhlTextGray, fontSize = 11.sp, fontWeight = FontWeight.Bold, modifier = Modifier.width(24.dp), textAlign = TextAlign.Center)
                          Text("Н", color = KhlTextGray, fontSize = 11.sp, fontWeight = FontWeight.Bold, modifier = Modifier.width(22.dp), textAlign = TextAlign.Center)
                          Text("П", color = KhlTextGray, fontSize = 11.sp, fontWeight = FontWeight.Bold, modifier = Modifier.width(24.dp), textAlign = TextAlign.Center)
                          Text("ШАЙБЫ", color = KhlTextGray, fontSize = 11.sp, fontWeight = FontWeight.Bold, modifier = Modifier.width(56.dp), textAlign = TextAlign.Center)
                          Text("О", color = KhlIceBlue, fontSize = 12.sp, fontWeight = FontWeight.Black, modifier = Modifier.width(28.dp), textAlign = TextAlign.End)
                      }
                  }

                  items(group.rows) { row ->
                      Card(
                          colors = CardDefaults.cardColors(containerColor = KhlCardDark),
                          shape = RoundedCornerShape(10.dp),
                          modifier = Modifier.fillMaxWidth().clickable { onTeamClick(row) }
                      ) {
                          Row(
                              modifier = Modifier.fillMaxWidth().padding(horizontal = 10.dp, vertical = 10.dp),
                              verticalAlignment = Alignment.CenterVertically
                          ) {
                              Text(
                                  text = row.position.toString(),
                                  color = if (row.position <= 3) KhlAccentRed else KhlTextGray,
                                  fontWeight = FontWeight.Black,
                                  fontSize = 13.sp,
                                  modifier = Modifier.width(24.dp)
                              )
                              Row(modifier = Modifier.weight(1f), verticalAlignment = Alignment.CenterVertically) {
                                  AsyncImage(
                                      model = row.logoUrl,
                                      contentDescription = row.teamName,
                                      contentScale = ContentScale.Fit,
                                      modifier = Modifier.size(28.dp).clip(CircleShape).background(Color.White.copy(alpha = 0.08f)).padding(2.dp)
                                  )
                                  Spacer(modifier = Modifier.width(8.dp))
                                  Text(
                                      text = row.teamName.replace(" 2017", ""),
                                      color = Color.White,
                                      fontWeight = FontWeight.Bold,
                                      fontSize = 13.sp,
                                      maxLines = 1,
                                      overflow = TextOverflow.Ellipsis
                                  )
                              }
                              Text(row.games.toString(), color = KhlTextGray, fontSize = 12.sp, modifier = Modifier.width(24.dp), textAlign = TextAlign.Center)
                              Text(row.wins.toString(), color = KhlWinGreen, fontWeight = FontWeight.Bold, fontSize = 12.sp, modifier = Modifier.width(24.dp), textAlign = TextAlign.Center)
                              Text(row.ties.toString(), color = KhlTextGray, fontSize = 12.sp, modifier = Modifier.width(22.dp), textAlign = TextAlign.Center)
                              Text(row.losses.toString(), color = KhlTextGray, fontSize = 12.sp, modifier = Modifier.width(24.dp), textAlign = TextAlign.Center)
                              Text("${row.pucksScored}-${row.pucksMissed}", color = Color.White, fontSize = 11.sp, modifier = Modifier.width(56.dp), textAlign = TextAlign.Center)
                              Text(row.points.toString(), color = KhlIceBlue, fontWeight = FontWeight.Black, fontSize = 14.sp, modifier = Modifier.width(28.dp), textAlign = TextAlign.End)
                          }
                      }
                  }
              }
          }

          @Composable
          fun LiveMatchesScreen(
              matches: List<HockeyMatch>,
              canLoadMore: Boolean,
              isLoadingMore: Boolean,
              onLoadMore: () -> Unit,
              onMatchClick: (HockeyMatch) -> Unit
          ) {
              if (matches.isEmpty()) {
                  Box(modifier = Modifier.fillMaxSize().padding(24.dp), contentAlignment = Alignment.Center) {
                      Column(horizontalAlignment = Alignment.CenterHorizontally) {
                          Text("В загруженных турах матчей для этого фильтра нет.", color = KhlTextGray, fontSize = 14.sp, textAlign = TextAlign.Center)
                          if (canLoadMore) {
                              Spacer(modifier = Modifier.height(12.dp))
                              Button(
                                  onClick = onLoadMore,
                                  colors = ButtonDefaults.buttonColors(containerColor = KhlAccentRed)
                              ) {
                                  Text(if (isLoadingMore) "Загрузка..." else "Загрузить еще матчи (+24)")
                              }
                          }
                      }
                  }
                  return
              }

              LazyColumn(contentPadding = PaddingValues(12.dp), verticalArrangement = Arrangement.spacedBy(12.dp)) {
                  items(matches) { match ->
                      Card(
                          colors = CardDefaults.cardColors(containerColor = KhlCardDark),
                          shape = RoundedCornerShape(14.dp),
                          modifier = Modifier.fillMaxWidth().clickable { onMatchClick(match) }
                      ) {
                          Column(modifier = Modifier.padding(14.dp)) {
                              Row(modifier = Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceBetween) {
                                  Text("${match.groupName} • ${match.tourName}", color = KhlIceBlue, fontSize = 11.sp, fontWeight = FontWeight.Bold)
                                  Text(match.statusBadge, color = if (match.isFinished) KhlTextGray else KhlAccentRed, fontSize = 11.sp, fontWeight = FontWeight.Bold)
                              }
                              Spacer(modifier = Modifier.height(12.dp))
                              Row(modifier = Modifier.fillMaxWidth(), verticalAlignment = Alignment.CenterVertically, horizontalArrangement = Arrangement.SpaceBetween) {
                                  Row(modifier = Modifier.weight(1f), verticalAlignment = Alignment.CenterVertically) {
                                      AsyncImage(
                                          model = match.homeLogo,
                                          contentDescription = match.homeTeam,
                                          contentScale = ContentScale.Fit,
                                          modifier = Modifier.size(36.dp).clip(CircleShape).background(Color.White.copy(alpha = 0.08f)).padding(4.dp)
                                      )
                                      Spacer(modifier = Modifier.width(8.dp))
                                      Text(match.homeTeam, color = Color.White, fontSize = 13.sp, fontWeight = FontWeight.Bold, maxLines = 2, overflow = TextOverflow.Ellipsis)
                                  }
                                  Box(modifier = Modifier.padding(horizontal = 8.dp).clip(RoundedCornerShape(8.dp)).background(KhlBgDark).padding(horizontal = 12.dp, vertical = 6.dp)) {
                                      Text(match.scoreText, color = Color.White, fontSize = 18.sp, fontWeight = FontWeight.Black)
                                  }
                                  Row(modifier = Modifier.weight(1f), verticalAlignment = Alignment.CenterVertically, horizontalArrangement = Arrangement.End) {
                                      Text(match.awayTeam, color = Color.White, fontSize = 13.sp, fontWeight = FontWeight.Bold, textAlign = TextAlign.End, maxLines = 2, overflow = TextOverflow.Ellipsis, modifier = Modifier.weight(1f))
                                      Spacer(modifier = Modifier.width(8.dp))
                                      AsyncImage(
                                          model = match.awayLogo,
                                          contentDescription = match.awayTeam,
                                          contentScale = ContentScale.Fit,
                                          modifier = Modifier.size(36.dp).clip(CircleShape).background(Color.White.copy(alpha = 0.08f)).padding(4.dp)
                                      )
                                  }
                              }
                              Spacer(modifier = Modifier.height(10.dp))
                              Text(match.dateText, color = KhlTextGray, fontSize = 11.sp)
                          }
                      }
                  }

                  if (canLoadMore) {
                      item {
                          Button(
                              onClick = onLoadMore,
                              enabled = !isLoadingMore,
                              colors = ButtonDefaults.buttonColors(containerColor = KhlAccentRed),
                              modifier = Modifier.fillMaxWidth().padding(vertical = 8.dp)
                          ) {
                              Text(
                                  text = if (isLoadingMore) "Подгружаем туры..." else "Загрузить еще матчи (+24)",
                                  color = Color.White,
                                  fontWeight = FontWeight.Bold
                              )
                          }
                      }
                  }
              }
          }
          EOF

      - name: Build Debug APK
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon 2>&1 | tee build_output.log || {
            echo "### Ошибки компиляции Kotlin" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            { grep -E "e: |FAILURE|What went wrong" -A 8 build_output.log || tail -n 40 build_output.log; } >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          }

      - name: Rename APK to v4.0
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/fhm-khl-v40.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fhm-khl-v40
          path: app/build/outputs/apk/debug/fhm-khl-v40.apk
