name: Build FHM v3.1 APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download Gradle 8.7 directly
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle-8.7-bin.zip -d /tmp
          echo "/tmp/gradle-8.7/bin" >> $GITHUB_PATH

      - name: Generate v3.1 project
        run: |
          rm -rf app settings.gradle.kts build.gradle.kts gradle.properties
          mkdir -p app/src/main/java/com/fhm/khlstyle

          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "FHM_KHL_V31"
          include(":app")
          EOF

          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          EOF

          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.fhm.khlstyle"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.fhm.khlstyle"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 31
                  versionName = "3.1"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
              buildFeatures {
                  compose = true
              }
              composeOptions {
                  kotlinCompilerExtensionVersion = "1.5.14"
              }
          }

          dependencies {
              val composeBom = platform("androidx.compose:compose-bom:2024.06.00")
              implementation(composeBom)
              implementation("androidx.activity:activity-compose:1.9.0")
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-graphics")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-extended")
              implementation("org.jsoup:jsoup:1.17.2")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1")
              implementation("io.coil-kt:coil-compose:2.6.0")
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:allowBackup="false"
                  android:icon="@android:drawable/sym_def_app_icon"
                  android:label="ФХМ Матч-Центр"
                  android:supportsRtl="true"
                  android:usesCleartextTraffic="true"
                  android:theme="@android:style/Theme.Material.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/fhm/khlstyle/MainActivity.kt
          package com.fhm.khlstyle

          import android.annotation.SuppressLint
          import android.content.ClipData
          import android.content.ClipboardManager
          import android.content.Context
          import android.graphics.Bitmap
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import android.widget.Toast
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.foundation.background
          import androidx.compose.foundation.clickable
          import androidx.compose.foundation.horizontalScroll
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.LazyColumn
          import androidx.compose.foundation.lazy.items
          import androidx.compose.foundation.rememberScrollState
          import androidx.compose.foundation.shape.CircleShape
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.material.icons.Icons
          import androidx.compose.material.icons.filled.Code
          import androidx.compose.material.icons.filled.ContentCopy
          import androidx.compose.material.icons.filled.EmojiEvents
          import androidx.compose.material.icons.filled.FormatListNumbered
          import androidx.compose.material.icons.filled.Public
          import androidx.compose.material.icons.filled.Refresh
          import androidx.compose.material.icons.filled.SportsHockey
          import androidx.compose.material.icons.filled.SwapHoriz
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.draw.clip
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.layout.ContentScale
          import androidx.compose.ui.platform.LocalContext
          import androidx.compose.ui.text.font.FontFamily
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.text.style.TextAlign
          import androidx.compose.ui.text.style.TextOverflow
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import androidx.compose.ui.viewinterop.AndroidView
          import coil.compose.AsyncImage
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.launch
          import kotlinx.coroutines.suspendCancellableCoroutine
          import kotlinx.coroutines.withContext
          import kotlinx.coroutines.withTimeoutOrNull
          import org.json.JSONArray
          import org.json.JSONObject
          import org.json.JSONTokener
          import org.jsoup.Jsoup
          import org.jsoup.nodes.Document
          import kotlin.coroutines.resume

          data class HockeyMatch(
              val id: String,
              val homeTeam: String,
              val awayTeam: String,
              val homeLogo: String,
              val awayLogo: String,
              val scoreText: String,
              val dateText: String,
              val groupName: String,
              val tourName: String,
              val statusBadge: String,
              val isFinished: Boolean,
              val gameUrl: String
          )

          data class StandingRow(
              val position: Int,
              val teamId: Int,
              val teamName: String,
              val logoUrl: String,
              val games: Int,
              val wins: Int,
              val ties: Int,
              val losses: Int,
              val otWins: Int,
              val otLosses: Int,
              val pucksScored: Int,
              val pucksMissed: Int,
              val pucksDiff: Int,
              val points: Int,
              val tieBreakNote: String
          )

          data class StandingGroup(
              val groupName: String,
              val rows: List<StandingRow>
          )

          data class BestPlayerItem(
              val id: String,
              val rank: Int,
              val fullName: String,
              val shortName: String,
              val number: String,
              val roleName: String,
              val birthDate: String,
              val clubName: String,
              val clubLogo: String,
              val photoUrl: String,
              val categoryKey: String,
              val categoryTitle: String,
              val statSummary: String,
              val mainValue: String,
              val rawStatJson: String
          )

          data class TournamentPageData(
              val url: String,
              val tournamentTitle: String,
              val totalUpcomingCount: Int,
              val totalPastCount: Int,
              val upcomingMatches: List<HockeyMatch>,
              val pastMatches: List<HockeyMatch>,
              val standingGroups: List<StandingGroup>,
              val playersByCategory: Map<String, List<BestPlayerItem>>,
              val diagnosticReport: String
          )

          object FhmTournamentParser {

              suspend fun loadTournament(context: Context, tournamentId: String): TournamentPageData {
                  val targetUrl = "https://fhmoscow.com/tournament/$tournamentId?tournament-tab=2"
                  val webResult = fetchDirectApiBatchViaWebView(context, targetUrl, tournamentId)
                  val renderedHtml = webResult.first
                  val apiPayloads = webResult.second

                  val doc = if (renderedHtml.isNotEmpty()) Jsoup.parse(renderedHtml, targetUrl) else Document(targetUrl)
                  return buildTournamentData(doc, targetUrl, apiPayloads)
              }

              @SuppressLint("SetJavaScriptEnabled")
              private suspend fun fetchDirectApiBatchViaWebView(
                  context: Context,
                  url: String,
                  tournamentId: String
              ): Pair<String, List<Triple<String, String, String>>> {
                  return withContext(Dispatchers.Main) {
                      val result: Pair<String, List<Triple<String, String, String>>>? =
                          withTimeoutOrNull<Pair<String, List<Triple<String, String, String>>> >(25000L) {
                              suspendCancellableCoroutine<Pair<String, List<Triple<String, String, String>>>> { cont ->
                                  val webView = WebView(context)
                                  webView.layout(0, 0, 1080, 2400)
                                  webView.settings.javaScriptEnabled = true
                                  webView.settings.domStorageEnabled = true
                                  webView.settings.userAgentString =
                                      "Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Mobile Safari/537.36"

                                  var finished = false
                                  val mainHandler = Handler(Looper.getMainLooper())

                                  val hooksJs = "(function() {" +
                                      "window.__fhmPayloads = window.__fhmPayloads || [];" +
                                      "if (!window.__fhmHookedV31) {" +
                                      "  window.__fhmHookedV31 = true;" +
                                      "  var origFetch = window.fetch;" +
                                      "  if (origFetch) {" +
                                      "    window.fetch = function() {" +
                                      "      var u = arguments[0];" +
                                      "      var opts = arguments[1] || {};" +
                                      "      var reqB = (opts && opts.body) ? String(opts.body) : '';" +
                                      "      var uStr = (typeof u === 'string') ? u : (u && u.url ? u.url : 'fetch');" +
                                      "      return origFetch.apply(this, arguments).then(function(resp) {" +
                                      "        try { resp.clone().text().then(function(txt) { window.__fhmPayloads.push({ url: uStr, req: reqB, body: txt.substring(0, 95000) }); }); } catch(e) {}" +
                                      "        return resp;" +
                                      "      });" +
                                      "    };" +
                                      "  }" +
                                      "  var origOpen = XMLHttpRequest.prototype.open;" +
                                      "  XMLHttpRequest.prototype.open = function(m, u) { this._url = u; return origOpen.apply(this, arguments); };" +
                                      "  var origSend = XMLHttpRequest.prototype.send;" +
                                      "  XMLHttpRequest.prototype.send = function(data) {" +
                                      "    var self = this;" +
                                      "    var reqB = data ? String(data) : '';" +
                                      "    this.addEventListener('load', function() {" +
                                      "      try { window.__fhmPayloads.push({ url: (self._url || 'xhr'), req: reqB, body: (self.responseText || '').substring(0, 95000) }); } catch(e) {}" +
                                      "    });" +
                                      "    return origSend.apply(this, arguments);" +
                                      "  };" +
                                      "}" +
                                      "})();"

                                  // Выполняем прямые POST-запросы к открытому нами API fhmoscow.com прямо из контекста страницы:
                                  // 1) Все прошедшие матчи (limit: 100, period: "-")
                                  // 2) Все будущие матчи (limit: 100, period: "+")
                                  // 3) Все группы таблиц (из атрибутов data-standings-group)
                                  // 4) Все номинации лучших игроков (/api/playerStatistic/list с limit: 15)
                                  val directApiBatchJs = "(function() {" +
                                      "try {" +
                                      "  var tid = parseInt('$tournamentId', 10) || 54;" +
                                      "  var postJson = function(endpoint, payloadObj) {" +
                                      "    var bodyStr = JSON.stringify(payloadObj);" +
                                      "    fetch(endpoint, {" +
                                      "      method: 'POST'," +
                                      "      headers: { 'Content-Type': 'application/json', 'X-Requested-With': 'XMLHttpRequest' }," +
                                      "      body: bodyStr" +
                                      "    });" +
                                      "  };" +
                                      "  postJson('/api/game/list', { dateFrom: null, dateTo: null, limit: 100, offset: 0, hideTournament: null, period: '-', tournament: tid });" +
                                      "  postJson('/api/game/list', { dateFrom: null, dateTo: null, limit: 100, offset: 0, hideTournament: null, period: '+', tournament: tid });" +
                                      "  var groups = document.querySelectorAll('details.standings-group');" +
                                      "  for (var i = 0; i < groups.length; i++) {" +
                                      "    var gid = parseInt(groups[i].getAttribute('data-standings-group'), 10);" +
                                      "    if (gid) { postJson('/api/tournamentTable/list', { tournament: tid, group: gid }); }" +
                                      "  }" +
                                      "  postJson('/api/playerStatistic/list', { season: null, tournament: tid, group: null, limit: 15, nomination: 'bomber', role: null });" +
                                      "  postJson('/api/playerStatistic/list', { season: null, tournament: tid, group: null, limit: 15, nomination: 'sniper', role: null });" +
                                      "  postJson('/api/playerStatistic/list', { season: null, tournament: tid, group: null, limit: 15, nomination: 'bomber', role: 2 });" +
                                      "  postJson('/api/playerStatistic/list', { season: null, tournament: tid, group: null, limit: 15, nomination: 'sniper', role: 2 });" +
                                      "  postJson('/api/playerStatistic/list', { season: null, tournament: tid, group: null, limit: 15, nomination: 'assistant', role: null });" +
                                      "  postJson('/api/playerStatistic/list', { season: null, tournament: tid, group: null, limit: 15, nomination: 'penalty', role: null });" +
                                      "  postJson('/api/playerStatistic/list', { season: null, tournament: tid, group: null, limit: 15, nomination: 'goalkeeper', role: null });" +
                                      "} catch(e) {}" +
                                      "})();"

                                  val dumpJs = "(function() {" +
                                      "return JSON.stringify({" +
                                      "  html: document.documentElement.outerHTML," +
                                      "  payloads: window.__fhmPayloads || []" +
                                      "});" +
                                      "})();"

                                  webView.webViewClient = object : WebViewClient() {
                                      override fun onPageStarted(view: WebView?, loadedUrl: String?, favicon: Bitmap?) {
                                          super.onPageStarted(view, loadedUrl, favicon)
                                          view?.evaluateJavascript(hooksJs, null)
                                      }

                                      override fun onPageFinished(view: WebView?, loadedUrl: String?) {
                                          if (finished) return
                                          webView.evaluateJavascript(hooksJs, null)

                                          // Через 0.8 сек запускаем пакетный запрос ко всем API эндпоинтам ФХМ
                                          mainHandler.postDelayed({
                                              if (!finished && cont.isActive) {
                                                  webView.evaluateJavascript(directApiBatchJs, null)
                                              }
                                          }, 800L)

                                          // Через 3.8 сек забираем все ответы
                                          mainHandler.postDelayed({
                                              if (!finished && cont.isActive) {
                                                  finished = true
                                                  webView.evaluateJavascript(dumpJs) { rawJson ->
                                                      var htmlOut = ""
                                                      val payloadsList = mutableListOf<Triple<String, String, String>>()
                                                      try {
                                                          if (rawJson != null && rawJson != "null") {
                                                              val unquoted = JSONTokener(rawJson).nextValue()?.toString() ?: ""
                                                              val obj = JSONObject(unquoted)
                                                              htmlOut = obj.optString("html", "")
                                                              val arr = obj.optJSONArray("payloads") ?: JSONArray()
                                                              for (i in 0 until arr.length()) {
                                                                  val item = arr.optJSONObject(i)
                                                                  if (item != null) {
                                                                      payloadsList.add(
                                                                          Triple(
                                                                              item.optString("url", ""),
                                                                              item.optString("req", ""),
                                                                              item.optString("body", "")
                                                                          )
                                                                      )
                                                                  }
                                                              }
                                                          }
                                                      } catch (e: Exception) {
                                                          htmlOut = ""
                                                      }
                                                      webView.destroy()
                                                      if (cont.isActive) {
                                                          cont.resume(Pair(htmlOut, payloadsList))
                                                      }
                                                  }
                                              }
                                          }, 3800L)
                                      }
                                  }

                                  cont.invokeOnCancellation {
                                      mainHandler.removeCallbacksAndMessages(null)
                                      webView.stopLoading()
                                      webView.destroy()
                                  }

                                  webView.loadUrl(url)
                              }
                          }
                      result ?: Pair("", emptyList())
                  }
              }

              private fun buildTournamentData(
                  doc: Document,
                  url: String,
                  apiPayloads: List<Triple<String, String, String>>
              ): TournamentPageData {
                  val h1 = doc.select("h1, h2").firstOrNull()?.text()?.trim() ?: "Кубок г. Москвы"
                  val upcomingMatches = mutableListOf<HockeyMatch>()
                  val pastMatches = mutableListOf<HockeyMatch>()
                  var totalUpcoming = 0
                  var totalPast = 0

                  val groupNamesById = mutableMapOf<String, String>()
                  val detailsEls = doc.select("details.standings-group")
                  for (dEl in detailsEls) {
                      val gid = dEl.attr("data-standings-group")
                      val gName = dEl.select("summary span").firstOrNull()?.text()?.trim() ?: "Группа"
                      if (gid.isNotEmpty()) groupNamesById[gid] = gName
                  }

                  val parsedStandingGroups = mutableListOf<StandingGroup>()
                  val playersMap = linkedMapOf<String, MutableList<BestPlayerItem>>(
                      "Бомбардиры" to mutableListOf(),
                      "Снайперы" to mutableListOf(),
                      "Защитники-бомбардиры" to mutableListOf(),
                      "Защитники-снайперы" to mutableListOf(),
                      "Штрафники" to mutableListOf(),
                      "Ассистенты" to mutableListOf(),
                      "Вратари" to mutableListOf()
                  )

                  val samplePlayerStatJson = StringBuilder()

                  for (payload in apiPayloads) {
                      val apiUrl = payload.first
                      val reqBody = payload.second
                      val body = payload.third.trim()
                      if (!body.startsWith("{")) continue

                      try {
                          // 1. Матчи (/api/game/list)
                          if (apiUrl.contains("/api/game/list")) {
                              val json = JSONObject(body)
                              val count = json.optInt("count", 0)
                              val items = json.optJSONArray("items")
                              if (items != null) {
                                  for (i in 0 until items.length()) {
                                      val mObj = items.optJSONObject(i) ?: continue
                                      val match = parseGameJsonItem(mObj, i)
                                      if (match.isFinished) {
                                          if (count > totalPast) totalPast = count
                                          if (pastMatches.none { it.id == match.id }) pastMatches.add(match)
                                      } else {
                                          if (count > totalUpcoming) totalUpcoming = count
                                          if (upcomingMatches.none { it.id == match.id }) upcomingMatches.add(match)
                                      }
                                  }
                              }
                          }

                          // 2. Таблицы (/api/tournamentTable/list)
                          if (apiUrl.contains("/api/tournamentTable/list")) {
                              val json = JSONObject(body)
                              val items = json.optJSONArray("items")
                              if (items != null && items.length() > 0) {
                                  val rows = mutableListOf<StandingRow>()
                                  for (i in 0 until items.length()) {
                                      val rObj = items.optJSONObject(i) ?: continue
                                      rows.add(
                                          StandingRow(
                                              position = rObj.optInt("position", i + 1),
                                              teamId = rObj.optInt("teamId", 0),
                                              teamName = rObj.optString("team", "Команда"),
                                              logoUrl = rObj.optString("logo", ""),
                                              games = rObj.optInt("games", 0),
                                              wins = rObj.optInt("countWin", 0),
                                              ties = rObj.optInt("countTie", 0),
                                              losses = rObj.optInt("countLose", 0),
                                              otWins = rObj.optInt("countOvertimeWin", 0),
                                              otLosses = rObj.optInt("countOvertimeLose", 0),
                                              pucksScored = rObj.optInt("pucksScored", 0),
                                              pucksMissed = rObj.optInt("pucksMissed", 0),
                                              pucksDiff = rObj.optInt("pucksDifference", 0),
                                              points = rObj.optInt("score", 0),
                                              tieBreakNote = rObj.optString("tieBreakRuleLabel", "")
                                          )
                                      )
                                  }

                                  val matchedGroupTitle = detectGroupName(reqBody, rows.size, groupNamesById, parsedStandingGroups.size)
                                  val firstTeamId = rows.firstOrNull()?.teamId ?: 0
                                  if (parsedStandingGroups.none { it.rows.firstOrNull()?.teamId == firstTeamId }) {
                                      parsedStandingGroups.add(StandingGroup(groupName = matchedGroupTitle, rows = rows))
                                  }
                              }
                          }

                          // 3. Статистика игроков (/api/playerStatistic/list)
                          if (apiUrl.contains("/api/playerStatistic/list")) {
                              val json = JSONObject(body)
                              val items = json.optJSONArray("items")
                              if (items != null && items.length() > 0) {
                                  val reqJson = try { JSONObject(reqBody) } catch (e: Exception) { JSONObject() }
                                  val nom = reqJson.optString("nomination", "")
                                  val roleVal = if (reqJson.isNull("role")) 0 else reqJson.optInt("role", 0)

                                  val categoryTitle = when {
                                      nom == "bomber" && roleVal == 2 -> "Защитники-бомбардиры"
                                      nom == "sniper" && roleVal == 2 -> "Защитники-снайперы"
                                      nom == "bomber" -> "Бомбардиры"
                                      nom == "sniper" -> "Снайперы"
                                      nom == "penalty" -> "Штрафники"
                                      nom == "assistant" -> "Ассистенты"
                                      nom == "goalkeeper" -> "Вратари"
                                      else -> "Бомбардиры"
                                  }

                                  val targetList = playersMap.getOrPut(categoryTitle) { mutableListOf() }

                                  for (i in 0 until items.length()) {
                                      val pObj = items.optJSONObject(i) ?: continue
                                      if (samplePlayerStatJson.length < 2500) {
                                          samplePlayerStatJson.append("[").append(categoryTitle).append("]: ").append(pObj.toString()).append("\n\n")
                                      }
                                      val parsedPlayer = parsePlayerStatItem(pObj, i + 1, categoryTitle)
                                      if (targetList.none { it.id == parsedPlayer.id }) {
                                          targetList.add(parsedPlayer)
                                      }
                                  }
                              }
                          }
                      } catch (e: Exception) {
                          // ignore
                      }
                  }

                  parsedStandingGroups.sortBy {
                      when {
                          it.groupName.contains("Группа А") -> 1
                          it.groupName.contains("Группа Б") -> 2
                          it.groupName.contains("Группа В") -> 3
                          else -> 4
                      }
                  }

                  // Оставляем только непустые категории игроков
                  val nonEmptyPlayersMap = playersMap.filterValues { it.isNotEmpty() }

                  val report = buildString {
                      appendLine("=== ОТЧЕТ ПАРСЕРА v3.1 (FULL JSON API) ===")
                      appendLine("Турнир: $h1")
                      appendLine("Матчей загружено: ${pastMatches.size} прошедших (всего $totalPast), ${upcomingMatches.size} будущих (всего $totalUpcoming)")
                      appendLine("Групп таблицы: ${parsedStandingGroups.size}")
                      appendLine("Категорий игроков: ${nonEmptyPlayersMap.size}")
                      nonEmptyPlayersMap.forEach { (cat, list) ->
                          appendLine(" • $cat: ${list.size} чел. (Лидер: ${list.firstOrNull()?.shortName} — ${list.firstOrNull()?.mainValue})")
                      }
                      appendLine("\n=== ПОЛНЫЙ JSON ИГРОКОВ (/api/playerStatistic/list) ===")
                      appendLine(samplePlayerStatJson.toString())
                  }

                  return TournamentPageData(
                      url = url,
                      tournamentTitle = h1,
                      totalUpcomingCount = if (totalUpcoming > upcomingMatches.size) totalUpcoming else upcomingMatches.size,
                      totalPastCount = if (totalPast > pastMatches.size) totalPast else pastMatches.size,
                      upcomingMatches = upcomingMatches,
                      pastMatches = pastMatches,
                      standingGroups = parsedStandingGroups,
                      playersByCategory = nonEmptyPlayersMap,
                      diagnosticReport = report
                  )
              }

              private fun parsePlayerStatItem(
                  pObj: JSONObject,
                  rank: Int,
                  categoryTitle: String
              ): BestPlayerItem {
                  val id = pObj.optString("id", "p_$rank")
                  val surname = pObj.optString("surname", "")
                  val name = pObj.optString("name", "")
                  val patronymic = pObj.optString("patronymic", "")
                  val fullName = "$surname $name $patronymic".trim()
                  val shortName = "$surname $name".trim()

                  val number = if (!pObj.isNull("number")) pObj.optString("number", "") else ""
                  val roleName = pObj.optString("role", "")
                  val birthDate = pObj.optString("dateOfBirth", "")
                  val clubName = pObj.optString("clubName", "")
                  val clubLogo = pObj.optString("clubPhoto", "")
                  val photoUrl = if (!pObj.isNull("photo")) pObj.optString("photo", "") else ""

                  val statObj = pObj.optJSONObject("statistics")
                  var mainVal = ""
                  val summaryParts = mutableListOf<String>()

                  if (statObj != null) {
                      val keys = statObj.keys()
                      while (keys.hasNext()) {
                          val k = keys.next()
                          val v = statObj.opt(k)
                          if (v != null && v.toString() != "null" && k != "nomination") {
                              val label = when (k.lowercase()) {
                                  "games", "game", "countgames" -> "И"
                                  "goals", "goal", "pucks", "scored" -> "Г"
                                  "assists", "assist", "passes" -> "П"
                                  "points", "point", "score", "total", "value" -> "О"
                                  "penalty", "penaltyminutes", "pim" -> "Штр"
                                  else -> k
                              }
                              summaryParts.add("$label: $v")
                              if (k.equals("value", true) || k.equals("score", true) || k.equals("points", true) || k.equals("goals", true) || k.equals("penalty", true)) {
                                  mainVal = v.toString()
                              }
                          }
                      }
                      if (mainVal.isEmpty() && summaryParts.isNotEmpty()) {
                          mainVal = summaryParts.last().substringAfter(": ")
                      }
                  }

                  return BestPlayerItem(
                      id = id,
                      rank = rank,
                      fullName = fullName,
                      shortName = shortName,
                      number = number,
                      roleName = roleName,
                      birthDate = birthDate,
                      clubName = clubName,
                      clubLogo = clubLogo,
                      photoUrl = photoUrl.ifEmpty { clubLogo },
                      categoryKey = categoryTitle,
                      categoryTitle = categoryTitle,
                      statSummary = summaryParts.joinToString("  •  "),
                      mainValue = mainVal,
                      rawStatJson = statObj?.toString() ?: "{}"
                  )
              }

              private fun detectGroupName(
                  reqBody: String,
                  teamCount: Int,
                  groupNamesById: Map<String, String>,
                  currentIdx: Int
              ): String {
                  for (entry in groupNamesById.entries) {
                      if (reqBody.contains(entry.key)) return entry.value
                  }
                  return when (teamCount) {
                      12 -> "Группа А"
                      15 -> "Группа Б"
                      17 -> "Группа В"
                      else -> "Группа #${currentIdx + 1}"
                  }
              }

              private fun parseGameJsonItem(mObj: JSONObject, index: Int): HockeyMatch {
                  val id = mObj.optString("id", "idx_$index")
                  val dateStr = mObj.optString("displayDate", mObj.optString("date", ""))
                  val groupStr = mObj.optString("group", "")
                  val tourStr = mObj.optString("tour", "")
                  val statusInt = mObj.optInt("status", 0)
                  val isLive = mObj.optBoolean("isLive", false)
                  val overtime = mObj.optBoolean("overtime", false)
                  val shootout = mObj.optBoolean("shootout", false)
                  val gameUrl = mObj.optString("url", "/game/$id")

                  val t1 = mObj.optJSONObject("team1")
                  val t2 = mObj.optJSONObject("team2")

                  val homeTeam = t1?.optString("name", "Команда 1") ?: "Команда 1"
                  val awayTeam = t2?.optString("name", "Команда 2") ?: "Команда 2"
                  val homeLogo = t1?.optString("logo", "") ?: ""
                  val awayLogo = t2?.optString("logo", "") ?: ""

                  val s1 = if (t1 != null && !t1.isNull("score")) t1.opt("score").toString() else null
                  val s2 = if (t2 != null && !t2.isNull("score")) t2.opt("score").toString() else null

                  val suffix = when {
                      shootout -> " Б"
                      overtime -> " ОТ"
                      else -> ""
                  }

                  val scoreText = if (s1 != null && s2 != null) "$s1 : $s2$suffix" else "VS"
                  val statusBadge = when {
                      isLive -> "LIVE"
                      statusInt == 2 -> "ОКОНЧЕН"
                      else -> mObj.optString("date", "МАТЧ")
                  }

                  return HockeyMatch(
                      id = id,
                      homeTeam = homeTeam,
                      awayTeam = awayTeam,
                      homeLogo = homeLogo,
                      awayLogo = awayLogo,
                      scoreText = scoreText,
                      dateText = dateStr,
                      groupName = groupStr,
                      tourName = tourStr,
                      statusBadge = statusBadge,
                      isFinished = (statusInt == 2),
                      gameUrl = "https://fhmoscow.com$gameUrl"
                  )
              }
          }

