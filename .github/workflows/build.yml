name: Build FHM v2.4 APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download Gradle 8.7 directly
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle-8.7-bin.zip -d /tmp
          echo "/tmp/gradle-8.7/bin" >> $GITHUB_PATH

      - name: Generate v2.4 project
        run: |
          rm -rf app settings.gradle.kts build.gradle.kts gradle.properties
          mkdir -p app/src/main/java/com/fhm/khlstyle

          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "FHM_KHL_V24"
          include(":app")
          EOF

          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          EOF

          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.fhm.khlstyle"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.fhm.khlstyle"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 24
                  versionName = "2.4"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
              buildFeatures {
                  compose = true
              }
              composeOptions {
                  kotlinCompilerExtensionVersion = "1.5.14"
              }
          }

          dependencies {
              val composeBom = platform("androidx.compose:compose-bom:2024.06.00")
              implementation(composeBom)
              implementation("androidx.activity:activity-compose:1.9.0")
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-graphics")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-extended")
              implementation("org.jsoup:jsoup:1.17.2")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1")
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:allowBackup="false"
                  android:icon="@android:drawable/sym_def_app_icon"
                  android:label="ФХМ 54 (v2.4)"
                  android:supportsRtl="true"
                  android:usesCleartextTraffic="true"
                  android:theme="@android:style/Theme.Material.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/fhm/khlstyle/MainActivity.kt
          package com.fhm.khlstyle

          import android.annotation.SuppressLint
          import android.content.ClipData
          import android.content.ClipboardManager
          import android.content.Context
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.webkit.WebResourceRequest
          import android.webkit.WebResourceResponse
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import android.widget.Toast
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.foundation.background
          import androidx.compose.foundation.clickable
          import androidx.compose.foundation.horizontalScroll
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.LazyColumn
          import androidx.compose.foundation.lazy.items
          import androidx.compose.foundation.rememberScrollState
          import androidx.compose.foundation.shape.CircleShape
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.material.icons.Icons
          import androidx.compose.material.icons.filled.Code
          import androidx.compose.material.icons.filled.ContentCopy
          import androidx.compose.material.icons.filled.EmojiEvents
          import androidx.compose.material.icons.filled.FormatListNumbered
          import androidx.compose.material.icons.filled.Public
          import androidx.compose.material.icons.filled.Refresh
          import androidx.compose.material.icons.filled.SportsHockey
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.draw.clip
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.platform.LocalContext
          import androidx.compose.ui.text.font.FontFamily
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.text.style.TextAlign
          import androidx.compose.ui.text.style.TextOverflow
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import androidx.compose.ui.viewinterop.AndroidView
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.launch
          import kotlinx.coroutines.suspendCancellableCoroutine
          import kotlinx.coroutines.withContext
          import kotlinx.coroutines.withTimeoutOrNull
          import org.json.JSONObject
          import org.json.JSONTokener
          import org.jsoup.Jsoup
          import org.jsoup.nodes.Document
          import java.util.Collections
          import kotlin.coroutines.resume

          data class HockeyMatch(
              val id: String,
              val homeTeam: String,
              val awayTeam: String,
              val scoreText: String,
              val infoLine: String,
              val status: String,
              val rawDetails: String
          )

          data class ParsedTable(
              val title: String,
              val subtitle: String,
              val headers: List<String>,
              val rows: List<List<String>>
          )

          data class TournamentPageData(
              val url: String,
              val tournamentTitle: String,
              val matches: List<HockeyMatch>,
              val tables: List<ParsedTable>,
              val playerRows: List<List<String>>,
              val diagnosticReport: String
          )

          object FhmTournamentParser {
              private val SCORE_REGEX = Regex("([0-9]+)\\s*[:\\-]\\s*([0-9]+)")

              suspend fun loadTournament(
                  context: Context,
                  tournamentId: String,
                  actionMode: Int // 0 = Матчи, 1 = Таблица, 2 = Лучшие игроки
              ): TournamentPageData {
                  // На сайте ФХМ: data-tab="1" (Матчи), data-tab="2" (Таблица), data-tab="4" (Лучшие игроки)
                  val tabParam = when (actionMode) {
                      0 -> 1
                      1 -> 2
                      else -> 4
                  }
                  val targetUrl = "https://fhmoscow.com/tournament/$tournamentId?tournament-tab=$tabParam"

                  val pairResult = fetchInteractiveDomViaWebView(context, targetUrl, actionMode)
                  val renderedHtml = pairResult.first
                  val networkUrls = pairResult.second

                  if (renderedHtml.isEmpty()) {
                      return TournamentPageData(
                          url = targetUrl,
                          tournamentTitle = "Ошибка загрузки fhmoscow.com",
                          matches = emptyList(),
                          tables = emptyList(),
                          playerRows = emptyList(),
                          diagnosticReport = "Таймаут ожидания DOM страницы $targetUrl\nПерехваченные запросы:\n$networkUrls"
                      )
                  }

                  val doc = Jsoup.parse(renderedHtml, targetUrl)
                  return parseFhmSpaDocument(doc, targetUrl, actionMode, networkUrls)
              }

              @SuppressLint("SetJavaScriptEnabled")
              private suspend fun fetchInteractiveDomViaWebView(
                  context: Context,
                  url: String,
                  actionMode: Int
              ): Pair<String, String> {
                  return withContext(Dispatchers.Main) {
                      val interceptedUrls = Collections.synchronizedList(mutableListOf<String>())

                      val result: Pair<String, String>? = withTimeoutOrNull<Pair<String, String>>(28000L) {
                          suspendCancellableCoroutine<Pair<String, String>> { cont ->
                              val webView = WebView(context)
                              webView.layout(0, 0, 1080, 2400)
                              webView.settings.javaScriptEnabled = true
                              webView.settings.domStorageEnabled = true
                              webView.settings.userAgentString =
                                  "Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Mobile Safari/537.36"

                              var finished = false
                              var pageReadyTriggered = false
                              val mainHandler = Handler(Looper.getMainLooper())

                              // Скрипт, который кликает по нужным элементам ФХМ и заставляет модули отрендерить контент
                              val triggerJs = "(function() {" +
                                  "try {" +
                                  "  var consentBtns = document.querySelectorAll('.consent-button, [data-consent-accept]');" +
                                  "  if (consentBtns.length > 0) { consentBtns[0].click(); }" +
                                  "  var mode = " + actionMode + ";" +
                                  "  var targetTab = (mode === 0) ? '1' : ((mode === 1) ? '2' : '4');" +
                                  "  var tabBtn = document.querySelector('.tournament-tab[data-tab=\"' + targetTab + '\"]') || document.querySelectorAll('.tournament-tab')[mode];" +
                                  "  if (tabBtn) { tabBtn.click(); }" +
                                  "  if (mode === 0) {" +
                                  "    var mTab2 = document.querySelector('#tournament-match-tab-2, .match-tab[data-tab=\"2\"]');" +
                                  "    if (mTab2) { mTab2.click(); }" +
                                  "    var blueBtns = document.querySelectorAll('.people-scroll__page button, .button-blue');" +
                                  "    for (var b = 0; b < blueBtns.length; b++) { blueBtns[b].click(); }" +
                                  "    window.scrollTo(0, 800);" +
                                  "  }" +
                                  "  var summaries = document.querySelectorAll('details.standings-group > summary');" +
                                  "  for (var i = 0; i < summaries.length; i++) {" +
                                  "    var det = summaries[i].parentElement;" +
                                  "    if (det && !det.hasAttribute('open')) {" +
                                  "      summaries[i].click();" +
                                  "      det.setAttribute('open', 'true');" +
                                  "      det.dispatchEvent(new Event('toggle'));" +
                                  "    } else if (det) {" +
                                  "      det.dispatchEvent(new Event('toggle'));" +
                                  "    }" +
                                  "  }" +
                                  "  if (mode === 2) {" +
                                  "    var sel = document.querySelector('[data-group-select]');" +
                                  "    if (sel && sel.options.length > 1) {" +
                                  "      sel.value = sel.options[1].value;" +
                                  "      sel.dispatchEvent(new Event('change', { bubbles: true }));" +
                                  "    }" +
                                  "  }" +
                                  "} catch(e) {}" +
                                  "})();"

                              val checkAndDumpJs = "(function() {" +
                                  "var stContent = document.querySelectorAll('[data-standings-content]');" +
                                  "var filledGroups = 0;" +
                                  "var totalStLen = 0;" +
                                  "for (var i = 0; i < stContent.length; i++) {" +
                                  "  var h = stContent[i].innerHTML.trim();" +
                                  "  totalStLen += h.length;" +
                                  "  if (h.length > 30) filledGroups++;" +
                                  "}" +
                                  "var matchPages = document.querySelectorAll('.people-scroll__page');" +
                                  "var matchHtmlLen = 0;" +
                                  "for (var j = 0; j < matchPages.length; j++) {" +
                                  "  matchHtmlLen += matchPages[j].innerHTML.length;" +
                                  "}" +
                                  "var bestBlock = document.querySelector('[data-render-module=\"best-players-block\"]');" +
                                  "var bestLen = bestBlock ? bestBlock.innerHTML.length : 0;" +
                                  "var blueBtns = document.querySelectorAll('.people-scroll__page button.button-blue');" +
                                  "for (var b = 0; b < blueBtns.length; b++) { try { blueBtns[b].click(); } catch(e) {} }" +
                                  "return JSON.stringify({" +
                                  "  filledGroups: filledGroups," +
                                  "  totalStLen: totalStLen," +
                                  "  matchHtmlLen: matchHtmlLen," +
                                  "  bestLen: bestLen," +
                                  "  html: document.documentElement.outerHTML" +
                                  "});" +
                                  "})();"

                              fun pollDom(attempt: Int) {
                                  if (finished || !cont.isActive) return
                                  webView.evaluateJavascript(checkAndDumpJs) { rawJson ->
                                      if (finished || !cont.isActive) return@evaluateJavascript
                                      var htmlOut = ""
                                      var filledGroups = 0
                                      var totalStLen = 0
                                      var matchHtmlLen = 0
                                      try {
                                          if (rawJson != null && rawJson != "null") {
                                              val unquoted = JSONTokener(rawJson).nextValue()?.toString() ?: ""
                                              val obj = JSONObject(unquoted)
                                              filledGroups = obj.optInt("filledGroups", 0)
                                              totalStLen = obj.optInt("totalStLen", 0)
                                              matchHtmlLen = obj.optInt("matchHtmlLen", 0)
                                              htmlOut = obj.optString("html", "")
                                          }
                                      } catch (e: Exception) {
                                          htmlOut = ""
                                      }

                                      val enoughData = (actionMode == 1 && totalStLen > 100) ||
                                          (actionMode == 0 && matchHtmlLen > 400) ||
                                          (attempt >= 8)

                                      if (enoughData && htmlOut.isNotEmpty()) {
                                          finished = true
                                          webView.destroy()
                                          val netLog = synchronized(interceptedUrls) {
                                              interceptedUrls.joinToString("\n")
                                          }
                                          cont.resume(Pair(htmlOut, netLog))
                                      } else {
                                          // Повторяем триггер и проверяем снова через 1.2 секунды
                                          webView.evaluateJavascript(triggerJs, null)
                                          mainHandler.postDelayed({ pollDom(attempt + 1) }, 1200L)
                                      }
                                  }
                              }

                              webView.webViewClient = object : WebViewClient() {
                                  override fun shouldInterceptRequest(
                                      view: WebView?,
                                      request: WebResourceRequest?
                                  ): WebResourceResponse? {
                                      val reqUrl = request?.url?.toString() ?: ""
                                      if (reqUrl.isNotEmpty() &&
                                          !reqUrl.endsWith(".png") &&
                                          !reqUrl.endsWith(".svg") &&
                                          !reqUrl.endsWith(".woff2") &&
                                          !reqUrl.endsWith(".css")
                                      ) {
                                          synchronized(interceptedUrls) {
                                              val entry = "${request?.method ?: "GET"} $reqUrl"
                                              if (!interceptedUrls.contains(entry) && interceptedUrls.size < 60) {
                                                  interceptedUrls.add(entry)
                                              }
                                          }
                                      }
                                      return super.shouldInterceptRequest(view, request)
                                  }

                                  override fun onPageFinished(view: WebView?, loadedUrl: String?) {
                                      if (pageReadyTriggered || finished) return
                                      pageReadyTriggered = true

                                      mainHandler.postDelayed({
                                          if (!finished && cont.isActive) {
                                              webView.evaluateJavascript(triggerJs, null)
                                              mainHandler.postDelayed({ pollDom(1) }, 1500L)
                                          }
                                      }, 1200L)
                                  }
                              }

                              cont.invokeOnCancellation {
                                  mainHandler.removeCallbacksAndMessages(null)
                                  webView.stopLoading()
                                  webView.destroy()
                              }

                              webView.loadUrl(url)
                          }
                      }
                      val netLog = synchronized(interceptedUrls) { interceptedUrls.joinToString("\n") }
                      result ?: Pair("", netLog)
                  }
              }

              private fun parseFhmSpaDocument(
                  doc: Document,
                  url: String,
                  actionMode: Int,
                  networkUrls: String
              ): TournamentPageData {
                  val h1 = doc.select("h1, h2").firstOrNull()?.text()?.trim() ?: "Кубок г. Москвы"
                  val parsedTables = mutableListOf<ParsedTable>()
                  val extractedMatches = mutableListOf<HockeyMatch>()
                  val extractedPlayers = mutableListOf<List<String>>()

                  // 1. Разбираем details.standings-group и внутренний [data-standings-content]
                  val standingGroups = doc.select("details.standings-group")
                  for (gIdx in 0 until standingGroups.size) {
                      val groupEl = standingGroups[gIdx]
                      val groupId = groupEl.attr("data-standings-group")
                      val summarySpans = groupEl.select("summary span").map { it.text().trim() }.filter { it.isNotEmpty() }
                      val groupTitle = summarySpans.getOrNull(0) ?: "Группа #${gIdx + 1}"
                      val groupCount = summarySpans.getOrNull(1) ?: "ID: $groupId"

                      val contentEl = groupEl.selectFirst("[data-standings-content]")
                      val rows = mutableListOf<List<String>>()
                      var headers = listOf("#", "Команда", "И", "В", "П", "Ш", "О")

                      if (contentEl != null) {
                          val ths = contentEl.select("th").map { it.text().trim() }.filter { it.isNotEmpty() }
                          if (ths.isNotEmpty()) headers = ths

                          val trs = contentEl.select("tr, [class*=row], [class*=item]")
                          for (tr in trs) {
                              val cells = tr.select("td, [class*=cell], [class*=col], span, a")
                                  .filter { it.childrenSize() == 0 && it.text().trim().isNotEmpty() }
                                  .map { it.text().trim() }
                              if (cells.size >= 2) {
                                  rows.add(cells)
                              }
                          }

                          if (rows.isEmpty() && contentEl.text().trim().isNotEmpty()) {
                              rows.add(listOf(contentEl.text().trim().take(200)))
                          }
                      }

                      if (rows.isEmpty()) {
                          rows.add(listOf("Контейнер data-standings-content пуст (group=$groupId). Проверь вкладку Веб / DOM."))
                      }

                      parsedTables.add(
                          ParsedTable(
                              title = "$groupTitle (ID $groupId)",
                              subtitle = groupCount,
                              headers = headers,
                              rows = rows
                          )
                      )
                  }

                  // 2. Разбираем карточки матчей внутри .match-wrapper / .people-scroll__page
                  val matchPages = doc.select(".match-wrapper, .people-scroll__page")
                  for (mp in matchPages) {
                      val cards = mp.select("[class*=match], [class*=card], [class*=item], a[href*=match], tr")
                      for (cEl in cards) {
                          val fullText = cEl.text().trim()
                          if (fullText.length in 12..220 && !fullText.contains("Показать записи") && !fullText.contains("Загрузить записи")) {
                              val scoreMatch = SCORE_REGEX.find(fullText)
                              val leafTexts = cEl.select("span, div, p, strong, b, a")
                                  .filter { it.childrenSize() == 0 && it.text().trim().isNotEmpty() }
                                  .map { it.text().trim() }
                                  .distinct()

                              val teams = leafTexts.filter { it.length in 3..40 && !it.all { ch -> ch.isDigit() } }
                              if (teams.size >= 2) {
                                  val score = scoreMatch?.value ?: "МАТЧ"
                                  val home = teams[0]
                                  val away = teams[1]
                                  if (extractedMatches.none { it.homeTeam == home && it.awayTeam == away && it.rawDetails == fullText }) {
                                      extractedMatches.add(
                                          HockeyMatch(
                                              id = "m_${extractedMatches.size}",
                                              homeTeam = home,
                                              awayTeam = away,
                                              scoreText = score,
                                              infoLine = leafTexts.firstOrNull() ?: h1,
                                              status = if (scoreMatch != null) "СЧЕТ" else "КАЛЕНДАРЬ",
                                              rawDetails = leafTexts.joinToString(" | ")
                                          )
                                      )
                                  }
                              }
                          }
                      }
                  }

                  // 3. Разбираем лучших игроков в [data-render-module="best-players-block"]
                  val bestBlock = doc.selectFirst("[data-render-module=best-players-block]")
                  if (bestBlock != null) {
                      val playerItems = bestBlock.select("tr, [class*=player], [class*=row], [class*=card], [class*=item]")
                      for (pEl in playerItems) {
                          val pTexts = pEl.select("td, span, div, a")
                              .filter { it.childrenSize() == 0 && it.text().trim().isNotEmpty() }
                              .map { it.text().trim() }
                          if (pTexts.size >= 3 && !pTexts.joinToString(" ").contains("Сбросить")) {
                              extractedPlayers.add(pTexts)
                          }
                      }
                  }

                  // 4. Формируем отчет с перехваченными сетевыми URL и содержимым контейнеров
                  val wrapperBuilder = StringBuilder()
                  val wrappers = doc.select(".tournament-wrapper")
                  for (idx in 0 until wrappers.size) {
                      val el = wrappers[idx]
                      wrapperBuilder.append("--- WRAPPER #").append(idx)
                          .append(" (data-render-module=").append(el.attr("data-render-module")).append(") ---\n")
                      wrapperBuilder.append(el.outerHtml().take(3000)).append("\n\n")
                  }

                  val report = buildString {
                      appendLine("=== ОТЧЕТ ПАРСЕРА v2.4 (NETWORK INTERCEPTOR) ===")
                      appendLine("URL: $url (Режим: $actionMode)")
                      appendLine("Турнир: $h1")
                      appendLine("Всего DOM-элементов: ${doc.allElements.size}")
                      appendLine("Найдено групп standings-group: ${standingGroups.size}")
                      appendLine("Найдено матчей: ${extractedMatches.size}")
                      appendLine("Найдено игроков: ${extractedPlayers.size}")
                      appendLine("\n=== ВСЕ СЕТЕВЫЕ ЗАПРОСЫ СТРАНИЦЫ (WebView Interceptor) ===")
                      appendLine(if (networkUrls.isNotEmpty()) networkUrls else "Сетевые запросы не зафиксированы")
                      appendLine("\n=== ИСХОДНЫЙ HTML ВНУТРИ .tournament-wrapper ===")
                      appendLine(wrapperBuilder.toString())
                  }

                  return TournamentPageData(
                      url = url,
                      tournamentTitle = h1,
                      matches = extractedMatches,
                      tables = parsedTables,
                      playerRows = extractedPlayers,
                      diagnosticReport = report
                  )
              }
          }

          val KhlBgDark = Color(0xFF0B101B)
          val KhlCardDark = Color(0xFF161F30)
          val KhlAccentRed = Color(0xFFE30613)
          val KhlIceBlue = Color(0xFF00A8E8)
          val KhlTextGray = Color(0xFF8F9BB3)

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContent {
                      MaterialTheme(
                          colorScheme = darkColorScheme(
                              background = KhlBgDark,
                              surface = KhlCardDark,
                              primary = KhlAccentRed,
                              secondary = KhlIceBlue
                          )
                      ) {
                          FhmKhlAppV24()
                      }
                  }
              }
          }

          @Composable
          fun FhmKhlAppV24() {
              val context = LocalContext.current
              val scope = rememberCoroutineScope()

              var bottomTab by remember { mutableIntStateOf(1) }
              var tournamentId by remember { mutableStateOf("54") }
              var actionMode by remember { mutableIntStateOf(1) }

              var pageData by remember { mutableStateOf<TournamentPageData?>(null) }
              var isLoading by remember { mutableStateOf(true) }
              var selectedMatch by remember { mutableStateOf<HockeyMatch?>(null) }

              fun reload() {
                  scope.launch {
                      isLoading = true
                      pageData = FhmTournamentParser.loadTournament(context, tournamentId, actionMode)
                      isLoading = false
                  }
              }

              LaunchedEffect(tournamentId, actionMode) {
                  reload()
              }

              Scaffold(
                  containerColor = KhlBgDark,
                  topBar = {
                      Column(
                          modifier = Modifier
                              .fillMaxWidth()
                              .background(KhlCardDark)
                              .padding(top = 10.dp, bottom = 8.dp)
                      ) {
                          Row(
                              modifier = Modifier
                                  .fillMaxWidth()
                                  .padding(horizontal = 14.dp),
                              horizontalArrangement = Arrangement.SpaceBetween,
                              verticalAlignment = Alignment.CenterVertically
                          ) {
                              Column(modifier = Modifier.weight(1f)) {
                                  Row(verticalAlignment = Alignment.CenterVertically) {
                                      Box(modifier = Modifier.size(9.dp).clip(CircleShape).background(KhlAccentRed))
                                      Spacer(modifier = Modifier.width(8.dp))
                                      Text(
                                          text = "ФХМ v2.4 • ТУРНИР #$tournamentId",
                                          color = KhlIceBlue,
                                          fontSize = 12.sp,
                                          fontWeight = FontWeight.Bold
                                      )
                                  }
                                  Text(
                                      text = pageData?.tournamentTitle ?: "Загрузка...",
                                      color = Color.White,
                                      fontSize = 14.sp,
                                      fontWeight = FontWeight.Black,
                                      maxLines = 1,
                                      overflow = TextOverflow.Ellipsis
                                  )
                              }
                              IconButton(onClick = { reload() }) {
                                  Icon(Icons.Default.Refresh, contentDescription = "Обновить", tint = Color.White)
                              }
                          }

                          Row(
                              modifier = Modifier
                                  .fillMaxWidth()
                                  .horizontalScroll(rememberScrollState())
                                  .padding(horizontal = 12.dp, vertical = 6.dp),
                              horizontalArrangement = Arrangement.spacedBy(8.dp)
                          ) {
                              val modes = listOf(
                                  0 to "Матчи (209 / 67)",
                                  1 to "Таблица (Группы А, Б, В)",
                                  2 to "Лучшие игроки"
                              )
                              modes.forEach { pair ->
                                  val idx = pair.first
                                  val label = pair.second
                                  val active = actionMode == idx
                                  Box(
                                      modifier = Modifier
                                          .clip(RoundedCornerShape(16.dp))
                                          .background(if (active) KhlAccentRed else KhlBgDark)
                                          .clickable {
                                              actionMode = idx
                                              if (idx in 0..2 && bottomTab != 3) bottomTab = idx
                                          }
                                          .padding(horizontal = 12.dp, vertical = 6.dp)
                                  ) {
                                      Text(
                                          text = label,
                                          color = if (active) Color.White else KhlTextGray,
                                          fontSize = 12.sp,
                                          fontWeight = FontWeight.Bold
                                      )
                                  }
                              }
                          }
                      }
                  },
                  bottomBar = {
                      NavigationBar(containerColor = KhlCardDark) {
                          NavigationBarItem(
                              selected = bottomTab == 0,
                              onClick = { bottomTab = 0 },
                              icon = { Icon(Icons.Default.SportsHockey, null) },
                              label = { Text("Матчи (${pageData?.matches?.size ?: 0})") }
                          )
                          NavigationBarItem(
                              selected = bottomTab == 1,
                              onClick = { bottomTab = 1 },
                              icon = { Icon(Icons.Default.FormatListNumbered, null) },
                              label = { Text("Группы (${pageData?.tables?.size ?: 0})") }
                          )
                          NavigationBarItem(
                              selected = bottomTab == 2,
                              onClick = { bottomTab = 2 },
                              icon = { Icon(Icons.Default.EmojiEvents, null) },
                              label = { Text("Игроки (${pageData?.playerRows?.size ?: 0})") }
                          )
                          NavigationBarItem(
                              selected = bottomTab == 3,
                              onClick = { bottomTab = 3 },
                              icon = { Icon(Icons.Default.Code, null) },
                              label = { Text("Веб / DOM") }
                          )
                      }
                  }
              ) { innerPadding ->
                  Box(
                      modifier = Modifier
                          .fillMaxSize()
                          .padding(innerPadding)
                  ) {
                      if (isLoading) {
                          Column(
                              modifier = Modifier.align(Alignment.Center),
                              horizontalAlignment = Alignment.CenterHorizontally
                          ) {
                              CircularProgressIndicator(color = KhlAccentRed)
                              Spacer(modifier = Modifier.height(12.dp))
                              Text(
                                  text = "Ожидание ответа модулей ФХМ (Группа А=318, Б=321, В=324)...",
                                  color = KhlTextGray,
                                  fontSize = 12.sp,
                                  textAlign = TextAlign.Center,
                                  modifier = Modifier.padding(horizontal = 24.dp)
                              )
                          }
                      } else {
                          val data = pageData
                          if (data != null) {
                              when (bottomTab) {
                                  0 -> LiveMatchesScreen(data, onMatchClick = { selectedMatch = it })
                                  1 -> LiveTablesScreen(data)
                                  2 -> LivePlayersScreen(data)
                                  3 -> WebAndDomScreen(data)
                              }
                          }
                      }
                  }
              }

              selectedMatch?.let { match ->
                  AlertDialog(
                      onDismissRequest = { selectedMatch = null },
                      containerColor = KhlCardDark,
                      title = {
                          Text("${match.homeTeam} — ${match.awayTeam}", color = Color.White, fontSize = 16.sp, fontWeight = FontWeight.Bold)
                      },
                      text = {
                          Column(verticalArrangement = Arrangement.spacedBy(8.dp)) {
                              Text("Счет: ${match.scoreText}", color = KhlIceBlue, fontSize = 14.sp, fontWeight = FontWeight.Bold)
                              Text(match.rawDetails, color = Color.White, fontSize = 13.sp)
                          }
                      },
                      confirmButton = {
                          TextButton(onClick = { selectedMatch = null }) {
                              Text("Закрыть", color = KhlIceBlue)
                          }
                      }
                  )
              }
          }

          @Composable
          fun LiveMatchesScreen(data: TournamentPageData, onMatchClick: (HockeyMatch) -> Unit) {
              if (data.matches.isEmpty()) {
                  Box(modifier = Modifier.fillMaxSize().padding(24.dp), contentAlignment = Alignment.Center) {
                      Text(
                          text = "Нажми сверху кнопку «Матчи (209 / 67)», чтобы загрузить карточки матчей, либо проверь вкладку «Веб / DOM».",
                          color = KhlTextGray,
                          fontSize = 14.sp,
                          textAlign = TextAlign.Center
                      )
                  }
                  return
              }

              LazyColumn(contentPadding = PaddingValues(12.dp), verticalArrangement = Arrangement.spacedBy(10.dp)) {
                  items(data.matches) { match ->
                      Card(
                          colors = CardDefaults.cardColors(containerColor = KhlCardDark),
                          shape = RoundedCornerShape(14.dp),
                          modifier = Modifier.fillMaxWidth().clickable { onMatchClick(match) }
                      ) {
                          Column(modifier = Modifier.padding(16.dp)) {
                              Row(modifier = Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceBetween) {
                                  Text(match.infoLine, color = KhlTextGray, fontSize = 11.sp, maxLines = 1, overflow = TextOverflow.Ellipsis, modifier = Modifier.weight(1f))
                                  Text(match.status, color = KhlIceBlue, fontSize = 11.sp, fontWeight = FontWeight.Bold)
                              }
                              Spacer(modifier = Modifier.height(10.dp))
                              Row(
                                  modifier = Modifier.fillMaxWidth(),
                                  verticalAlignment = Alignment.CenterVertically,
                                  horizontalArrangement = Arrangement.SpaceBetween
                              ) {
                                  Text(match.homeTeam, color = Color.White, fontSize = 14.sp, fontWeight = FontWeight.Bold, modifier = Modifier.weight(1f))
                                  Box(
                                      modifier = Modifier
                                          .clip(RoundedCornerShape(8.dp))
                                          .background(KhlBgDark)
                                          .padding(horizontal = 12.dp, vertical = 6.dp)
                                  ) {
                                      Text(match.scoreText, color = Color.White, fontSize = 18.sp, fontWeight = FontWeight.Black)
                                  }
                                  Text(match.awayTeam, color = Color.White, fontSize = 14.sp, fontWeight = FontWeight.Bold, textAlign = TextAlign.End, modifier = Modifier.weight(1f))
                              }
                          }
                      }
                  }
              }
          }

          @Composable
          fun LiveTablesScreen(data: TournamentPageData) {
              if (data.tables.isEmpty()) {
                  Box(modifier = Modifier.fillMaxSize().padding(24.dp), contentAlignment = Alignment.Center) {
                      Text(
                          text = "Группы не найдены. Открой вкладку «Веб / DOM» и нажми «Скопировать DOM».",
                          color = KhlTextGray,
                          fontSize = 14.sp,
                          textAlign = TextAlign.Center
                      )
                  }
                  return
              }

              LazyColumn(contentPadding = PaddingValues(12.dp), verticalArrangement = Arrangement.spacedBy(12.dp)) {
                  items(data.tables) { table ->
                      Card(
                          colors = CardDefaults.cardColors(containerColor = KhlCardDark),
                          shape = RoundedCornerShape(12.dp),
                          modifier = Modifier.fillMaxWidth()
                      ) {
                          Column(modifier = Modifier.padding(14.dp)) {
                              Row(
                                  modifier = Modifier.fillMaxWidth(),
                                  horizontalArrangement = Arrangement.SpaceBetween,
                                  verticalAlignment = Alignment.CenterVertically
                              ) {
                                  Text(
                                      text = table.title,
                                      color = KhlIceBlue,
                                      fontSize = 15.sp,
                                      fontWeight = FontWeight.Black
                                  )
                                  Text(
                                      text = table.subtitle,
                                      color = KhlAccentRed,
                                      fontSize = 12.sp,
                                      fontWeight = FontWeight.Bold
                                  )
                              }
                              Spacer(modifier = Modifier.height(8.dp))
                              for (rIdx in 0 until table.rows.size) {
                                  val row = table.rows[rIdx]
                                  Text(
                                      text = row.joinToString("  •  "),
                                      color = Color.White,
                                      fontSize = 12.sp,
                                      modifier = Modifier.padding(vertical = 4.dp)
                                  )
                              }
                          }
                      }
                  }
              }
          }

          @Composable
          fun LivePlayersScreen(data: TournamentPageData) {
              if (data.playerRows.isEmpty()) {
                  Box(modifier = Modifier.fillMaxSize().padding(24.dp), contentAlignment = Alignment.Center) {
                      Text(
                          text = "Нажми сверху «Лучшие игроки», чтобы подгрузить статистику по группам 318 / 321 / 324.",
                          color = KhlTextGray,
                          fontSize = 14.sp,
                          textAlign = TextAlign.Center
                      )
                  }
                  return
              }

              LazyColumn(contentPadding = PaddingValues(12.dp), verticalArrangement = Arrangement.spacedBy(8.dp)) {
                  items(data.playerRows) { row ->
                      Card(
                          colors = CardDefaults.cardColors(containerColor = KhlCardDark),
                          shape = RoundedCornerShape(10.dp),
                          modifier = Modifier.fillMaxWidth()
                      ) {
                          Text(
                              text = row.joinToString("  •  "),
                              color = Color.White,
                              fontSize = 13.sp,
                              modifier = Modifier.padding(12.dp)
                          )
                      }
                  }
              }
          }

          @SuppressLint("SetJavaScriptEnabled")
          @Composable
          fun WebAndDomScreen(data: TournamentPageData) {
              val context = LocalContext.current
              var showLiveWeb by remember { mutableStateOf(false) }

              Column(modifier = Modifier.fillMaxSize()) {
                  Row(
                      modifier = Modifier
                          .fillMaxWidth()
                          .padding(horizontal = 12.dp, vertical = 8.dp),
                      horizontalArrangement = Arrangement.spacedBy(8.dp)
                  ) {
                      Button(
                          onClick = {
                              val clipboard = context.getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
                              clipboard.setPrimaryClip(ClipData.newPlainText("FHM_DOM", data.diagnosticReport))
                              Toast.makeText(context, "Скопировано! Вставь в чат", Toast.LENGTH_LONG).show()
                          },
                          colors = ButtonDefaults.buttonColors(containerColor = KhlAccentRed),
                          modifier = Modifier.weight(1f)
                      ) {
                          Icon(Icons.Default.ContentCopy, contentDescription = null, modifier = Modifier.size(16.dp))
                          Spacer(modifier = Modifier.width(6.dp))
                          Text("Скопировать DOM", fontSize = 12.sp, fontWeight = FontWeight.Bold)
                      }

                      Button(
                          onClick = { showLiveWeb = !showLiveWeb },
                          colors = ButtonDefaults.buttonColors(containerColor = KhlCardDark),
                          modifier = Modifier.weight(1f)
                      ) {
                          Icon(Icons.Default.Public, contentDescription = null, modifier = Modifier.size(16.dp), tint = KhlIceBlue)
                          Spacer(modifier = Modifier.width(6.dp))
                          Text(
                              text = if (showLiveWeb) "Показать отчет" else "Открыть веб-вид",
                              color = KhlIceBlue,
                              fontSize = 12.sp,
                              fontWeight = FontWeight.Bold
                          )
                      }
                  }

                  if (showLiveWeb) {
                      AndroidView(
                          modifier = Modifier.fillMaxSize(),
                          factory = { ctx ->
                              WebView(ctx).apply {
                                  settings.javaScriptEnabled = true
                                  settings.domStorageEnabled = true
                                  webViewClient = WebViewClient()
                                  loadUrl(data.url)
                              }
                          },
                          update = { webView ->
                              if (webView.url != data.url) {
                                  webView.loadUrl(data.url)
                              }
                          }
                      )
                  } else {
                      LazyColumn(
                          contentPadding = PaddingValues(12.dp),
                          modifier = Modifier.fillMaxSize()
                      ) {
                          item {
                              Card(
                                  colors = CardDefaults.cardColors(containerColor = KhlCardDark),
                                  shape = RoundedCornerShape(12.dp),
                                  modifier = Modifier.fillMaxWidth()
                              ) {
                                  Text(
                                      text = data.diagnosticReport,
                                      color = Color.White,
                                      fontSize = 11.sp,
                                      fontFamily = FontFamily.Monospace,
                                      modifier = Modifier.padding(12.dp)
                                  )
                              }
                          }
                      }
                  }
              }
          }
          EOF

      - name: Build Debug APK
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon 2>&1 | tee build_output.log || {
            echo "### Ошибки компиляции Kotlin" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            grep -E "e: |FAILURE|What went wrong" -A 5 build_output.log || tail -n 40 build_output.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          }

      - name: Rename APK to v2.4
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/fhm-tournament54-v24.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fhm-tournament54-v24
          path: app/build/outputs/apk/debug/fhm-tournament54-v24.apk
