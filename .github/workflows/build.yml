name: Build FHM v2.7 APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download Gradle 8.7 directly
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle-8.7-bin.zip -d /tmp
          echo "/tmp/gradle-8.7/bin" >> $GITHUB_PATH

      - name: Generate v2.7 project
        run: |
          rm -rf app settings.gradle.kts build.gradle.kts gradle.properties
          mkdir -p app/src/main/java/com/fhm/khlstyle

          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "FHM_KHL_V27"
          include(":app")
          EOF

          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          EOF

          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.fhm.khlstyle"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.fhm.khlstyle"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 27
                  versionName = "2.7"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
              buildFeatures {
                  compose = true
              }
              composeOptions {
                  kotlinCompilerExtensionVersion = "1.5.14"
              }
          }

          dependencies {
              val composeBom = platform("androidx.compose:compose-bom:2024.06.00")
              implementation(composeBom)
              implementation("androidx.activity:activity-compose:1.9.0")
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-graphics")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-extended")
              implementation("org.jsoup:jsoup:1.17.2")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1")
              implementation("io.coil-kt:coil-compose:2.6.0")
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:allowBackup="false"
                  android:icon="@android:drawable/sym_def_app_icon"
                  android:label="ФХМ 54 (v2.7)"
                  android:supportsRtl="true"
                  android:usesCleartextTraffic="true"
                  android:theme="@android:style/Theme.Material.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/fhm/khlstyle/MainActivity.kt
          package com.fhm.khlstyle

          import android.annotation.SuppressLint
          import android.content.ClipData
          import android.content.ClipboardManager
          import android.content.Context
          import android.graphics.Bitmap
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.webkit.WebResourceRequest
          import android.webkit.WebResourceResponse
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import android.widget.Toast
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.foundation.background
          import androidx.compose.foundation.clickable
          import androidx.compose.foundation.horizontalScroll
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.LazyColumn
          import androidx.compose.foundation.lazy.items
          import androidx.compose.foundation.rememberScrollState
          import androidx.compose.foundation.shape.CircleShape
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.material.icons.Icons
          import androidx.compose.material.icons.filled.Code
          import androidx.compose.material.icons.filled.ContentCopy
          import androidx.compose.material.icons.filled.EmojiEvents
          import androidx.compose.material.icons.filled.FormatListNumbered
          import androidx.compose.material.icons.filled.Public
          import androidx.compose.material.icons.filled.Refresh
          import androidx.compose.material.icons.filled.SportsHockey
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.draw.clip
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.layout.ContentScale
          import androidx.compose.ui.platform.LocalContext
          import androidx.compose.ui.text.font.FontFamily
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.text.style.TextAlign
          import androidx.compose.ui.text.style.TextOverflow
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import androidx.compose.ui.viewinterop.AndroidView
          import coil.compose.AsyncImage
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.launch
          import kotlinx.coroutines.suspendCancellableCoroutine
          import kotlinx.coroutines.withContext
          import kotlinx.coroutines.withTimeoutOrNull
          import org.json.JSONArray
          import org.json.JSONObject
          import org.json.JSONTokener
          import org.jsoup.Jsoup
          import org.jsoup.nodes.Document
          import java.util.Collections
          import kotlin.coroutines.resume

          data class HockeyMatch(
              val id: String,
              val homeTeam: String,
              val awayTeam: String,
              val homeLogo: String,
              val awayLogo: String,
              val scoreText: String,
              val dateText: String,
              val groupName: String,
              val tourName: String,
              val statusBadge: String,
              val isFinished: Boolean,
              val gameUrl: String
          )

          data class ParsedTable(
              val title: String,
              val headers: List<String>,
              val rows: List<List<String>>
          )

          data class TournamentPageData(
              val url: String,
              val tournamentTitle: String,
              val upcomingMatches: List<HockeyMatch>,
              val pastMatches: List<HockeyMatch>,
              val tables: List<ParsedTable>,
              val playerRows: List<List<String>>,
              val diagnosticReport: String
          )

          object FhmTournamentParser {

              suspend fun loadTournament(
                  context: Context,
                  tournamentId: String,
                  targetSection: Int // 0 = Матчи, 1 = Таблица, 2 = Игроки
              ): TournamentPageData {
                  val tabParam = when (targetSection) {
                      0 -> 1
                      1 -> 2
                      else -> 4
                  }
                  val targetUrl = "https://fhmoscow.com/tournament/$tournamentId?tournament-tab=$tabParam"

                  val webResult = fetchInteractiveDomAndApiViaWebView(context, targetUrl, targetSection)
                  val renderedHtml = webResult.first
                  val apiPayloads = webResult.second
                  val interceptedUrls = webResult.third

                  val doc = if (renderedHtml.isNotEmpty()) {
                      Jsoup.parse(renderedHtml, targetUrl)
                  } else {
                      Document(targetUrl)
                  }

                  // Находим и скачиваем webpack-чанки 300 (grouped-standings), 531 (table-render), 427 (best-player) и 886 (match-cards)
                  val chunksReport = withContext(Dispatchers.IO) {
                      val sb = StringBuilder()
                      try {
                          val scripts = doc.select("script[src]")
                          var baseJsDir = ""
                          var vendorsUrl = ""
                          for (s in scripts) {
                              val src = s.attr("abs:src")
                              if (src.contains("/js/vendors.")) {
                                  vendorsUrl = src
                                  baseJsDir = src.substringBeforeLast("/js/") + "/js/"
                              }
                          }

                          if (vendorsUrl.isNotEmpty()) {
                              val vBody = Jsoup.connect(vendorsUrl)
                                  .userAgent("Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 Chrome/124.0.0.0 Mobile Safari/537.36")
                                  .ignoreContentType(true)
                                  .maxBodySize(0)
                                  .timeout(10000)
                                  .execute()
                                  .body()

                              // Ищем маппинг хэшей чанков в vendors.js (например, 300:"...", 531:"...", 427:"...")
                              val chunkIdx = vBody.indexOf("886")
                              if (chunkIdx >= 0) {
                                  val st = if (chunkIdx > 250) chunkIdx - 250 else 0
                                  val en = if (chunkIdx + 450 < vBody.length) chunkIdx + 450 else vBody.length
                                  sb.append("=== КАРТА WEBPACK-ЧАНКОВ В VENDORS.JS ===\n")
                                  sb.append(vBody.substring(st, en)).append("\n\n")

                                  // Вытаскиваем хэши для чанков 300, 531, 96, 995, 427, 886
                                  val hashRegex = Regex("(300|531|96|995|427|886)\"?\\s*:\\s*\"([a-f0-9]{16,24})\"")
                                  for (m in hashRegex.findAll(vBody.substring(st, en))) {
                                      val cId = m.groupValues[1]
                                      val cHash = m.groupValues[2]
                                      val chunkUrl = "$baseJsDir$cId.$cHash.js"
                                      sb.append("--- ЧАНК #$cId ($chunkUrl) ---\n")
                                      try {
                                          val cBody = Jsoup.connect(chunkUrl)
                                              .userAgent("Mozilla/5.0")
                                              .ignoreContentType(true)
                                              .maxBodySize(0)
                                              .timeout(8000)
                                              .execute()
                                              .body()
                                          sb.append(cBody.take(1800)).append("\n\n")
                                      } catch (ce: Exception) {
                                          sb.append("Ошибка загрузки чанка: ${ce.localizedMessage}\n")
                                      }
                                  }
                              }
                          }
                      } catch (e: Exception) {
                          sb.append("Ошибка анализа чанков: ").append(e.localizedMessage ?: "err")
                      }
                      sb.toString()
                  }

                  return parseEverything(doc, targetUrl, apiPayloads, interceptedUrls, chunksReport)
              }

              @SuppressLint("SetJavaScriptEnabled")
              private suspend fun fetchInteractiveDomAndApiViaWebView(
                  context: Context,
                  url: String,
                  targetSection: Int
              ): Triple<String, List<Pair<String, String>>, List<String>> {
                  return withContext(Dispatchers.Main) {
                      val interceptedUrls = Collections.synchronizedList(mutableListOf<String>())

                      val result: Triple<String, List<Pair<String, String>>, List<String>>? =
                          withTimeoutOrNull<Triple<String, List<Pair<String, String>>, List<String>>>(26000L) {
                              suspendCancellableCoroutine<Triple<String, List<Pair<String, String>>, List<String>>> { cont ->
                                  val webView = WebView(context)
                                  webView.layout(0, 0, 1080, 2400)
                                  webView.settings.javaScriptEnabled = true
                                  webView.settings.domStorageEnabled = true
                                  webView.settings.userAgentString =
                                      "Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Mobile Safari/537.36"

                                  var finished = false
                                  val mainHandler = Handler(Looper.getMainLooper())

                                  val hooksJs = "(function() {" +
                                      "window.__fhmPayloads = window.__fhmPayloads || [];" +
                                      "if (!window.__fhmHookedV27) {" +
                                      "  window.__fhmHookedV27 = true;" +
                                      "  var origFetch = window.fetch;" +
                                      "  if (origFetch) {" +
                                      "    window.fetch = function() {" +
                                      "      var u = arguments[0];" +
                                      "      var uStr = (typeof u === 'string') ? u : (u && u.url ? u.url : 'fetch');" +
                                      "      return origFetch.apply(this, arguments).then(function(resp) {" +
                                      "        try { resp.clone().text().then(function(txt) { window.__fhmPayloads.push({ url: uStr, body: txt.substring(0, 35000) }); }); } catch(e) {}" +
                                      "        return resp;" +
                                      "      });" +
                                      "    };" +
                                      "  }" +
                                      "  var origOpen = XMLHttpRequest.prototype.open;" +
                                      "  XMLHttpRequest.prototype.open = function(m, u) { this._url = u; return origOpen.apply(this, arguments); };" +
                                      "  var origSend = XMLHttpRequest.prototype.send;" +
                                      "  XMLHttpRequest.prototype.send = function() {" +
                                      "    var self = this;" +
                                      "    this.addEventListener('load', function() {" +
                                      "      try { window.__fhmPayloads.push({ url: (self._url || 'xhr'), body: (self.responseText || '').substring(0, 35000) }); } catch(e) {}" +
                                      "    });" +
                                      "    return origSend.apply(this, arguments);" +
                                      "  };" +
                                      "}" +
                                      "})();"

                                  // Активируем ТОЛЬКО нужную секцию, чтобы её панель оставалась видимой и подгрузила свой чанк!
                                  val activateSectionJs = "(function() {" +
                                      "try {" +
                                      "  var sec = " + targetSection + ";" +
                                      "  var tabAttr = (sec === 0) ? '1' : ((sec === 1) ? '2' : '4');" +
                                      "  var btn = document.querySelector('.tournament-tab[data-tab=\"' + tabAttr + '\"]') || document.querySelectorAll('.tournament-tab')[sec];" +
                                      "  if (btn) { btn.click(); }" +
                                      "  var panel = document.querySelector('.tournament-wrapper[data-tab=\"' + tabAttr + '\"]');" +
                                      "  if (panel) {" +
                                      "    panel.removeAttribute('hidden');" +
                                      "    panel.classList.add('active');" +
                                      "    panel.scrollIntoView();" +
                                      "  }" +
                                      "  var summaries = document.querySelectorAll('details.standings-group > summary');" +
                                      "  for (var i = 0; i < summaries.length; i++) {" +
                                      "    summaries[i].click();" +
                                      "    if (summaries[i].parentElement) {" +
                                      "      summaries[i].parentElement.open = true;" +
                                      "      summaries[i].parentElement.dispatchEvent(new Event('toggle'));" +
                                      "    }" +
                                      "  }" +
                                      "} catch(e) {}" +
                                      "})();"

                                  val dumpJs = "(function() {" +
                                      "return JSON.stringify({" +
                                      "  html: document.documentElement.outerHTML," +
                                      "  payloads: window.__fhmPayloads || []" +
                                      "});" +
                                      "})();"

                                  webView.webViewClient = object : WebViewClient() {
                                      override fun shouldInterceptRequest(
                                          view: WebView?,
                                          request: WebResourceRequest?
                                      ): WebResourceResponse? {
                                          val reqUrl = request?.url?.toString() ?: ""
                                          if (reqUrl.contains("/api/") || reqUrl.contains("/js/")) {
                                              synchronized(interceptedUrls) {
                                                  val entry = "${request?.method ?: "GET"} $reqUrl"
                                                  if (!interceptedUrls.contains(entry) && interceptedUrls.size < 80) {
                                                      interceptedUrls.add(entry)
                                                  }
                                              }
                                          }
                                          return super.shouldInterceptRequest(view, request)
                                      }

                                      override fun onPageStarted(view: WebView?, loadedUrl: String?, favicon: Bitmap?) {
                                          super.onPageStarted(view, loadedUrl, favicon)
                                          view?.evaluateJavascript(hooksJs, null)
                                      }

                                      override fun onPageFinished(view: WebView?, loadedUrl: String?) {
                                          if (finished) return
                                          webView.evaluateJavascript(hooksJs, null)

                                          mainHandler.postDelayed({
                                              if (!finished && cont.isActive) {
                                                  webView.evaluateJavascript(activateSectionJs, null)
                                              }
                                          }, 1200L)

                                          mainHandler.postDelayed({
                                              if (!finished && cont.isActive) {
                                                  webView.evaluateJavascript(activateSectionJs, null)
                                              }
                                          }, 2800L)

                                          mainHandler.postDelayed({
                                              if (!finished && cont.isActive) {
                                                  finished = true
                                                  webView.evaluateJavascript(dumpJs) { rawJson ->
                                                      var htmlOut = ""
                                                      val payloadsList = mutableListOf<Pair<String, String>>()
                                                      try {
                                                          if (rawJson != null && rawJson != "null") {
                                                              val unquoted = JSONTokener(rawJson).nextValue()?.toString() ?: ""
                                                              val obj = JSONObject(unquoted)
                                                              htmlOut = obj.optString("html", "")
                                                              val arr = obj.optJSONArray("payloads") ?: JSONArray()
                                                              for (i in 0 until arr.length()) {
                                                                  val item = arr.optJSONObject(i)
                                                                  if (item != null) {
                                                                      payloadsList.add(
                                                                          Pair(
                                                                              item.optString("url", ""),
                                                                              item.optString("body", "")
                                                                          )
                                                                      )
                                                                  }
                                                              }
                                                          }
                                                      } catch (e: Exception) {
                                                          htmlOut = ""
                                                      }
                                                      webView.destroy()
                                                      if (cont.isActive) {
                                                          val netCopy = synchronized(interceptedUrls) { interceptedUrls.toList() }
                                                          cont.resume(Triple(htmlOut, payloadsList, netCopy))
                                                      }
                                                  }
                                              }
                                          }, 6000L)
                                      }
                                  }

                                  cont.invokeOnCancellation {
                                      mainHandler.removeCallbacksAndMessages(null)
                                      webView.stopLoading()
                                      webView.destroy()
                                  }

                                  webView.loadUrl(url)
                              }
                          }
                      val netCopy = synchronized(interceptedUrls) { interceptedUrls.toList() }
                      result ?: Triple("", emptyList(), netCopy)
                  }
              }

              private fun parseEverything(
                  doc: Document,
                  url: String,
                  apiPayloads: List<Pair<String, String>>,
                  interceptedUrls: List<String>,
                  chunksReport: String
              ): TournamentPageData {
                  val h1 = doc.select("h1, h2").firstOrNull()?.text()?.trim() ?: "Кубок г. Москвы"
                  val upcomingMatches = mutableListOf<HockeyMatch>()
                  val pastMatches = mutableListOf<HockeyMatch>()
                  val parsedTables = mutableListOf<ParsedTable>()
                  val extractedPlayers = mutableListOf<List<String>>()

                  for (payload in apiPayloads) {
                      val apiUrl = payload.first
                      val body = payload.second.trim()
                      if (body.startsWith("{")) {
                          try {
                              val json = JSONObject(body)
                              val items = json.optJSONArray("items")
                              if (items != null && apiUrl.contains("/api/game/list")) {
                                  for (i in 0 until items.length()) {
                                      val mObj = items.optJSONObject(i) ?: continue
                                      val match = parseGameJsonItem(mObj, i)
                                      if (match.isFinished) {
                                          if (pastMatches.none { it.id == match.id }) pastMatches.add(match)
                                      } else {
                                          if (upcomingMatches.none { it.id == match.id }) upcomingMatches.add(match)
                                      }
                                  }
                              }
                          } catch (e: Exception) {
                              // Игнорируем обрезанный JSON
                          }
                      }
                  }

                  val standingGroups = doc.select("details.standings-group")
                  for (gIdx in 0 until standingGroups.size) {
                      val groupEl = standingGroups[gIdx]
                      val groupId = groupEl.attr("data-standings-group")
                      val groupTitle = groupEl.select("summary").firstOrNull()?.text()?.trim()
                          ?: "Группа #${gIdx + 1}"

                      val rows = mutableListOf<List<String>>()
                      val trs = groupEl.select("tr, [class*=row], [class*=item]")
                      for (rEl in trs) {
                          val cells = mutableListOf<String>()
                          for (ch in rEl.children()) {
                              val t = ch.text().trim()
                              if (t.isNotEmpty()) cells.add(t)
                          }
                          if (cells.size >= 3) rows.add(cells)
                      }
                      if (rows.isEmpty()) {
                          val contentText = groupEl.selectFirst("[data-standings-content]")?.text()?.trim() ?: ""
                          if (contentText.isNotEmpty()) {
                              rows.add(listOf(contentText.take(300)))
                          } else {
                              rows.add(listOf("Группа ID=$groupId", "См. чанки 300/531 во вкладке Веб / API"))
                          }
                      }
                      parsedTables.add(
                          ParsedTable(
                              title = "$groupTitle (ID $groupId)",
                              headers = listOf("#", "Команда"),
                              rows = rows
                          )
                      )
                  }

                  val payloadDumpBuilder = StringBuilder()
                  for (idx in 0 until apiPayloads.size) {
                      val p = apiPayloads[idx]
                      if (!p.first.contains("/api/game/list") || idx < 2) {
                          payloadDumpBuilder.append("--- API PAYLOAD #").append(idx + 1).append(": ").append(p.first).append(" ---\n")
                          payloadDumpBuilder.append(p.second.take(1200)).append("\n\n")
                      }
                  }

                  val report = buildString {
                      appendLine("=== ОТЧЕТ ПАРСЕРА v2.7 (LOGOS + CHUNKS 300/531/427) ===")
                      appendLine("URL: $url")
                      appendLine("Предстоящих матчей: ${upcomingMatches.size}, Прошедших: ${pastMatches.size}")
                      appendLine("\n=== КОД WEBPACK-ЧАНКОВ ТАБЛИЦ И ИГРОКОВ (300, 531, 427) ===")
                      appendLine(chunksReport)
                      appendLine("\n=== СЕТЕВЫЕ ЗАПРОСЫ (/api/ и /js/) ===")
                      appendLine(interceptedUrls.joinToString("\n"))
                      appendLine("\n=== ПЕРЕХВАЧЕННЫЕ JSON ОТВЕТЫ ===")
                      appendLine(payloadDumpBuilder.toString())
                  }

                  return TournamentPageData(
                      url = url,
                      tournamentTitle = h1,
                      upcomingMatches = upcomingMatches,
                      pastMatches = pastMatches,
                      tables = parsedTables,
                      playerRows = extractedPlayers,
                      diagnosticReport = report
                  )
              }

              private fun parseGameJsonItem(mObj: JSONObject, index: Int): HockeyMatch {
                  val id = mObj.optString("id", "idx_$index")
                  val dateStr = mObj.optString("displayDate", mObj.optString("date", ""))
                  val groupStr = mObj.optString("group", "")
                  val tourStr = mObj.optString("tour", "")
                  val statusInt = mObj.optInt("status", 0)
                  val isLive = mObj.optBoolean("isLive", false)
                  val overtime = mObj.optBoolean("overtime", false)
                  val shootout = mObj.optBoolean("shootout", false)
                  val gameUrl = mObj.optString("url", "/game/$id")

                  val t1 = mObj.optJSONObject("team1")
                  val t2 = mObj.optJSONObject("team2")

                  val homeTeam = t1?.optString("name", "Команда 1") ?: "Команда 1"
                  val awayTeam = t2?.optString("name", "Команда 2") ?: "Команда 2"
                  val homeLogo = t1?.optString("logo", "") ?: ""
                  val awayLogo = t2?.optString("logo", "") ?: ""

                  val s1 = if (t1 != null && !t1.isNull("score")) t1.opt("score").toString() else null
                  val s2 = if (t2 != null && !t2.isNull("score")) t2.opt("score").toString() else null

                  val suffix = when {
                      shootout -> " Б"
                      overtime -> " ОТ"
                      else -> ""
                  }

                  val scoreText = if (s1 != null && s2 != null) {
                      "$s1 : $s2$suffix"
                  } else {
                      "VS"
                  }

                  val statusBadge = when {
                      isLive -> "LIVE"
                      statusInt == 2 -> "ОКОНЧЕН"
                      else -> mObj.optString("date", "МАТЧ")
                  }

                  return HockeyMatch(
                      id = id,
                      homeTeam = homeTeam,
                      awayTeam = awayTeam,
                      homeLogo = homeLogo,
                      awayLogo = awayLogo,
                      scoreText = scoreText,
                      dateText = dateStr,
                      groupName = groupStr,
                      tourName = tourStr,
                      statusBadge = statusBadge,
                      isFinished = (statusInt == 2),
                      gameUrl = "https://fhmoscow.com$gameUrl"
                  )
              }
          }

          val KhlBgDark = Color(0xFF0B101B)
          val KhlCardDark = Color(0xFF161F30)
          val KhlAccentRed = Color(0xFFE30613)
          val KhlIceBlue = Color(0xFF00A8E8)
          val KhlTextGray = Color(0xFF8F9BB3)

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContent {
                      MaterialTheme(
                          colorScheme = darkColorScheme(
                              background = KhlBgDark,
                              surface = KhlCardDark,
                              primary = KhlAccentRed,
                              secondary = KhlIceBlue
                          )
                      ) {
                          FhmKhlAppV27()
                      }
                  }
              }
          }

          @Composable
          fun FhmKhlAppV27() {
              val context = LocalContext.current
              val scope = rememberCoroutineScope()

              var bottomTab by remember { mutableIntStateOf(0) }
              var matchFilter by remember { mutableIntStateOf(1) } // 1 = Прошедшие со счетом, 0 = Ближайшие
              var selectedGroupFilter by remember { mutableStateOf("Все") }
              var tournamentId by remember { mutableStateOf("54") }

              var pageData by remember { mutableStateOf<TournamentPageData?>(null) }
              var isLoading by remember { mutableStateOf(true) }
              var selectedMatch by remember { mutableStateOf<HockeyMatch?>(null) }

              fun reload(section: Int = 1) {
                  scope.launch {
                      isLoading = true
                      pageData = FhmTournamentParser.loadTournament(context, tournamentId, section)
                      isLoading = false
                  }
              }

              LaunchedEffect(tournamentId) {
                  reload(1)
              }

              val totalMatchesCount = (pageData?.upcomingMatches?.size ?: 0) + (pageData?.pastMatches?.size ?: 0)

              Scaffold(
                  containerColor = KhlBgDark,
                  topBar = {
                      Column(
                          modifier = Modifier
                              .fillMaxWidth()
                              .background(KhlCardDark)
                              .padding(top = 10.dp, bottom = 8.dp)
                      ) {
                          Row(
                              modifier = Modifier
                                  .fillMaxWidth()
                                  .padding(horizontal = 14.dp),
                              horizontalArrangement = Arrangement.SpaceBetween,
                              verticalAlignment = Alignment.CenterVertically
                          ) {
                              Column(modifier = Modifier.weight(1f)) {
                                  Row(verticalAlignment = Alignment.CenterVertically) {
                                      Box(modifier = Modifier.size(9.dp).clip(CircleShape).background(KhlAccentRed))
                                      Spacer(modifier = Modifier.width(8.dp))
                                      Text(
                                          text = "ФХМ МАТЧ-ЦЕНТР (v2.7)",
                                          color = KhlIceBlue,
                                          fontSize = 12.sp,
                                          fontWeight = FontWeight.Bold
                                      )
                                  }
                                  Text(
                                      text = pageData?.tournamentTitle ?: "Кубок г. Москвы 2017 г.р.",
                                      color = Color.White,
                                      fontSize = 14.sp,
                                      fontWeight = FontWeight.Black,
                                      maxLines = 1,
                                      overflow = TextOverflow.Ellipsis
                                  )
                              }
                              IconButton(onClick = { reload(bottomTab.coerceIn(0, 2)) }) {
                                  Icon(Icons.Default.Refresh, contentDescription = "Обновить", tint = Color.White)
                              }
                          }

                          if (bottomTab == 0) {
                              // Переключатель Прошедшие / Ближайшие
                              Row(
                                  modifier = Modifier
                                      .fillMaxWidth()
                                      .padding(horizontal = 12.dp, vertical = 4.dp),
                                  horizontalArrangement = Arrangement.spacedBy(8.dp)
                              ) {
                                  val pastCount = pageData?.pastMatches?.size ?: 0
                                  val upCount = pageData?.upcomingMatches?.size ?: 0
                                  val filters = listOf(
                                      1 to "Результаты ($pastCount)",
                                      0 to "Календарь ($upCount)"
                                  )
                                  filters.forEach { pair ->
                                      val idx = pair.first
                                      val label = pair.second
                                      val active = matchFilter == idx
                                      Box(
                                          modifier = Modifier
                                              .clip(RoundedCornerShape(16.dp))
                                              .background(if (active) KhlAccentRed else KhlBgDark)
                                              .clickable { matchFilter = idx }
                                              .padding(horizontal = 14.dp, vertical = 6.dp)
                                      ) {
                                          Text(
                                              text = label,
                                              color = if (active) Color.White else KhlTextGray,
                                              fontSize = 12.sp,
                                              fontWeight = FontWeight.Bold
                                          )
                                      }
                                  }
                              }

                              // Фильтр по группам (Все, Группа А, Группа Б, Группа В)
                              val groupOptions = listOf("Все", "Группа А", "Группа Б", "Группа В")
                              Row(
                                  modifier = Modifier
                                      .fillMaxWidth()
                                      .horizontalScroll(rememberScrollState())
                                      .padding(horizontal = 12.dp, vertical = 2.dp),
                                  horizontalArrangement = Arrangement.spacedBy(6.dp)
                              ) {
                                  groupOptions.forEach { grp ->
                                      val isSel = selectedGroupFilter == grp
                                      Box(
                                          modifier = Modifier
                                              .clip(RoundedCornerShape(8.dp))
                                              .background(if (isSel) KhlIceBlue.copy(alpha = 0.25f) else Color.Transparent)
                                              .clickable { selectedGroupFilter = grp }
                                              .padding(horizontal = 10.dp, vertical = 4.dp)
                                      ) {
                                          Text(
                                              text = grp,
                                              color = if (isSel) KhlIceBlue else KhlTextGray,
                                              fontSize = 12.sp,
                                              fontWeight = FontWeight.SemiBold
                                          )
                                      }
                                  }
                              }
                          }
                      }
                  },
                  bottomBar = {
                      NavigationBar(containerColor = KhlCardDark) {
                          NavigationBarItem(
                              selected = bottomTab == 0,
                              onClick = { bottomTab = 0 },
                              icon = { Icon(Icons.Default.SportsHockey, null) },
                              label = { Text("Матчи ($totalMatchesCount)") }
                          )
                          NavigationBarItem(
                              selected = bottomTab == 1,
                              onClick = { bottomTab = 1 },
                              icon = { Icon(Icons.Default.FormatListNumbered, null) },
                              label = { Text("Таблица") }
                          )
                          NavigationBarItem(
                              selected = bottomTab == 2,
                              onClick = { bottomTab = 2 },
                              icon = { Icon(Icons.Default.EmojiEvents, null) },
                              label = { Text("Игроки") }
                          )
                          NavigationBarItem(
                              selected = bottomTab == 3,
                              onClick = { bottomTab = 3 },
                              icon = { Icon(Icons.Default.Code, null) },
                              label = { Text("Веб / API") }
                          )
                      }
                  }
              ) { innerPadding ->
                  Box(
                      modifier = Modifier
                          .fillMaxSize()
                          .padding(innerPadding)
                  ) {
                      if (isLoading) {
                          Column(
                              modifier = Modifier.align(Alignment.Center),
                              horizontalAlignment = Alignment.CenterHorizontally
                          ) {
                              CircularProgressIndicator(color = KhlAccentRed)
                              Spacer(modifier = Modifier.height(12.dp))
                              Text(
                                  text = "Загрузка матчей, логотипов и чанков таблиц...",
                                  color = KhlTextGray,
                                  fontSize = 12.sp,
                                  textAlign = TextAlign.Center,
                                  modifier = Modifier.padding(horizontal = 24.dp)
                              )
                          }
                      } else {
                          val data = pageData
                          if (data != null) {
                              when (bottomTab) {
                                  0 -> {
                                      val baseList = if (matchFilter == 1) data.pastMatches else data.upcomingMatches
                                      val filtered = if (selectedGroupFilter == "Все") {
                                          baseList
                                      } else {
                                          baseList.filter { it.groupName.equals(selectedGroupFilter, ignoreCase = true) }
                                      }
                                      LiveMatchesScreen(filtered, onMatchClick = { selectedMatch = it })
                                  }
                                  1 -> LiveTablesScreen(data)
                                  2 -> LivePlayersScreen(data)
                                  3 -> WebAndDomScreen(data)
                              }
                          }
                      }
                  }
              }

              selectedMatch?.let { match ->
                  AlertDialog(
                      onDismissRequest = { selectedMatch = null },
                      containerColor = KhlCardDark,
                      title = {
                          Text("${match.homeTeam} — ${match.awayTeam}", color = Color.White, fontSize = 15.sp, fontWeight = FontWeight.Bold)
                      },
                      text = {
                          Column(verticalArrangement = Arrangement.spacedBy(6.dp)) {
                              Text("Счет: ${match.scoreText}", color = KhlIceBlue, fontSize = 16.sp, fontWeight = FontWeight.Black)
                              Text("${match.groupName} • ${match.tourName}", color = KhlAccentRed, fontSize = 13.sp, fontWeight = FontWeight.Bold)
                              Text("Дата: ${match.dateText}", color = Color.White, fontSize = 13.sp)
                              Text("Страница протокола: ${match.gameUrl}", color = KhlTextGray, fontSize = 11.sp)
                          }
                      },
                      confirmButton = {
                          TextButton(onClick = { selectedMatch = null }) {
                              Text("Закрыть", color = KhlIceBlue)
                          }
                      }
                  )
              }
          }

          @Composable
          fun LiveMatchesScreen(matches: List<HockeyMatch>, onMatchClick: (HockeyMatch) -> Unit) {
              if (matches.isEmpty()) {
                  Box(modifier = Modifier.fillMaxSize().padding(24.dp), contentAlignment = Alignment.Center) {
                      Text(
                          text = "Для выбранного фильтра матчей нет. Переключи группу или «Результаты / Календарь» сверху.",
                          color = KhlTextGray,
                          fontSize = 14.sp,
                          textAlign = TextAlign.Center
                      )
                  }
                  return
              }

              LazyColumn(contentPadding = PaddingValues(12.dp), verticalArrangement = Arrangement.spacedBy(12.dp)) {
                  items(matches) { match ->
                      Card(
                          colors = CardDefaults.cardColors(containerColor = KhlCardDark),
                          shape = RoundedCornerShape(14.dp),
                          modifier = Modifier.fillMaxWidth().clickable { onMatchClick(match) }
                      ) {
                          Column(modifier = Modifier.padding(14.dp)) {
                              // Верхняя строка: Группа + Тур и Статус
                              Row(
                                  modifier = Modifier.fillMaxWidth(),
                                  horizontalArrangement = Arrangement.SpaceBetween,
                                  verticalAlignment = Alignment.CenterVertically
                              ) {
                                  Text(
                                      text = "${match.groupName} • ${match.tourName}",
                                      color = KhlIceBlue,
                                      fontSize = 11.sp,
                                      fontWeight = FontWeight.Bold
                                  )
                                  Text(
                                      text = match.statusBadge,
                                      color = if (match.isFinished) KhlTextGray else KhlAccentRed,
                                      fontSize = 11.sp,
                                      fontWeight = FontWeight.Bold
                                  )
                              }

                              Spacer(modifier = Modifier.height(12.dp))

                              // Центральная часть: Логотип 1 + Команда 1 — СЧЕТ — Команда 2 + Логотип 2
                              Row(
                                  modifier = Modifier.fillMaxWidth(),
                                  verticalAlignment = Alignment.CenterVertically,
                                  horizontalArrangement = Arrangement.SpaceBetween
                              ) {
                                  Row(
                                      modifier = Modifier.weight(1f),
                                      verticalAlignment = Alignment.CenterVertically
                                  ) {
                                      AsyncImage(
                                          model = match.homeLogo,
                                          contentDescription = match.homeTeam,
                                          contentScale = ContentScale.Fit,
                                          modifier = Modifier
                                              .size(36.dp)
                                              .clip(CircleShape)
                                              .background(Color.White.copy(alpha = 0.08f))
                                              .padding(4.dp)
                                      )
                                      Spacer(modifier = Modifier.width(8.dp))
                                      Text(
                                          text = match.homeTeam,
                                          color = Color.White,
                                          fontSize = 13.sp,
                                          fontWeight = FontWeight.Bold,
                                          maxLines = 2,
                                          overflow = TextOverflow.Ellipsis
                                      )
                                  }

                                  Box(
                                      modifier = Modifier
                                          .padding(horizontal = 8.dp)
                                          .clip(RoundedCornerShape(8.dp))
                                          .background(KhlBgDark)
                                          .padding(horizontal = 12.dp, vertical = 6.dp)
                                  ) {
                                      Text(
                                          text = match.scoreText,
                                          color = Color.White,
                                          fontSize = 18.sp,
                                          fontWeight = FontWeight.Black
                                      )
                                  }

                                  Row(
                                      modifier = Modifier.weight(1f),
                                      verticalAlignment = Alignment.CenterVertically,
                                      horizontalArrangement = Arrangement.End
                                  ) {
                                      Text(
                                          text = match.awayTeam,
                                          color = Color.White,
                                          fontSize = 13.sp,
                                          fontWeight = FontWeight.Bold,
                                          textAlign = TextAlign.End,
                                          maxLines = 2,
                                          overflow = TextOverflow.Ellipsis,
                                          modifier = Modifier.weight(1f)
                                      )
                                      Spacer(modifier = Modifier.width(8.dp))
                                      AsyncImage(
                                          model = match.awayLogo,
                                          contentDescription = match.awayTeam,
                                          contentScale = ContentScale.Fit,
                                          modifier = Modifier
                                              .size(36.dp)
                                              .clip(CircleShape)
                                              .background(Color.White.copy(alpha = 0.08f))
                                              .padding(4.dp)
                                      )
                                  }
                              }

                              Spacer(modifier = Modifier.height(10.dp))

                              Text(
                                  text = match.dateText,
                                  color = KhlTextGray,
                                  fontSize = 11.sp
                              )
                          }
                      }
                  }
              }
          }

          @Composable
          fun LiveTablesScreen(data: TournamentPageData) {
              LazyColumn(contentPadding = PaddingValues(12.dp), verticalArrangement = Arrangement.spacedBy(12.dp)) {
                  items(data.tables) { table ->
                      Card(
                          colors = CardDefaults.cardColors(containerColor = KhlCardDark),
                          shape = RoundedCornerShape(12.dp),
                          modifier = Modifier.fillMaxWidth()
                      ) {
                          Column(modifier = Modifier.padding(12.dp)) {
                              Text(
                                  text = table.title,
                                  color = KhlIceBlue,
                                  fontSize = 14.sp,
                                  fontWeight = FontWeight.Black,
                                  modifier = Modifier.padding(bottom = 8.dp)
                              )
                              for (rIdx in 0 until table.rows.size) {
                                  val row = table.rows[rIdx]
                                  Text(
                                      text = row.joinToString("  |  "),
                                      color = Color.White,
                                      fontSize = 12.sp,
                                      modifier = Modifier.padding(vertical = 4.dp)
                                  )
                              }
                          }
                      }
                  }
              }
          }

          @Composable
          fun LivePlayersScreen(data: TournamentPageData) {
              Box(modifier = Modifier.fillMaxSize().padding(24.dp), contentAlignment = Alignment.Center) {
                  Text(
                      text = "Открой вкладку «Веб / API» и нажми «Скопировать API» — там уже выгружен исходный код чанков 300, 531 и 427 с адресами таблиц и бомбардиров!",
                      color = KhlTextGray,
                      fontSize = 14.sp,
                      textAlign = TextAlign.Center
                  )
              }
          }

          @SuppressLint("SetJavaScriptEnabled")
          @Composable
          fun WebAndDomScreen(data: TournamentPageData) {
              val context = LocalContext.current
              var showLiveWeb by remember { mutableStateOf(false) }

              Column(modifier = Modifier.fillMaxSize()) {
                  Row(
                      modifier = Modifier
                          .fillMaxWidth()
                          .padding(horizontal = 12.dp, vertical = 8.dp),
                      horizontalArrangement = Arrangement.spacedBy(8.dp)
                  ) {
                      Button(
                          onClick = {
                              val clipboard = context.getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
                              clipboard.setPrimaryClip(ClipData.newPlainText("FHM_CHUNKS", data.diagnosticReport))
                              Toast.makeText(context, "Скопировано! Вставь в чат", Toast.LENGTH_LONG).show()
                          },
                          colors = ButtonDefaults.buttonColors(containerColor = KhlAccentRed),
                          modifier = Modifier.weight(1f)
                      ) {
                          Icon(Icons.Default.ContentCopy, contentDescription = null, modifier = Modifier.size(16.dp))
                          Spacer(modifier = Modifier.width(6.dp))
                          Text("Скопировать API", fontSize = 12.sp, fontWeight = FontWeight.Bold)
                      }

                      Button(
                          onClick = { showLiveWeb = !showLiveWeb },
                          colors = ButtonDefaults.buttonColors(containerColor = KhlCardDark),
                          modifier = Modifier.weight(1f)
                      ) {
                          Icon(Icons.Default.Public, contentDescription = null, modifier = Modifier.size(16.dp), tint = KhlIceBlue)
                          Spacer(modifier = Modifier.width(6.dp))
                          Text(
                              text = if (showLiveWeb) "Показать отчет" else "Открыть веб-вид",
                              color = KhlIceBlue,
                              fontSize = 12.sp,
                              fontWeight = FontWeight.Bold
                          )
                      }
                  }

                  if (showLiveWeb) {
                      AndroidView(
                          modifier = Modifier.fillMaxSize(),
                          factory = { ctx ->
                              WebView(ctx).apply {
                                  settings.javaScriptEnabled = true
                                  settings.domStorageEnabled = true
                                  webViewClient = WebViewClient()
                                  loadUrl(data.url)
                              }
                          },
                          update = { webView ->
                              if (webView.url != data.url) {
                                  webView.loadUrl(data.url)
                              }
                          }
                      )
                  } else {
                      LazyColumn(
                          contentPadding = PaddingValues(12.dp),
                          modifier = Modifier.fillMaxSize()
                      ) {
                          item {
                              Card(
                                  colors = CardDefaults.cardColors(containerColor = KhlCardDark),
                                  shape = RoundedCornerShape(12.dp),
                                  modifier = Modifier.fillMaxWidth()
                              ) {
                                  Text(
                                      text = data.diagnosticReport,
                                      color = Color.White,
                                      fontSize = 11.sp,
                                      fontFamily = FontFamily.Monospace,
                                      modifier = Modifier.padding(12.dp)
                                  )
                              }
                          }
                      }
                  }
              }
          }
          EOF

      - name: Build Debug APK
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon 2>&1 | tee build_output.log || {
            echo "### Ошибки компиляции Kotlin" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            { grep -E "e: |FAILURE|What went wrong" -A 8 build_output.log || tail -n 40 build_output.log; } >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          }

      - name: Rename APK to v2.7
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/fhm-tournament54-v27.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fhm-tournament54-v27
          path: app/build/outputs/apk/debug/fhm-tournament54-v27.apk
