              }

              selectedMatch?.let { match ->
                  AlertDialog(
                      onDismissRequest = { selectedMatch = null },
                      containerColor = KhlCardDark,
                      title = { Text("${match.homeTeam} — ${match.awayTeam}", color = Color.White, fontSize = 15.sp, fontWeight = FontWeight.Bold) },
                      text = {
                          Column(verticalArrangement = Arrangement.spacedBy(6.dp)) {
                              Text("Счет: ${match.scoreText}", color = KhlIceBlue, fontSize = 20.sp, fontWeight = FontWeight.Black)
                              Text("${match.groupName} • ${match.tourName}", color = KhlAccentRed, fontSize = 13.sp, fontWeight = FontWeight.Bold)
                              Text("Дата и время: ${match.dateText}", color = Color.White, fontSize = 13.sp)
