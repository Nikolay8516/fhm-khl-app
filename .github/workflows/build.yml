                  }

                  items(group.rows) { row ->
                      val isTop3 = row.position <= 3
                      Card(
                          colors = CardDefaults.cardColors(containerColor = KhlCardDark),
                          shape = RoundedCornerShape(10.dp),
                          modifier = Modifier
                              .fillMaxWidth()
                              .clickable { onTeamClick(row) }
                      ) {
                          Row(
                              modifier = Modifier
                                  .fillMaxWidth()
                                  .padding(horizontal = 10.dp, vertical = 10.dp),
                              verticalAlignment = Alignment.CenterVertically
                          ) {
                              // Позиция
                              Box(
                                  modifier = Modifier
                                      .width(24.dp),
                                  contentAlignment = Alignment.CenterStart
                              ) {
                                  Text(
                                      text = row.position.toString(),
                                      color = if (isTop3) KhlAccentRed else KhlTextGray,
                                      fontWeight = FontWeight.Black,
                                      fontSize = 13.sp
                                  )
                              }

                              // Логотип + Название команды
                              Row(
                                  modifier = Modifier.weight(1f),
                                  verticalAlignment = Alignment.CenterVertically
                              ) {
                                  AsyncImage(
                                      model = row.logoUrl,
                                      contentDescription = row.teamName,
                                      contentScale = ContentScale.Fit,
                                      modifier = Modifier
                                          .size(28.dp)
                                          .clip(CircleShape)
                                          .background(Color.White.copy(alpha = 0.08f))
                                          .padding(2.dp)
                                  )
