          @Composable
          fun FhmKhlAppV51() {
              val context = LocalContext.current
              val scope = rememberCoroutineScope()

              val svgImageLoader = remember {
                  ImageLoader.Builder(context)
                      .components { add(SvgDecoder.Factory()) }
                      .build()
              }

              var bottomTab by remember { mutableIntStateOf(1) }
