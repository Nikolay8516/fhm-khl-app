name: Build FHM v2 APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download Gradle 8.7 directly
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle-8.7-bin.zip -d /tmp
          echo "/tmp/gradle-8.7/bin" >> $GITHUB_PATH

      - name: Clean old v1 files and generate v2 project
        run: |
          rm -rf app settings.gradle.kts build.gradle.kts gradle.properties
          mkdir -p app/src/main/java/com/fhm/khlstyle

          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "FHM_KHL_V2"
          include(":app")
          EOF

          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          EOF

          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.fhm.khlstyle"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.fhm.khlstyle"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 20
                  versionName = "2.0"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
              buildFeatures {
                  compose = true
              }
              composeOptions {
                  kotlinCompilerExtensionVersion = "1.5.14"
              }
          }

          dependencies {
              val composeBom = platform("androidx.compose:compose-bom:2024.06.00")
              implementation(composeBom)
              implementation("androidx.activity:activity-compose:1.9.0")
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-graphics")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-extended")
              implementation("org.jsoup:jsoup:1.17.2")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1")
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:allowBackup="false"
                  android:icon="@android:drawable/sym_def_app_icon"
                  android:label="ФХМ 54 (v2.0)"
                  android:supportsRtl="true"
                  android:usesCleartextTraffic="true"
                  android:theme="@android:style/Theme.Material.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/fhm/khlstyle/MainActivity.kt
          package com.fhm.khlstyle

          import android.annotation.SuppressLint
          import android.content.ClipData
          import android.content.ClipboardManager
          import android.content.Context
          import android.os.Bundle
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import android.widget.Toast
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.foundation.background
          import androidx.compose.foundation.clickable
          import androidx.compose.foundation.horizontalScroll
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.LazyColumn
          import androidx.compose.foundation.lazy.items
          import androidx.compose.foundation.rememberScrollState
          import androidx.compose.foundation.shape.CircleShape
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.material.icons.Icons
          import androidx.compose.material.icons.filled.Code
          import androidx.compose.material.icons.filled.ContentCopy
          import androidx.compose.material.icons.filled.EmojiEvents
          import androidx.compose.material.icons.filled.FormatListNumbered
          import androidx.compose.material.icons.filled.Public
          import androidx.compose.material.icons.filled.Refresh
          import androidx.compose.material.icons.filled.SportsHockey
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.draw.clip
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.platform.LocalContext
          import androidx.compose.ui.text.font.FontFamily
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.text.style.TextAlign
          import androidx.compose.ui.text.style.TextOverflow
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import androidx.compose.ui.viewinterop.AndroidView
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.launch
          import kotlinx.coroutines.suspendCancellableCoroutine
          import kotlinx.coroutines.withContext
          import kotlinx.coroutines.withTimeoutOrNull
          import org.json.JSONTokener
          import org.jsoup.Jsoup
          import org.jsoup.nodes.Document
          import kotlin.coroutines.resume

          data class HockeyMatch(
              val id: String,
              val homeTeam: String,
              val awayTeam: String,
              val scoreText: String,
              val infoLine: String,
              val status: String,
              val rawDetails: String
          )

          data class ParsedTable(
              val title: String,
              val headers: List<String>,
              val rows: List<List<String>>
          )

          data class TournamentPageData(
              val url: String,
              val tournamentTitle: String,
              val matches: List<HockeyMatch>,
              val tables: List<ParsedTable>,
              val playerRows: List<List<String>>,
              val diagnosticReport: String
          )

          object FhmTournamentParser {
              private val SCORE_REGEX = Regex("""(\d+)\s*[:\-]\s*(\d+)""")

              suspend fun loadTournament(
                  context: Context,
                  tournamentId: String,
                  tabIndex: Int
              ): TournamentPageData {
                  val targetUrl = "https://fhmoscow.com/tournament/$tournamentId?tournament-tab=$tabIndex"

                  var doc: Document? = withContext(Dispatchers.IO) {
                      try {
                          Jsoup.connect(targetUrl)
                              .userAgent("Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Mobile Safari/537.36")
                              .timeout(8000)
                              .get()
                      } catch (e: Exception) {
                          null
                      }
                  }

                  val jsoupTablesCount = doc?.select("table tr")?.size ?: 0
                  var usedWebView = false

                  if (doc == null || jsoupTablesCount < 2) {
                      val renderedHtml = fetchRenderedHtmlViaWebView(context, targetUrl)
                      if (renderedHtml.isNotBlank()) {
                          doc = Jsoup.parse(renderedHtml, targetUrl)
                          usedWebView = true
                      }
                  }

                  if (doc == null) {
                      return TournamentPageData(
                          url = targetUrl,
                          tournamentTitle = "Ошибка соединения с fhmoscow.com",
                          matches = emptyList(),
                          tables = emptyList(),
                          playerRows = emptyList(),
                          diagnosticReport = "Не удалось загрузить страницу $targetUrl."
                      )
                  }

                  return parseDomDocument(doc, targetUrl, usedWebView)
              }

              @SuppressLint("SetJavaScriptEnabled")
              private suspend fun fetchRenderedHtmlViaWebView(context: Context, url: String): String {
                  return withContext(Dispatchers.Main) {
                      withTimeoutOrNull(15000L) {
                          suspendCancellableCoroutine { cont ->
                              val webView = WebView(context)
                              webView.settings.javaScriptEnabled = true
                              webView.settings.domStorageEnabled = true
                              webView.settings.userAgentString =
                                  "Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Mobile Safari/537.36"

                              var finished = false

                              webView.webViewClient = object : WebViewClient() {
                                  override fun onPageFinished(view: WebView?, loadedUrl: String?) {
                                      if (finished) return
                                      webView.postDelayed({
                                          if (!finished && cont.isActive) {
                                              finished = true
                                              webView.evaluateJavascript(
                                                  "(function() { return document.documentElement.outerHTML; })();"
                                              ) { rawJson ->
                                                  val html = try {
                                                      JSONTokener(rawJson).nextValue()?.toString() ?: ""
                                                  } catch (e: Exception) {
                                                      ""
                                                  }
                                                  webView.destroy()
                                                  if (cont.isActive) cont.resume(html)
                                              }
                                          }
                                      }, 3000L)
                                  }
                              }

                              cont.invokeOnCancellation {
                                  webView.stopLoading()
                                  webView.destroy()
                              }

                              webView.loadUrl(url)
                          }
                      } ?: ""
                  }
              }

              private fun parseDomDocument(
                  doc: Document,
                  url: String,
                  usedWebView: Boolean
              ): TournamentPageData {
                  val h1 = doc.select("h1, h2, .tournament-title, .page-title, .title").firstOrNull()?.text()?.trim()
                  val tournamentTitle = if (!h1.isNullOrBlank()) h1 else doc.title().ifBlank { "Турнир ФХМ #54" }

                  val parsedTables = mutableListOf<ParsedTable>()
                  val extractedMatches = mutableListOf<HockeyMatch>()
                  val extractedPlayers = mutableListOf<List<String>>()

                  val tables = doc.select("table")
                  tables.forEachIndexed { idx, table ->
                      val headers = table.select("thead th, thead td, tr:first-child th").map { it.text().trim() }
                          .filter { it.isNotEmpty() }

                      val bodyRows = mutableListOf<List<String>>()
                      val trs = table.select("tbody tr").ifEmpty { table.select("tr") }

                      trs.forEach { tr ->
                          val cells = tr.select("td").map { it.text().trim() }
                          if (cells.size >= 2 && cells.any { it.isNotBlank() }) {
                              bodyRows.add(cells)

                              val rowJoined = cells.joinToString(" | ")
                              val scoreMatch = SCORE_REGEX.find(rowJoined)

                              if (scoreMatch != null && cells.size in 3..8 && !headers.any { it.equals("И", true) || it.equals("О", true) }) {
                                  val nonScoreCells = cells.filter { !SCORE_REGEX.containsMatchIn(it) && it.length > 2 }
                                  val home = nonScoreCells.getOrNull(0) ?: cells.first()
                                  val away = nonScoreCells.getOrNull(1) ?: cells.last()
                                  extractedMatches.add(
                                      HockeyMatch(
                                          id = "tbl_${idx}_${bodyRows.size}",
                                          homeTeam = home,
                                          awayTeam = away,
                                          scoreText = scoreMatch.value,
                                          infoLine = cells.firstOrNull() ?: "Турнир ФХМ",
                                          status = "МАТЧ",
                                          rawDetails = rowJoined
                                      )
                                  )
                              }

                              val headerString = headers.joinToString(" ").lowercase()
                              if (headerString.contains("игрок") || headerString.contains("бомбардир") || headerString.contains("фио")) {
                                  extractedPlayers.add(cells)
                              }
                          }
                      }

                      if (bodyRows.isNotEmpty()) {
                          val prevTitle = table.previousElementSibling()?.text()?.trim()?.take(60)
                          val tableName = if (!prevTitle.isNullOrBlank()) prevTitle else "Таблица #${idx + 1}"
                          parsedTables.add(ParsedTable(tableName, headers, bodyRows))
                      }
                  }

                  val matchBlocks = doc.select("[class*=match], [class*=game], [class*=event], a[href*=match], a[href*=game], a[href*=protocol]")
                  matchBlocks.forEachIndexed { idx, el ->
                      val text = el.text().trim()
                      if (text.length in 10..180) {
                          val scoreMatch = SCORE_REGEX.find(text)
                          val teamEls = el.select("[class*=team], [class*=name], [class*=club], span, div")
                              .map { it.ownText().trim() }
                              .filter { it.length in 3..35 && !it.all { ch -> ch.isDigit() } }
                              .distinct()

                          if (teamEls.size >= 2) {
                              val score = scoreMatch?.value ?: "VS"
                              val home = teamEls[0]
                              val away = teamEls[1]
                              if (extractedMatches.none { it.homeTeam == home && it.awayTeam == away && it.scoreText == score }) {
                                  extractedMatches.add(
                                      HockeyMatch(
                                          id = "blk_$idx",
                                          homeTeam = home,
                                          awayTeam = away,
                                          scoreText = score,
                                          infoLine = "ФХМ • $tournamentTitle",
                                          status = if (score == "VS") "РАСПИСАНИЕ" else "РЕЗУЛЬТАТ",
                                          rawDetails = text
                                      )
                                  )
                              }
                          }
                      }
                  }

                  val allClasses = doc.select("*[class]")
                      .flatMap { it.classNames() }
                      .groupingBy { it }
                      .eachCount()
                      .entries
                      .sortedByDescending { it.value }
                      .take(35)
                      .joinToString(", ") { "${it.key}(${it.value})" }

                  val tabLinks = doc.select("a[href*=tournament-tab], [class*=tab]")
                      .map { "${it.text().trim()} -> ${it.attr("href")}" }
                      .filter { it.length > 5 }
                      .distinct()
                      .take(15)
                      .joinToString("\n")

                  val sampleTextBlocks = doc.select("table, [class*=table], [class*=match], [class*=stand], main, .content, div")
                      .filter { it.ownText().isNotBlank() || it.tagName() == "table" }
                      .map { "${it.tagName()}.${it.className()}: ${it.text().take(140)}" }
                      .filter { it.length > 20 }
                      .distinct()
                      .take(18)
                      .joinToString("\n---\n")

                  val report = buildString {
                      appendLine("=== ОТЧЕТ ПАРСЕРА v2.0 (ТУРНИР 54) ===")
                      appendLine("URL: $url")
                      appendLine("Режим: ${if (usedWebView) "WebView (JS выполнен)" else "Прямой Jsoup"}")
                      appendLine("Title: ${doc.title()}")
                      appendLine("H1/H2: $h1")
                      appendLine("DOM-элементов: ${doc.allElements.size}")
                      appendLine("Таблиц <table>: ${parsedTables.size}")
                      appendLine("Матчей: ${extractedMatches.size}")
                      appendLine("\n--- ВКЛАДКИ ТУРНИРА ---")
                      appendLine(tabLinks.ifBlank { "Не обнаружены" })
                      appendLine("\n--- ТОП CSS-КЛАССОВ ---")
                      appendLine(allClasses)
                      parsedTables.forEachIndexed { i, t ->
                          appendLine("\n--- Таблица #${i + 1}: ${t.title} ---")
                          appendLine("Шапка: ${t.headers.joinToString(" | ")}")
                          t.rows.take(4).forEach { r ->
                              appendLine("Строка: ${r.joinToString(" | ")}")
                          }
                      }
                      appendLine("\n--- ТЕКСТОВЫЕ БЛОКИ НА СТРАНИЦЕ ---")
                      appendLine(sampleTextBlocks)
                  }

                  return TournamentPageData(
                      url = url,
                      tournamentTitle = tournamentTitle,
                      matches = extractedMatches,
                      tables = parsedTables,
                      playerRows = extractedPlayers,
                      diagnosticReport = report
                  )
              }
          }

          val KhlBgDark = Color(0xFF0B101B)
          val KhlCardDark = Color(0xFF161F30)
          val KhlAccentRed = Color(0xFFE30613)
          val KhlIceBlue = Color(0xFF00A8E8)
          val KhlTextGray = Color(0xFF8F9BB3)

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContent {
                      MaterialTheme(
                          colorScheme = darkColorScheme(
                              background = KhlBgDark,
                              surface = KhlCardDark,
                              primary = KhlAccentRed,
                              secondary = KhlIceBlue
                          )
                      ) {
                          FhmKhlAppV2()
                      }
                  }
              }
          }

          @Composable
          fun FhmKhlAppV2() {
              val context = LocalContext.current
              val scope = rememberCoroutineScope()

              var bottomTab by remember { mutableIntStateOf(1) }
              var tournamentId by remember { mutableStateOf("54") }
              var siteTabIndex by remember { mutableIntStateOf(1) }

              var pageData by remember { mutableStateOf<TournamentPageData?>(null) }
              var isLoading by remember { mutableStateOf(true) }
              var selectedMatch by remember { mutableStateOf<HockeyMatch?>(null) }
              var showIdDialog by remember { mutableStateOf(false) }

              fun reload() {
                  scope.launch {
                      isLoading = true
                      pageData = FhmTournamentParser.loadTournament(context, tournamentId, siteTabIndex)
                      isLoading = false
                  }
              }

              LaunchedEffect(tournamentId, siteTabIndex) {
                  reload()
              }

              Scaffold(
                  containerColor = KhlBgDark,
                  topBar = {
                      Column(
                          modifier = Modifier
                              .fillMaxWidth()
                              .background(KhlCardDark)
                              .padding(top = 10.dp, bottom = 8.dp)
                      ) {
                          Row(
                              modifier = Modifier
                                  .fillMaxWidth()
                                  .padding(horizontal = 14.dp),
                              horizontalArrangement = Arrangement.SpaceBetween,
                              verticalAlignment = Alignment.CenterVertically
                          ) {
                              Column(modifier = Modifier.weight(1f)) {
                                  Row(verticalAlignment = Alignment.CenterVertically) {
                                      Box(modifier = Modifier.size(9.dp).clip(CircleShape).background(KhlAccentRed))
                                      Spacer(modifier = Modifier.width(8.dp))
                                      Text(
                                          text = "ФХМ v2.0 • ТУРНИР #$tournamentId",
                                          color = KhlIceBlue,
                                          fontSize = 12.sp,
                                          fontWeight = FontWeight.Bold,
                                          modifier = Modifier.clickable { showIdDialog = true }
                                      )
                                  }
                                  Text(
                                      text = pageData?.tournamentTitle ?: "Загрузка tournament/$tournamentId...",
                                      color = Color.White,
                                      fontSize = 15.sp,
                                      fontWeight = FontWeight.Black,
                                      maxLines = 1,
                                      overflow = TextOverflow.Ellipsis
                                  )
                              }
                              IconButton(onClick = { reload() }) {
                                  Icon(Icons.Default.Refresh, contentDescription = "Обновить", tint = Color.White)
                              }
                          }

                          Row(
                              modifier = Modifier
                                  .fillMaxWidth()
                                  .horizontalScroll(rememberScrollState())
                                  .padding(horizontal = 12.dp, vertical = 6.dp),
                              horizontalArrangement = Arrangement.spacedBy(8.dp)
                          ) {
                              val siteTabs = listOf(
                                  1 to "Вкладка 1 (tab=1)",
                                  2 to "Вкладка 2 (tab=2)",
                                  3 to "Вкладка 3 (tab=3)",
                                  4 to "Вкладка 4 (tab=4)"
                              )
                              siteTabs.forEach { (idx, label) ->
                                  val active = siteTabIndex == idx
                                  Box(
                                      modifier = Modifier
                                          .clip(RoundedCornerShape(16.dp))
                                          .background(if (active) KhlAccentRed else KhlBgDark)
                                          .clickable { siteTabIndex = idx }
                                          .padding(horizontal = 12.dp, vertical = 6.dp)
                                  ) {
                                      Text(
                                          text = label,
                                          color = if (active) Color.White else KhlTextGray,
                                          fontSize = 12.sp,
                                          fontWeight = FontWeight.Bold
                                      )
                                  }
                              }

                              Box(
                                  modifier = Modifier
                                      .clip(RoundedCornerShape(16.dp))
                                      .background(KhlIceBlue.copy(alpha = 0.2f))
                                      .clickable { showIdDialog = true }
                                      .padding(horizontal = 12.dp, vertical = 6.dp)
                              ) {
                                  Text(
                                      text = "ID: $tournamentId",
                                      color = KhlIceBlue,
                                      fontSize = 12.sp,
                                      fontWeight = FontWeight.Bold
                                  )
                              }
                          }
                      }
                  },
                  bottomBar = {
                      NavigationBar(containerColor = KhlCardDark) {
                          NavigationBarItem(
                              selected = bottomTab == 0,
                              onClick = { bottomTab = 0 },
                              icon = { Icon(Icons.Default.SportsHockey, null) },
                              label = { Text("Матчи (${pageData?.matches?.size ?: 0})") }
                          )
                          NavigationBarItem(
                              selected = bottomTab == 1,
                              onClick = { bottomTab = 1 },
                              icon = { Icon(Icons.Default.FormatListNumbered, null) },
                              label = { Text("Таблицы (${pageData?.tables?.size ?: 0})") }
                          )
                          NavigationBarItem(
                              selected = bottomTab == 2,
                              onClick = { bottomTab = 2 },
                              icon = { Icon(Icons.Default.EmojiEvents, null) },
                              label = { Text("Игроки") }
                          )
                          NavigationBarItem(
                              selected = bottomTab == 3,
                              onClick = { bottomTab = 3 },
                              icon = { Icon(Icons.Default.Code, null) },
                              label = { Text("Веб / DOM") }
                          )
                      }
                  }
              ) { innerPadding ->
                  Box(
                      modifier = Modifier
                          .fillMaxSize()
                          .padding(innerPadding)
                  ) {
                      if (isLoading) {
                          Column(
                              modifier = Modifier.align(Alignment.Center),
                              horizontalAlignment = Alignment.CenterHorizontally
                          ) {
                              CircularProgressIndicator(color = KhlAccentRed)
                              Spacer(modifier = Modifier.height(12.dp))
                              Text(
                                  text = "Загрузка fhmoscow.com/tournament/$tournamentId?tournament-tab=$siteTabIndex...",
                                  color = KhlTextGray,
                                  fontSize = 12.sp,
                                  textAlign = TextAlign.Center,
                                  modifier = Modifier.padding(horizontal = 24.dp)
                              )
                          }
                      } else {
                          val data = pageData
                          if (data != null) {
                              when (bottomTab) {
                                  0 -> LiveMatchesScreen(data, onMatchClick = { selectedMatch = it })
                                  1 -> LiveTablesScreen(data)
                                  2 -> LivePlayersScreen(data)
                                  3 -> WebAndDomScreen(data)
                              }
                          }
                      }
                  }
              }

              if (showIdDialog) {
                  var tempId by remember { mutableStateOf(tournamentId) }
                  AlertDialog(
                      onDismissRequest = { showIdDialog = false },
                      containerColor = KhlCardDark,
                      title = { Text("ID турнира на fhmoscow.com", color = Color.White, fontSize = 16.sp, fontWeight = FontWeight.Bold) },
                      text = {
                          OutlinedTextField(
                              value = tempId,
                              onValueChange = { tempId = it.filter { ch -> ch.isDigit() } },
                              label = { Text("Например: 54") },
                              singleLine = true
                          )
                      },
                      confirmButton = {
                          TextButton(onClick = {
                              if (tempId.isNotBlank()) tournamentId = tempId
                              showIdDialog = false
                          }) {
                              Text("Загрузить", color = KhlIceBlue)
                          }
                      }
                  )
              }

              selectedMatch?.let { match ->
                  AlertDialog(
                      onDismissRequest = { selectedMatch = null },
                      containerColor = KhlCardDark,
                      title = {
                          Text("${match.homeTeam} — ${match.awayTeam}", color = Color.White, fontSize = 16.sp, fontWeight = FontWeight.Bold)
                      },
                      text = {
                          Column(verticalArrangement = Arrangement.spacedBy(8.dp)) {
                              Text("Счет / Статус: ${match.scoreText}", color = KhlIceBlue, fontSize = 14.sp, fontWeight = FontWeight.Bold)
                              Text(match.rawDetails, color = Color.White, fontSize = 13.sp)
                          }
                      },
                      confirmButton = {
                          TextButton(onClick = { selectedMatch = null }) {
                              Text("Закрыть", color = KhlIceBlue)
                          }
                      }
                  )
              }
          }

          @Composable
          fun LiveMatchesScreen(data: TournamentPageData, onMatchClick: (HockeyMatch) -> Unit) {
              if (data.matches.isEmpty()) {
                  Box(modifier = Modifier.fillMaxSize().padding(24.dp), contentAlignment = Alignment.Center) {
                      Text(
                          text = "На вкладке ${data.url} карточки матчей не найдены.\n\nПопробуй переключить «Вкладка 2 (tab=2)» сверху или перейди на вкладку «Веб / DOM» внизу.",
                          color = KhlTextGray,
                          fontSize = 14.sp,
                          textAlign = TextAlign.Center
                      )
                  }
                  return
              }

              LazyColumn(contentPadding = PaddingValues(12.dp), verticalArrangement = Arrangement.spacedBy(10.dp)) {
                  items(data.matches) { match ->
                      Card(
                          colors = CardDefaults.cardColors(containerColor = KhlCardDark),
                          shape = RoundedCornerShape(14.dp),
                          modifier = Modifier.fillMaxWidth().clickable { onMatchClick(match) }
                      ) {
                          Column(modifier = Modifier.padding(16.dp)) {
                              Row(modifier = Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceBetween) {
                                  Text(match.infoLine, color = KhlTextGray, fontSize = 11.sp, maxLines = 1, overflow = TextOverflow.Ellipsis, modifier = Modifier.weight(1f))
                                  Text(match.status, color = KhlIceBlue, fontSize = 11.sp, fontWeight = FontWeight.Bold)
                              }
                              Spacer(modifier = Modifier.height(10.dp))
                              Row(
                                  modifier = Modifier.fillMaxWidth(),
                                  verticalAlignment = Alignment.CenterVertically,
                                  horizontalArrangement = Arrangement.SpaceBetween
                              ) {
                                  Text(match.homeTeam, color = Color.White, fontSize = 14.sp, fontWeight = FontWeight.Bold, modifier = Modifier.weight(1f))
                                  Box(
                                      modifier = Modifier
                                          .clip(RoundedCornerShape(8.dp))
                                          .background(KhlBgDark)
                                          .padding(horizontal = 12.dp, vertical = 6.dp)
                                  ) {
                                      Text(match.scoreText, color = Color.White, fontSize = 18.sp, fontWeight = FontWeight.Black)
                                  }
                                  Text(match.awayTeam, color = Color.White, fontSize = 14.sp, fontWeight = FontWeight.Bold, textAlign = TextAlign.End, modifier = Modifier.weight(1f))
                              }
                          }
                      }
                  }
              }
          }

          @Composable
          fun LiveTablesScreen(data: TournamentPageData) {
              if (data.tables.isEmpty()) {
                  Box(modifier = Modifier.fillMaxSize().padding(24.dp), contentAlignment = Alignment.Center) {
                      Text(
                          text = "Таблицы <table> на странице ${data.url} не обнаружены.\n\nОткрой вкладку «Веб / DOM» внизу справа и нажми «Скопировать DOM», чтобы мы посмотрели верстку этой страницы.",
                          color = KhlTextGray,
                          fontSize = 14.sp,
                          textAlign = TextAlign.Center
                      )
                  }
                  return
              }

              LazyColumn(contentPadding = PaddingValues(12.dp), verticalArrangement = Arrangement.spacedBy(12.dp)) {
                  items(data.tables) { table ->
                      Card(
                          colors = CardDefaults.cardColors(containerColor = KhlCardDark),
                          shape = RoundedCornerShape(12.dp),
                          modifier = Modifier.fillMaxWidth()
                      ) {
                          Column(modifier = Modifier.padding(12.dp)) {
                              Text(
                                  text = table.title.uppercase(),
                                  color = KhlIceBlue,
                                  fontSize = 13.sp,
                                  fontWeight = FontWeight.Black,
                                  modifier = Modifier.padding(bottom = 8.dp)
                              )

                              val scrollState = rememberScrollState()
                              Column(modifier = Modifier.horizontalScroll(scrollState)) {
                                  if (table.headers.isNotEmpty()) {
                                      Row(
                                          modifier = Modifier
                                              .background(KhlBgDark, RoundedCornerShape(6.dp))
                                              .padding(vertical = 8.dp, horizontal = 8.dp)
                                      ) {
                                          table.headers.forEachIndexed { idx, h ->
                                              val w = if (idx == 1) 170.dp else 46.dp
                                              Text(
                                                  text = h,
                                                  color = KhlTextGray,
                                                  fontSize = 11.sp,
                                                  fontWeight = FontWeight.Bold,
                                                  modifier = Modifier.width(w).padding(horizontal = 4.dp)
                                              )
                                          }
                                      }
                                      Spacer(modifier = Modifier.height(4.dp))
                                  }

                                  table.rows.forEachIndexed { rIdx, row ->
                                      Row(
                                          modifier = Modifier
                                              .background(if (rIdx % 2 == 0) Color.Transparent else KhlBgDark.copy(alpha = 0.45f))
                                              .padding(vertical = 8.dp, horizontal = 8.dp),
                                          verticalAlignment = Alignment.CenterVertically
                                      ) {
                                          row.forEachIndexed { cIdx, cell ->
                                              val w = if (cIdx == 1) 170.dp else 46.dp
                                              val isHighlight = cIdx == 0 || cIdx == row.lastIndex
                                              Text(
                                                  text = cell,
                                                  color = if (isHighlight) KhlIceBlue else Color.White,
                                                  fontWeight = if (cIdx <= 1 || cIdx == row.lastIndex) FontWeight.Bold else FontWeight.Normal,
                                                  fontSize = 12.sp,
                                                  maxLines = 1,
                                                  overflow = TextOverflow.Ellipsis,
                                                  modifier = Modifier.width(w).padding(horizontal = 4.dp)
                                              )
                                          }
                                      }
                                  }
                              }
                          }
                      }
                  }
              }
          }

          @Composable
          fun LivePlayersScreen(data: TournamentPageData) {
              val rows = if (data.playerRows.isNotEmpty()) data.playerRows else data.tables.lastOrNull()?.rows ?: emptyList()

              if (rows.isEmpty()) {
                  Box(modifier = Modifier.fillMaxSize().padding(24.dp), contentAlignment = Alignment.Center) {
                      Text(
                          text = "Переключи сверху «Вкладка 3 (tab=3)» или «Вкладка 4 (tab=4)», либо открой «Веб / DOM» внизу.",
                          color = KhlTextGray,
                          fontSize = 14.sp,
                          textAlign = TextAlign.Center
                      )
                  }
                  return
              }

              LazyColumn(contentPadding = PaddingValues(12.dp), verticalArrangement = Arrangement.spacedBy(8.dp)) {
                  items(rows) { row ->
                      Card(
                          colors = CardDefaults.cardColors(containerColor = KhlCardDark),
                          shape = RoundedCornerShape(10.dp),
                          modifier = Modifier.fillMaxWidth()
                      ) {
                          Text(
                              text = row.joinToString("  •  "),
                              color = Color.White,
                              fontSize = 13.sp,
                              modifier = Modifier.padding(12.dp)
                          )
                      }
                  }
              }
          }

          @SuppressLint("SetJavaScriptEnabled")
          @Composable
          fun WebAndDomScreen(data: TournamentPageData) {
              val context = LocalContext.current
              var showLiveWeb by remember { mutableStateOf(false) }

              Column(modifier = Modifier.fillMaxSize()) {
                  Row(
                      modifier = Modifier
                          .fillMaxWidth()
                          .padding(horizontal = 12.dp, vertical = 8.dp),
                      horizontalArrangement = Arrangement.spacedBy(8.dp)
                  ) {
                      Button(
                          onClick = {
                              val clipboard = context.getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
                              clipboard.setPrimaryClip(ClipData.newPlainText("FHM_DOM", data.diagnosticReport))
                              Toast.makeText(context, "Скопировано! Вставь в чат", Toast.LENGTH_LONG).show()
                          },
                          colors = ButtonDefaults.buttonColors(containerColor = KhlAccentRed),
                          modifier = Modifier.weight(1f)
                      ) {
                          Icon(Icons.Default.ContentCopy, contentDescription = null, modifier = Modifier.size(16.dp))
                          Spacer(modifier = Modifier.width(6.dp))
                          Text("Скопировать DOM", fontSize = 12.sp, fontWeight = FontWeight.Bold)
                      }

                      Button(
                          onClick = { showLiveWeb = !showLiveWeb },
                          colors = ButtonDefaults.buttonColors(containerColor = KhlCardDark),
                          modifier = Modifier.weight(1f)
                      ) {
                          Icon(Icons.Default.Public, contentDescription = null, modifier = Modifier.size(16.dp), tint = KhlIceBlue)
                          Spacer(modifier = Modifier.width(6.dp))
                          Text(
                              text = if (showLiveWeb) "Показать отчет" else "Открыть веб-вид",
                              color = KhlIceBlue,
                              fontSize = 12.sp,
                              fontWeight = FontWeight.Bold
                          )
                      }
                  }

                  if (showLiveWeb) {
                      AndroidView(
                          modifier = Modifier.fillMaxSize(),
                          factory = { ctx ->
                              WebView(ctx).apply {
                                  settings.javaScriptEnabled = true
                                  settings.domStorageEnabled = true
                                  webViewClient = WebViewClient()
                                  loadUrl(data.url)
                              }
                          },
                          update = { webView ->
                              if (webView.url != data.url) {
                                  webView.loadUrl(data.url)
                              }
                          }
                      )
                  } else {
                      LazyColumn(
                          contentPadding = PaddingValues(12.dp),
                          modifier = Modifier.fillMaxSize()
                      ) {
                          item {
                              Card(
                                  colors = CardDefaults.cardColors(containerColor = KhlCardDark),
                                  shape = RoundedCornerShape(12.dp),
                                  modifier = Modifier.fillMaxWidth()
                              ) {
                                  Text(
                                      text = data.diagnosticReport,
                                      color = Color.White,
                                      fontSize = 11.sp,
                                      fontFamily = FontFamily.Monospace,
                                      modifier = Modifier.padding(12.dp)
                                  )
                              }
                          }
                      }
                  }
              }
          }
          EOF

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK to v2
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/fhm-tournament54-v2.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fhm-tournament54-v2
          path: app/build/outputs/apk/debug/fhm-tournament54-v2.apk
