name: Build FHM v5.1 APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download Gradle 8.7 directly
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle-8.7-bin.zip -d /tmp
          echo "/tmp/gradle-8.7/bin" >> $GITHUB_PATH

      - name: Generate v5.1 project and HD 512x512 FHM Icon
        run: |
          rm -rf app settings.gradle.kts build.gradle.kts gradle.properties
          mkdir -p app/src/main/java/com/fhm/khlstyle
          mkdir -p app/src/main/res/mipmap-mdpi
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-xhdpi
          mkdir -p app/src/main/res/mipmap-xxhdpi
          mkdir -p app/src/main/res/mipmap-xxxhdpi

          # Скачиваем векторный logo.svg с fhmoscow.com и рендерим четкую HD-иконку 512x512 (без мыла!)
          sudo apt-get update -qq && sudo apt-get install -y -qq librsvg2-bin imagemagick || true
          python3 -c '
          import urllib.request, re, subprocess
          req = urllib.request.Request("https://fhmoscow.com/", headers={"User-Agent": "Mozilla/5.0"})
          html = urllib.request.urlopen(req, timeout=10).read().decode("utf-8", "ignore")
          m = re.search(r"src=[\"\x27]([^\"\x27]*logo\.svg[^\"\x27]*)", html)
          svg_url = m.group(1) if m else "https://fhmoscow.com/dist/releases/f607e3a7e98e97903485776be7a0b2d41afce96e/img/logo.svg"
          if svg_url.startswith("/"):
              svg_url = "https://fhmoscow.com" + svg_url
          svg_data = urllib.request.urlopen(urllib.request.Request(svg_url, headers={"User-Agent": "Mozilla/5.0"}), timeout=10).read()
          open("/tmp/fhm_logo.svg", "wb").write(svg_data)
          '
          rsvg-convert -w 420 -h 420 --keep-aspect-ratio /tmp/fhm_logo.svg -o /tmp/fhm_raw.png
          convert -size 512x512 xc:"#0B101B" /tmp/fhm_raw.png -gravity center -composite /tmp/ic_512.png
          for dir in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
            cp /tmp/ic_512.png app/src/main/res/$dir/ic_launcher.png
            cp /tmp/ic_512.png app/src/main/res/$dir/ic_launcher_round.png
          done

          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "FHM_KHL_V51"
          include(":app")
          EOF

          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          EOF

          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.fhm.khlstyle"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.fhm.khlstyle"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 51
                  versionName = "5.1"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
              buildFeatures {
                  compose = true
              }
              composeOptions {
                  kotlinCompilerExtensionVersion = "1.5.14"
              }
          }

          dependencies {
              val composeBom = platform("androidx.compose:compose-bom:2024.06.00")
              implementation(composeBom)
              implementation("androidx.activity:activity-compose:1.9.0")
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-graphics")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-extended")
              implementation("org.jsoup:jsoup:1.17.2")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1")
              implementation("io.coil-kt:coil-compose:2.6.0")
              implementation("io.coil-kt:coil-svg:2.6.0")
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:allowBackup="false"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:label="ФХМ Матч-Центр"
                  android:supportsRtl="true"
                  android:usesCleartextTraffic="true"
                  android:theme="@android:style/Theme.Material.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/fhm/khlstyle/MainActivity.kt
          package com.fhm.khlstyle

          import android.content.Intent
          import android.net.Uri
          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.foundation.background
          import androidx.compose.foundation.clickable
          import androidx.compose.foundation.horizontalScroll
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.LazyColumn
          import androidx.compose.foundation.lazy.items
          import androidx.compose.foundation.rememberScrollState
          import androidx.compose.foundation.shape.CircleShape
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.material.icons.Icons
          import androidx.compose.material.icons.filled.Close
          import androidx.compose.material.icons.filled.EmojiEvents
          import androidx.compose.material.icons.filled.FormatListNumbered
          import androidx.compose.material.icons.filled.Groups
          import androidx.compose.material.icons.filled.OpenInBrowser
          import androidx.compose.material.icons.filled.Refresh
          import androidx.compose.material.icons.filled.Search
          import androidx.compose.material.icons.filled.SportsHockey
          import androidx.compose.material.icons.filled.SwapHoriz
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.draw.clip
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.layout.ContentScale
          import androidx.compose.ui.platform.LocalContext
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.text.style.TextAlign
          import androidx.compose.ui.text.style.TextOverflow
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import coil.ImageLoader
          import coil.compose.AsyncImage
          import coil.decode.SvgDecoder
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.async
          import kotlinx.coroutines.awaitAll
          import kotlinx.coroutines.coroutineScope
          import kotlinx.coroutines.delay
          import kotlinx.coroutines.launch
          import kotlinx.coroutines.withContext
          import org.json.JSONArray
          import org.json.JSONObject
          import org.jsoup.Connection
          import org.jsoup.Jsoup

          data class FhmSeasonOption(val id: Int, val name: String)
          data class FhmTournamentOption(val id: Int, val name: String, val birthYear: String)

          data class HockeyMatch(
              val id: String,
              val homeTeam: String,
              val awayTeam: String,
              val homeLogo: String,
              val awayLogo: String,
              val scoreText: String,
              val dateText: String,
              val groupName: String,
              val tourName: String,
              val statusBadge: String,
              val isFinished: Boolean,
              val isLive: Boolean,
              val gameUrl: String
          )

          data class StandingRow(
              val position: Int,
              val teamId: Int,
              val teamName: String,
              val logoUrl: String,
              val games: Int,
              val wins: Int,
              val ties: Int,
              val losses: Int,
              val otWins: Int,
              val otLosses: Int,
              val pucksScored: Int,
              val pucksMissed: Int,
              val pucksDiff: Int,
              val points: Int,
              val tieBreakNote: String,
              val groupName: String
          )

          data class StandingGroup(val groupId: Int, val groupName: String, val rows: List<StandingRow>)

          data class BestPlayerItem(
              val id: String,
              val rank: Int,
              val fullName: String,
              val shortName: String,
              val number: String,
              val roleName: String,
              val birthDate: String,
              val clubName: String,
              val clubLogo: String,
              val playerPhoto: String,
              val categoryTitle: String,
              val games: Int,
              val goals: Int,
              val assists: Int,
              val points: Int,
              val mainStatLabel: String,
              val mainStatValue: String,
              val playerUrl: String
          )

          data class TournamentPageData(
              val tournamentId: Int,
              val tournamentTitle: String,
              val siteLogoUrl: String,
              val totalUpcomingCount: Int,
              val totalPastCount: Int,
              val upcomingMatches: List<HockeyMatch>,
              val pastMatches: List<HockeyMatch>,
              val standingGroups: List<StandingGroup>,
              val playersByCategory: Map<String, List<BestPlayerItem>>,
              val allUniquePlayers: List<BestPlayerItem>,
              val seasons: List<FhmSeasonOption>,
              val selectedSeasonId: Int,
              val tournamentsForSeason: List<FhmTournamentOption>
          )

          object FhmDirectApiClient {
              private const val BASE_URL = "https://fhmoscow.com"
              private const val DEFAULT_LOGO_URL =
                  "https://fhmoscow.com/dist/releases/f607e3a7e98e97903485776be7a0b2d41afce96e/img/logo.svg"
              private const val USER_AGENT =
                  "Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Mobile Safari/537.36"

              private val YEAR_REGEX = Regex("(20[012][0-9])")

              private var cachedSeasons: List<FhmSeasonOption> = emptyList()
              private val cachedTournamentsBySeason = mutableMapOf<Int, List<FhmTournamentOption>>()
              private var cachedSiteLogo: String = DEFAULT_LOGO_URL
              private val sessionCookies = mutableMapOf<String, String>()

              // Надежный POST-запрос с сохранением cookies и автоматическим повтором (retry), чтобы ни одна категория не терялась!
              private suspend fun postApiJsonWithRetry(endpoint: String, payload: JSONObject, referer: String): String {
                  repeat(3) { attempt ->
                      try {
                          val res = Jsoup.connect("$BASE_URL$endpoint")
                              .userAgent(USER_AGENT)
                              .cookies(sessionCookies)
                              .header("Content-Type", "application/json")
                              .header("Accept", "application/json, text/plain, */*")
                              .header("X-Requested-With", "XMLHttpRequest")
                              .referrer(referer)
                              .ignoreContentType(true)
                              .maxBodySize(0)
                              .timeout(12000)
                              .method(Connection.Method.POST)
                              .requestBody(payload.toString())
                              .execute()
                          sessionCookies.putAll(res.cookies())
                          val body = res.body()
                          if (body.isNotEmpty()) return body
                      } catch (e: Exception) {
                          if (attempt < 2) delay(250L * (attempt + 1))
                      }
                  }
                  return ""
              }

              private fun parseArrayOrItems(raw: String): JSONArray {
                  val trimmed = raw.trim()
                  if (trimmed.isEmpty()) return JSONArray()
                  return try {
                      if (trimmed.startsWith("[")) {
                          JSONArray(trimmed)
                      } else if (trimmed.startsWith("{")) {
                          val obj = JSONObject(trimmed)
                          obj.optJSONArray("items") ?: obj.optJSONArray("data") ?: JSONArray()
                      } else {
                          JSONArray()
                      }
                  } catch (e: Exception) {
                      JSONArray()
                  }
              }

              // Приоритетная сортировка турниров внутри года рождения:
              // Сначала "Первенство г. Москвы" и "Кубок г. Москвы" (где Группы А, Б, В), а потом "Первый этап / Кубок ФХМ"
              fun prioritizeTournaments(list: List<FhmTournamentOption>): List<FhmTournamentOption> {
                  return list.sortedWith(compareBy<FhmTournamentOption> { opt ->
                      val lower = opt.name.lowercase()
                      when {
                          lower.contains("первенство") && lower.contains("москв") -> 1
                          lower.contains("кубок") && lower.contains("москв") -> 2
                          lower.contains("этап") -> 4
                          else -> 3
                      }
                  }.thenByDescending { it.id })
              }

              private suspend fun fetchSeasonsAndTournaments(requestedSeasonId: Int?, referer: String): Pair<Int, List<FhmTournamentOption>> {
                  if (cachedSeasons.isEmpty()) {
                      val rawSeasons = postApiJsonWithRetry("/api/filter/season", JSONObject(), referer)
                      val arr = parseArrayOrItems(rawSeasons)
                      val list = mutableListOf<FhmSeasonOption>()
                      for (i in 0 until arr.length()) {
                          val o = arr.optJSONObject(i) ?: continue
                          val sid = o.optInt("id", o.optInt("value", 0))
                          val sName = o.optString("name", o.optString("title", o.optString("label", "")))
                          if (sid > 0 && sName.isNotEmpty()) list.add(FhmSeasonOption(sid, sName))
                      }
                      if (list.isNotEmpty()) cachedSeasons = list
                  }

                  val activeSeasonId = requestedSeasonId ?: cachedSeasons.firstOrNull()?.id ?: 0
                  val existingTournaments = cachedTournamentsBySeason[activeSeasonId]
                  if (!existingTournaments.isNullOrEmpty()) {
                      return Pair(activeSeasonId, existingTournaments)
                  }

                  val req = JSONObject().apply {
                      if (activeSeasonId > 0) put("season", activeSeasonId)
                  }
                  val rawTournaments = postApiJsonWithRetry("/api/filter/tournament", req, referer)
                  val tArr = parseArrayOrItems(rawTournaments)
                  val tList = mutableListOf<FhmTournamentOption>()
                  for (i in 0 until tArr.length()) {
                      val o = tArr.optJSONObject(i) ?: continue
                      val tid = o.optInt("id", o.optInt("value", 0))
                      val tName = o.optString("name", o.optString("title", ""))
                      if (tid > 0 && tName.isNotEmpty()) {
                          val yearMatch = YEAR_REGEX.find(tName)?.value ?: ""
                          tList.add(FhmTournamentOption(tid, tName, yearMatch))
                      }
                  }

                  val sortedList = prioritizeTournaments(tList)
                  if (sortedList.isNotEmpty()) cachedTournamentsBySeason[activeSeasonId] = sortedList
                  return Pair(activeSeasonId, sortedList)
              }

              suspend fun loadFullTournament(
                  tournamentId: Int,
                  seasonId: Int? = null
              ): TournamentPageData = withContext(Dispatchers.IO) {
                  val pageUrl = "$BASE_URL/tournament/$tournamentId"

                  val doc = try {
                      val conn = Jsoup.connect(pageUrl).userAgent(USER_AGENT).timeout(10000).execute()
                      sessionCookies.putAll(conn.cookies())
                      conn.parse()
                  } catch (e: Exception) {
                      null
                  }

                  val h1 = doc?.select("h1, h2")?.firstOrNull()?.text()?.trim() ?: "Турнир ФХМ #$tournamentId"

                  if (doc != null) {
                      val logoImg = doc.selectFirst("img[src*=logo]")?.attr("abs:src") ?: ""
                      if (logoImg.isNotEmpty()) cachedSiteLogo = logoImg
                  }

                  val groupDefs = mutableListOf<Pair<Int, String>>()
                  if (doc != null) {
                      val detailsEls = doc.select("details.standings-group")
                      for (dEl in detailsEls) {
                          val gid = dEl.attr("data-standings-group").toIntOrNull()
                          val gName = dEl.select("summary span").firstOrNull()?.text()?.trim() ?: "Группа"
                          if (gid != null) groupDefs.add(Pair(gid, gName))
                      }
                  }

                  coroutineScope {
                      val catalogJob = async { fetchSeasonsAndTournaments(seasonId, pageUrl) }
                      val pastJobs = listOf(0, 8, 16).map { offset -> async { fetchGamesPage(tournamentId, "-", offset, pageUrl) } }
                      val upcomingJobs = listOf(0, 8, 16).map { offset -> async { fetchGamesPage(tournamentId, "+", offset, pageUrl) } }

                      val tableJobs = if (groupDefs.isNotEmpty()) {
                          groupDefs.map { (gid, gName) -> async { fetchStandingGroup(tournamentId, gid, gName, pageUrl) } }
                      } else {
                          listOf(async { fetchStandingGroup(tournamentId, null, "Турнирная таблица", pageUrl) })
                      }

                      val (activeSeasonId, catalogTournaments) = catalogJob.await()
                      val pastResults = pastJobs.awaitAll()
                      val upcomingResults = upcomingJobs.awaitAll()
                      val standingGroups = tableJobs.awaitAll().filter { it.rows.isNotEmpty() }

                      // Запрашиваем номинации игроков последовательными микро-пачками (по 2), чтобы сервер ФХМ гарантированно отдавал все 7 категорий!
                      val playerCategoriesSpec = listOf(
                          Triple("Бомбардиры", "bomber", null),
                          Triple("Снайперы", "sniper", null),
                          Triple("Ассистенты", "assistant", null),
                          Triple("Защитники-бомбардиры", "bomber", 2),
                          Triple("Защитники-снайперы", "sniper", 2),
                          Triple("Штрафники", "penalty", null),
                          Triple("Вратари", "goalkeeper", null)
                      )

                      val playersMap = linkedMapOf<String, List<BestPlayerItem>>()
                      for (chunk in playerCategoriesSpec.chunked(2)) {
                          val chunkResults = chunk.map { (title, nom, role) ->
                              async { Pair(title, fetchPlayersCategory(tournamentId, title, nom, role, pageUrl)) }
                          }.awaitAll()
                          for ((title, list) in chunkResults) {
                              if (list.isNotEmpty()) {
                                  playersMap[title] = list
                              }
                          }
                      }

                      val allUnique = playersMap.values.flatten().distinctBy { "${it.id}_${it.categoryTitle}" }

                      val totalPast = pastResults.maxOfOrNull { it.first } ?: 0
                      val totalUpcoming = upcomingResults.maxOfOrNull { it.first } ?: 0

                      val mergedPast = pastResults.flatMap { it.second }.distinctBy { it.id }
                      val mergedUpcoming = upcomingResults.flatMap { it.second }.distinctBy { it.id }

                      TournamentPageData(
                          tournamentId = tournamentId,
                          tournamentTitle = h1,
                          siteLogoUrl = cachedSiteLogo,
                          totalUpcomingCount = maxOf(totalUpcoming, mergedUpcoming.size),
                          totalPastCount = maxOf(totalPast, mergedPast.size),
                          upcomingMatches = mergedUpcoming,
                          pastMatches = mergedPast,
                          standingGroups = standingGroups,
                          playersByCategory = playersMap,
                          allUniquePlayers = allUnique,
                          seasons = cachedSeasons,
                          selectedSeasonId = activeSeasonId,
                          tournamentsForSeason = catalogTournaments
                      )
                  }
              }

              suspend fun loadTournamentsForSeason(seasonId: Int): List<FhmTournamentOption> = withContext(Dispatchers.IO) {
                  fetchSeasonsAndTournaments(seasonId, BASE_URL).second
              }

              suspend fun loadMoreMatches(tournamentId: Int, period: String, currentOffset: Int): List<HockeyMatch> = withContext(Dispatchers.IO) {
                  val pageUrl = "$BASE_URL/tournament/$tournamentId"
                  coroutineScope {
                      val offsets = listOf(currentOffset, currentOffset + 8, currentOffset + 16)
                      offsets.map { off -> async { fetchGamesPage(tournamentId, period, off, pageUrl).second } }
                          .awaitAll()
                          .flatten()
                          .distinctBy { it.id }
                  }
              }

              private suspend fun fetchGamesPage(tournamentId: Int, period: String, offset: Int, referer: String): Pair<Int, List<HockeyMatch>> {
                  val req = JSONObject().apply {
                      put("dateFrom", JSONObject.NULL)
                      put("dateTo", JSONObject.NULL)
                      put("limit", 8)
                      put("offset", offset)
                      put("hideTournament", JSONObject.NULL)
                      put("period", period)
                      put("tournament", tournamentId)
                  }
                  val body = postApiJsonWithRetry("/api/game/list", req, referer)
                  if (!body.startsWith("{")) return Pair(0, emptyList())

                  return try {
                      val json = JSONObject(body)
                      val count = json.optInt("count", 0)
                      val items = json.optJSONArray("items") ?: JSONArray()
                      val list = mutableListOf<HockeyMatch>()
                      for (i in 0 until items.length()) {
                          val mObj = items.optJSONObject(i) ?: continue
                          list.add(parseGameJsonItem(mObj, offset + i))
                      }
                      Pair(count, list)
                  } catch (e: Exception) {
                      Pair(0, emptyList())
                  }
              }

              private suspend fun fetchStandingGroup(tournamentId: Int, groupId: Int?, groupName: String, referer: String): StandingGroup {
                  val req = JSONObject().apply {
                      put("tournament", tournamentId)
                      if (groupId != null) put("group", groupId) else put("group", JSONObject.NULL)
                  }
                  val body = postApiJsonWithRetry("/api/tournamentTable/list", req, referer)
                  if (!body.startsWith("{")) return StandingGroup(groupId ?: 0, groupName, emptyList())

                  return try {
                      val json = JSONObject(body)
                      val items = json.optJSONArray("items") ?: JSONArray()
                      val rows = mutableListOf<StandingRow>()
                      for (i in 0 until items.length()) {
                          val rObj = items.optJSONObject(i) ?: continue
                          rows.add(
                              StandingRow(
                                  position = rObj.optInt("position", i + 1),
                                  teamId = rObj.optInt("teamId", 0),
                                  teamName = rObj.optString("team", "Команда"),
                                  logoUrl = rObj.optString("logo", ""),
                                  games = rObj.optInt("games", 0),
                                  wins = rObj.optInt("countWin", 0),
                                  ties = rObj.optInt("countTie", 0),
                                  losses = rObj.optInt("countLose", 0),
                                  otWins = rObj.optInt("countOvertimeWin", 0),
                                  otLosses = rObj.optInt("countOvertimeLose", 0),
                                  pucksScored = rObj.optInt("pucksScored", 0),
                                  pucksMissed = rObj.optInt("pucksMissed", 0),
                                  pucksDiff = rObj.optInt("pucksDifference", 0),
                                  points = rObj.optInt("score", 0),
                                  tieBreakNote = rObj.optString("tieBreakRuleLabel", ""),
                                  groupName = groupName
                              )
                          )
                      }
                      StandingGroup(groupId ?: 0, groupName, rows)
                  } catch (e: Exception) {
                      StandingGroup(groupId ?: 0, groupName, emptyList())
                  }
              }

              private suspend fun fetchPlayersCategory(tournamentId: Int, categoryTitle: String, nomination: String, role: Int?, referer: String): List<BestPlayerItem> {
                  val req = JSONObject().apply {
                      put("season", JSONObject.NULL)
                      put("tournament", tournamentId)
                      put("group", JSONObject.NULL)
                      put("limit", 50)
                      put("nomination", nomination)
                      if (role != null) put("role", role) else put("role", JSONObject.NULL)
                  }
                  val body = postApiJsonWithRetry("/api/playerStatistic/list", req, referer)
                  if (!body.startsWith("{")) return emptyList()

                  return try {
                      val json = JSONObject(body)
                      val items = json.optJSONArray("items") ?: JSONArray()
                      val list = mutableListOf<BestPlayerItem>()
                      for (i in 0 until items.length()) {
                          val pObj = items.optJSONObject(i) ?: continue
                          list.add(parsePlayerStatItem(pObj, i + 1, categoryTitle, nomination))
                      }
                      list
                  } catch (e: Exception) {
                      emptyList()
                  }
              }

              private fun parsePlayerStatItem(pObj: JSONObject, rank: Int, categoryTitle: String, nomination: String): BestPlayerItem {
                  val id = pObj.optString("id", "p_$rank")
                  val surname = pObj.optString("surname", "").trim()
                  val name = pObj.optString("name", "").trim()
                  val patronymic = pObj.optString("patronymic", "").trim()
                  val fullName = "$surname $name $patronymic".trim()
                  val shortName = "$surname $name".trim()

                  val numberInt = pObj.optInt("number", 0)
                  val numberStr = if (numberInt > 0) numberInt.toString() else ""
                  val roleName = pObj.optString("role", "")
                  val birthDate = pObj.optString("dateOfBirth", "")
                  val clubName = pObj.optString("clubName", "")
                  val clubLogo = pObj.optString("clubPhoto", "")
                  val photoRaw = if (!pObj.isNull("photo")) pObj.optString("photo", "") else ""
                  val playerUrl = "$BASE_URL${pObj.optString("url", "/player/$id")}"

                  val statObj = pObj.optJSONObject("statistics") ?: JSONObject()
                  val games = statObj.optInt("games", 0)
                  val goals = statObj.optInt("goals", 0)
                  val assists = statObj.optInt("assists", 0)
                  val points = statObj.optInt("goalPasses", goals + assists)
                  val penalty = statObj.optInt("penalty", statObj.optInt("penaltyMinutes", 0))

                  val (mainLabel, mainVal) = when (nomination) {
                      "sniper" -> Pair("ШАЙБЫ", goals.toString())
                      "assistant" -> Pair("ПАСЫ", assists.toString())
                      "penalty" -> Pair("ШТРАФ", penalty.toString())
                      else -> Pair("ОЧКИ", points.toString())
                  }

                  return BestPlayerItem(
                      id = id,
                      rank = rank,
                      fullName = fullName,
                      shortName = shortName,
                      number = numberStr,
                      roleName = roleName,
                      birthDate = birthDate,
                      clubName = clubName,
                      clubLogo = clubLogo,
                      playerPhoto = photoRaw.ifEmpty { clubLogo },
                      categoryTitle = categoryTitle,
                      games = games,
                      goals = goals,
                      assists = assists,
                      points = points,
                      mainStatLabel = mainLabel,
                      mainStatValue = mainVal,
                      playerUrl = playerUrl
                  )
              }

              private fun parseGameJsonItem(mObj: JSONObject, index: Int): HockeyMatch {
                  val id = mObj.optString("id", "idx_$index")
                  val dateStr = mObj.optString("displayDate", mObj.optString("date", ""))
                  val groupStr = mObj.optString("group", "")
                  val tourStr = mObj.optString("tour", "")
                  val statusInt = mObj.optInt("status", 0)
                  val isLive = mObj.optBoolean("isLive", false)
                  val overtime = mObj.optBoolean("overtime", false)
                  val shootout = mObj.optBoolean("shootout", false)
                  val gameUrl = mObj.optString("url", "/game/$id")

                  val t1 = mObj.optJSONObject("team1")
                  val t2 = mObj.optJSONObject("team2")

                  val homeTeam = t1?.optString("name", "Команда 1") ?: "Команда 1"
                  val awayTeam = t2?.optString("name", "Команда 2") ?: "Команда 2"
                  val homeLogo = t1?.optString("logo", "") ?: ""
                  val awayLogo = t2?.optString("logo", "") ?: ""

                  val s1 = if (t1 != null && !t1.isNull("score")) t1.opt("score").toString() else null
                  val s2 = if (t2 != null && !t2.isNull("score")) t2.opt("score").toString() else null

                  val suffix = when {
                      shootout -> " Б"
                      overtime -> " ОТ"
                      else -> ""
                  }

                  val scoreText = if (s1 != null && s2 != null) "$s1 : $s2$suffix" else "VS"
                  val statusBadge = when {
                      isLive -> "LIVE"
                      statusInt == 2 -> "ОКОНЧЕН"
                      else -> mObj.optString("date", "МАТЧ")
                  }

                  return HockeyMatch(
                      id = id,
                      homeTeam = homeTeam,
                      awayTeam = awayTeam,
                      homeLogo = homeLogo,
                      awayLogo = awayLogo,
                      scoreText = scoreText,
                      dateText = dateStr,
                      groupName = groupStr,
                      tourName = tourStr,
                      statusBadge = statusBadge,
                      isFinished = (statusInt == 2),
                      isLive = isLive,
                      gameUrl = "$BASE_URL$gameUrl"
                  )
              }
          }

