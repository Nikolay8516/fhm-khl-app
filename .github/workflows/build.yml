          @Composable
          fun SearchFieldBar(
              query: String,
              placeholder: String,
              onQueryChange: (String) -> Unit
          ) {
              OutlinedTextField(
                  value = query,
                  onValueChange = onQueryChange,
                  placeholder = { Text(placeholder, color = KhlTextGray, fontSize = 13.sp) },
                  leadingIcon = {
                      Icon(Icons.Default.Search, contentDescription = null, tint = KhlIceBlue)
                  },
                  trailingIcon = {
                      if (query.isNotEmpty()) {
                          IconButton(onClick = { onQueryChange("") }) {
                              Icon(Icons.Default.Close, contentDescription = "Очистить", tint = KhlTextGray)
                          }
                      }
                  },
                  singleLine = true,
                  shape = RoundedCornerShape(12.dp),
                  colors = OutlinedTextFieldDefaults.colors(
                      focusedContainerColor = KhlCardDark,
                      unfocusedContainerColor = KhlCardDark,
                      focusedBorderColor = KhlIceBlue,
                      unfocusedBorderColor = Color.Transparent,
                      focusedTextColor = Color.White,
                      unfocusedTextColor = Color.White
                  ),
                  modifier = Modifier
                      .fillMaxWidth()
                      .padding(horizontal = 12.dp, vertical = 8.dp)
              )
          }

          @Composable
          fun StatMiniBox(label: String, value: String, highlight: Boolean = false) {
              Column(horizontalAlignment = Alignment.CenterHorizontally) {
                  Text(label, color = if (highlight) KhlAccentRed else KhlTextGray, fontSize = 10.sp, fontWeight = FontWeight.Bold)
                  Text(
                      text = value,
                      color = if (highlight) KhlIceBlue else Color.White,
                      fontSize = 16.sp,
                      fontWeight = FontWeight.Black
                  )
              }
          }

          @Composable
          fun KhlPlayersScreen(
              categoryPlayers: List<BestPlayerItem>,
              allTournamentPlayers: List<BestPlayerItem>,
              searchQuery: String,
              onSearchChange: (String) -> Unit,
              onPlayerClick: (BestPlayerItem) -> Unit
          ) {
              // Если строка поиска пуста — показываем выбранную номинацию, а если вводится запрос — ищем по ВСЕМ номинациям сразу!
              val displayedPlayers = remember(categoryPlayers, allTournamentPlayers, searchQuery) {
                  if (searchQuery.isBlank()) {
                      categoryPlayers
                  } else {
                      val q = searchQuery.trim()
                      allTournamentPlayers.filter { p ->
                          p.fullName.contains(q, ignoreCase = true) ||
                              p.clubName.contains(q, ignoreCase = true) ||
                              p.number == q
                      }.distinctBy { it.id }
                  }
              }

              Column(modifier = Modifier.fillMaxSize()) {
                  SearchFieldBar(
                      query = searchQuery,
                      placeholder = "Поиск по всем номинациям (ФИО, клуб, номер)...",
                      onQueryChange = onSearchChange
                  )

                  if (displayedPlayers.isEmpty()) {
                      Box(modifier = Modifier.fillMaxSize().padding(24.dp), contentAlignment = Alignment.Center) {
                          Text(
                              text = if (searchQuery.isNotBlank()) "По запросу «$searchQuery» среди лидеров турнира совпадений нет." else "В этой номинации пока нет данных.",
                              color = KhlTextGray,
                              fontSize = 14.sp,
                              textAlign = TextAlign.Center
                          )
                      }
                      return@Column
                  }

                  LazyColumn(
                      contentPadding = PaddingValues(horizontal = 12.dp, vertical = 4.dp),
                      verticalArrangement = Arrangement.spacedBy(10.dp)
                  ) {
                      items(displayedPlayers) { p ->
                          Card(
                              colors = CardDefaults.cardColors(containerColor = KhlCardDark),
                              shape = RoundedCornerShape(14.dp),
                              modifier = Modifier.fillMaxWidth().clickable { onPlayerClick(p) }
                          ) {
                              Row(
                                  modifier = Modifier.fillMaxWidth().padding(12.dp),
                                  verticalAlignment = Alignment.CenterVertically,
                                  horizontalArrangement = Arrangement.SpaceBetween
                              ) {
                                  Row(
                                      modifier = Modifier.weight(1f),
                                      verticalAlignment = Alignment.CenterVertically
                                  ) {
                                      Text(
                                          text = "${p.rank}",
                                          color = if (p.rank <= 3) KhlAccentRed else KhlTextGray,
                                          fontWeight = FontWeight.Black,
                                          fontSize = 15.sp,
                                          modifier = Modifier.width(24.dp)
                                      )
                                      AsyncImage(
                                          model = p.playerPhoto,
                                          contentDescription = p.fullName,
                                          contentScale = ContentScale.Crop,
                                          modifier = Modifier
                                              .size(42.dp)
                                              .clip(CircleShape)
                                              .background(Color.White.copy(alpha = 0.08f))
                                      )
                                      Spacer(modifier = Modifier.width(10.dp))
                                      Column(modifier = Modifier.weight(1f)) {
                                          Row(verticalAlignment = Alignment.CenterVertically) {
                                              Text(
                                                  text = p.shortName,
                                                  color = Color.White,
                                                  fontWeight = FontWeight.Bold,
                                                  fontSize = 14.sp,
                                                  maxLines = 1,
                                                  overflow = TextOverflow.Ellipsis
                                              )
                                              if (p.number.isNotEmpty()) {
                                                  Spacer(modifier = Modifier.width(6.dp))
                                                  Text(
                                                      text = "#${p.number}",
                                                      color = KhlIceBlue,
                                                      fontWeight = FontWeight.Black,
                                                      fontSize = 12.sp
                                                  )
                                              }
                                          }
                                          Text(
                                              text = "${p.clubName} • ${p.roleName}",
                                              color = KhlTextGray,
                                              fontSize = 11.sp,
                                              maxLines = 1,
                                              overflow = TextOverflow.Ellipsis
                                          )
                                      }
                                  }

                                  Row(
                                      horizontalArrangement = Arrangement.spacedBy(10.dp),
                                      verticalAlignment = Alignment.CenterVertically
                                  ) {
                                      Column(horizontalAlignment = Alignment.CenterHorizontally) {
                                          Text("И", color = KhlTextGray, fontSize = 10.sp)
                                          Text("${p.games}", color = Color.White, fontSize = 13.sp, fontWeight = FontWeight.SemiBold)
                                      }
                                      Column(horizontalAlignment = Alignment.CenterHorizontally) {
                                          Text("Г", color = KhlTextGray, fontSize = 10.sp)
                                          Text("${p.goals}", color = Color.White, fontSize = 13.sp, fontWeight = FontWeight.SemiBold)
                                      }
                                      Column(horizontalAlignment = Alignment.CenterHorizontally) {
                                          Text("П", color = KhlTextGray, fontSize = 10.sp)
                                          Text("${p.assists}", color = Color.White, fontSize = 13.sp, fontWeight = FontWeight.SemiBold)
                                      }
                                      Box(
                                          modifier = Modifier
                                              .clip(RoundedCornerShape(8.dp))
                                              .background(KhlBgDark)
                                              .padding(horizontal = 10.dp, vertical = 4.dp),
                                          contentAlignment = Alignment.Center
                                      ) {
                                          Column(horizontalAlignment = Alignment.CenterHorizontally) {
                                              Text(p.mainStatLabel, color = KhlAccentRed, fontSize = 9.sp, fontWeight = FontWeight.Bold)
                                              Text(p.mainStatValue, color = KhlIceBlue, fontSize = 15.sp, fontWeight = FontWeight.Black)
                                          }
                                      }
                                  }
                              }
                          }
                      }
                  }
              }
          }

          @Composable
          fun ClubsDirectoryScreen(
              clubs: List<StandingRow>,
              searchQuery: String,
              onSearchChange: (String) -> Unit,
              onSelectClubMatches: (String) -> Unit,
              onClubDetails: (StandingRow) -> Unit
          ) {
              val filteredClubs = remember(clubs, searchQuery) {
                  if (searchQuery.isBlank()) {
                      clubs
                  } else {
                      val q = searchQuery.trim()
                      clubs.filter { c ->
                          c.teamName.contains(q, ignoreCase = true) ||
                              c.groupName.contains(q, ignoreCase = true)
                      }
                  }
              }

              Column(modifier = Modifier.fillMaxSize()) {
                  SearchFieldBar(
                      query = searchQuery,
                      placeholder = "Поиск клуба или группы (например: ЦСКА, Центр)...",
                      onQueryChange = onSearchChange
                  )

                  if (filteredClubs.isEmpty()) {
                      Box(modifier = Modifier.fillMaxSize().padding(24.dp), contentAlignment = Alignment.Center) {
                          Text("Клубы по запросу «$searchQuery» не найдены.", color = KhlTextGray, fontSize = 14.sp)
                      }
                      return@Column
                  }

                  LazyColumn(
                      contentPadding = PaddingValues(horizontal = 12.dp, vertical = 4.dp),
                      verticalArrangement = Arrangement.spacedBy(8.dp)
                  ) {
                      items(filteredClubs) { club ->
                          Card(
                              colors = CardDefaults.cardColors(containerColor = KhlCardDark),
                              shape = RoundedCornerShape(12.dp),
                              modifier = Modifier.fillMaxWidth().clickable { onClubDetails(club) }
                          ) {
                              Row(
                                  modifier = Modifier.fillMaxWidth().padding(12.dp),
                                  verticalAlignment = Alignment.CenterVertically,
                                  horizontalArrangement = Arrangement.SpaceBetween
                              ) {
                                  Row(modifier = Modifier.weight(1f), verticalAlignment = Alignment.CenterVertically) {
                                      AsyncImage(
                                          model = club.logoUrl,
                                          contentDescription = club.teamName,
                                          contentScale = ContentScale.Fit,
                                          modifier = Modifier.size(38.dp).clip(CircleShape).background(Color.White.copy(alpha = 0.08f)).padding(4.dp)
                                      )
                                      Spacer(modifier = Modifier.width(10.dp))
                                      Column {
                                          Text(club.teamName, color = Color.White, fontWeight = FontWeight.Bold, fontSize = 14.sp)
                                          Text("${club.groupName} • Место: ${club.position} • Очки: ${club.points}", color = KhlTextGray, fontSize = 12.sp)
                                      }
                                  }
                                  TextButton(onClick = { onSelectClubMatches(club.teamName) }) {
                                      Text("Матчи ->", color = KhlIceBlue, fontSize = 12.sp, fontWeight = FontWeight.Bold)
                                  }
                              }
                          }
                      }
                  }
              }
          }

          @Composable
          fun KhlStandingsScreen(group: StandingGroup?, onTeamClick: (StandingRow) -> Unit) {
